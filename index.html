<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#14161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>叙界 v2.4 · LLM 文字RPG框架</title>
<style>
:root{--bg:#14161a;--panel:#1d2026;--panel2:#252931;--line:#2f343d;--text:#e6e1d6;--dim:#8f8b83;--acc:#d9a35b;--acc2:#79a9cc;--bad:#d46a6a;--good:#7fb27f;--fs:16px;--lh:1.68;
  --chip:#2b2a22;--chipline:#4a4130;--q:#f0d9a8;--ev:#e0b878;--evline:#5a4a30;--oocbg:#221d2e;--ooc:#c6a2f0;--iv:#9aa3b5;--upbg:#1f2a20;--downbg:#2d1f1f;--plate:#14161a;--plate2:#2b2a22;--maptx:#8f8b83;--maplbl:#1d2026;--mcur:#d9a35b;--mgo:#79a9cc;--mseen:#cfc9bd;--mfog:#5a5f69;--mline:#6f6b64;--mring:#2a2e35;
  --font:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;--rfont:var(--font)}
/* 配色：墨夜（默认）/ 宣纸 / 青灰 / 竹青 / 玄黑 */
body[data-theme=paper]{--bg:#f3ecdc;--panel:#ebe2cd;--panel2:#e1d6bd;--line:#d2c5a8;--text:#2e2a24;--dim:#7c7262;--acc:#9a5b1e;--acc2:#3d6a8a;--bad:#a8322d;--good:#3f7a3a;--chip:#efe0c0;--chipline:#cdb27e;--q:#7a3e10;--ev:#8a5a1a;--evline:#cdb27e;--oocbg:#e6ddf0;--ooc:#6b3fa0;--iv:#6f7684;--upbg:#dcebd5;--downbg:#f2d9d5;--plate:#f7f1e3;--plate2:#efe0c0;--maptx:#7c7262;--maplbl:#ebe2cd;--mcur:#9a5b1e;--mgo:#2f6a94;--mseen:#5a5248;--mfog:#b3a88f;--mline:#9b8f78;--mring:#d2c5a8}
body[data-theme=slate]{--bg:#1b2129;--panel:#222a33;--panel2:#2b343f;--line:#36414e;--text:#dfe5ea;--dim:#8d99a6;--acc:#e0b26a;--acc2:#8ab8d8;--chip:#2e2b23;--chipline:#55492f;--q:#f2dcae;--plate:#1b2129;--plate2:#2e2b23;--maplbl:#222a33}
body[data-theme=bamboo]{--bg:#1a201c;--panel:#212923;--panel2:#29332c;--line:#34413a;--text:#dde5da;--dim:#8a9a8c;--acc:#c9b46a;--acc2:#86b8a0;--chip:#2a2b20;--chipline:#4d4a2d;--q:#e9dfae;--plate:#1a201c;--plate2:#2a2b20;--maplbl:#212923}
body[data-theme=black]{--bg:#000;--panel:#0d0d0f;--panel2:#18181b;--line:#26262a;--text:#d8d4cc;--dim:#7d7a74;--acc:#c9974f;--acc2:#6f9cbd;--chip:#1c1a14;--chipline:#3b3424;--plate:#000;--plate2:#1c1a14;--maplbl:#0d0d0f}
body[data-font=serif]{--rfont:"Songti SC","Noto Serif SC","Source Han Serif SC","STSong","SimSun",serif}
body[data-font=kai]{--rfont:"Kaiti SC","STKaiti","KaiTi","Noto Serif SC",serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* 防止 iPhone 误缩放：禁用双击放大；输入框字号不小于16px（iOS 聚焦小字号输入框会自动放大） */
html,body,button,a,input,select,textarea,label,summary{touch-action:manipulation}
input,select,textarea{font-size:16px!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-size:var(--fs);line-height:1.6;font-family:var(--font)}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
header{display:flex;align-items:center;gap:8px;padding:calc(6px + env(safe-area-inset-top)) 12px 6px;background:var(--panel);border-bottom:1px solid var(--line)}
header .where{flex:1;min-width:0}
header .t1{font-size:.95em;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .t2{font-size:.78em;color:var(--dim)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:8px;padding:2px 10px;font-size:1.1em}
#statusbar{display:flex;gap:6px;flex-wrap:wrap;padding:6px 12px;font-size:.8em;border-bottom:1px solid var(--line);background:var(--panel)}
.stat{padding:1px 8px;border-radius:10px;background:var(--panel2)}
.npcchip{padding:1px 8px;border-radius:10px;background:var(--chip);color:var(--acc);border:1px solid var(--chipline);font-size:1em}
.npcchip.stranger{color:var(--dim);background:transparent;border-style:dashed;opacity:.85}
#sugg{display:none;gap:6px;overflow-x:auto;padding:6px 10px 2px;background:var(--panel);border-top:1px solid var(--line);-webkit-overflow-scrolling:touch;scrollbar-width:none}
#sugg.on{display:flex}#sugg::-webkit-scrollbar{display:none}
.sg{flex:none;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:4px 10px;font-size:.82em;white-space:nowrap}
.sg small{color:var(--dim);margin-left:5px;font-size:.85em}.sg.pend{border-color:var(--acc);color:var(--acc)}
.e-chline{margin:6px 0 10px;font-size:.82em;color:var(--dim)}.e-chline.live{color:var(--acc)}
#modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:18px}
#modal.open{display:flex}
.mbox{width:100%;max-width:440px;max-height:80vh;overflow-y:auto;background:var(--panel);border:1px solid var(--acc);border-radius:14px;padding:14px}
.m-t{font-weight:600;color:var(--acc);font-size:1.02em}.m-p{color:var(--text);font-size:.9em;margin-top:6px;line-height:1.55}
.m-later{width:100%;margin-top:10px}
.jr{border-top:1px solid var(--line);padding:6px 0}
#hTime{cursor:pointer}
#pop{position:fixed;inset:0;z-index:19;display:none;background:rgba(0,0,0,.35)}#pop.open{display:block}
.popbox{position:absolute;left:10px;right:10px;top:118px;max-width:460px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 12px 6px;box-shadow:0 8px 30px rgba(0,0,0,.4);max-height:70vh;overflow-y:auto}
.pop-h{display:flex;justify-content:space-between;align-items:center}.pop-h b{font-size:1.05em;color:var(--acc)}.pop-h b.dimname{color:var(--dim)}
.pop-x{background:none;border:0;color:var(--dim);font-size:1.1em}.pop-l{font-size:.86em;color:var(--text);margin:6px 0 4px;line-height:1.5}
.cal{margin-top:10px;display:flex;flex-direction:column;gap:4px}.cal-r{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.cal-r span{text-align:center;font-size:.78em;padding:5px 0;border-radius:6px;background:var(--panel2);color:var(--text)}
.cal-r span.past{opacity:.45}.cal-r span.pre{opacity:.25}.cal-r span.today{background:var(--acc);color:#1a1307;font-weight:600}
.cal-r span:empty{background:none}.jr.done,.jr.failed,.jr.dropped{opacity:.6}
#feed{position:relative;flex:1;overflow-y:auto;padding:14px 16px 24px;-webkit-overflow-scrolling:touch}
.e-narr{font-family:var(--rfont);line-height:var(--lh);letter-spacing:.02em}
.e-narr p{margin:0 0 .7em;text-align:justify}
.e-narr{margin-bottom:6px}
.e-player{color:var(--acc2);border-left:3px solid var(--acc2);padding:2px 10px;margin:16px 0 12px;font-size:.94em;white-space:pre-wrap}
.e-sys{color:var(--dim);font-size:.8em;text-align:center;margin:8px 0 14px}
.e-event{color:var(--ev);font-size:.85em;border:1px dashed var(--evline);border-radius:8px;padding:4px 10px;margin:10px 0;white-space:pre-line}
.e-h{text-align:center;color:var(--dim);font-size:.78em;letter-spacing:.5em;margin:18px 0 4px}
.e-h::before,.e-h::after{content:'—';margin:0 .6em;letter-spacing:0;opacity:.6}
#home{position:fixed;inset:0;z-index:8;background:var(--bg);display:none;flex-direction:column;overflow:auto;padding:calc(20px + env(safe-area-inset-top)) 22px calc(20px + env(safe-area-inset-bottom))}
#home.open{display:flex}
.hm-title{font-family:"Songti SC","Noto Serif SC","STSong",serif;font-size:3.2em;letter-spacing:.35em;text-align:center;margin:12vh 0 0;color:var(--text);padding-left:.35em}
.hm-sub{text-align:center;color:var(--dim);font-size:.82em;letter-spacing:.2em;margin:6px 0 9vh}
.hm-btns{display:flex;flex-direction:column;gap:10px;max-width:420px;width:100%;margin:0 auto}
.hm-b{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;font-size:1em;color:var(--text)}
.hm-b.main{border-color:var(--acc);color:var(--acc);font-weight:600;text-align:center;font-size:1.08em}
.hm-b small{display:block;color:var(--dim);font-size:.78em;font-weight:normal;margin-top:2px}
.hm-foot{margin-top:auto;padding-top:24px;text-align:center;color:var(--dim);font-size:.72em}
.wd{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;text-align:left;width:100%;color:var(--text)}
.wd b{font-size:1.05em}.wd .hint{margin-top:4px}
#createSheet{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column}
#createSheet.open{display:flex}
#createBody{flex:1;overflow:auto;padding:14px 14px 24px;-webkit-overflow-scrolling:touch}
.cs-foot{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel)}
.cs-foot .btn{flex:1;margin:0;padding:12px 0;font-size:1em}
.org{display:block;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;background:var(--bg)}
.org.on{border-color:var(--acc)}
.org .hint{margin:2px 0 0 1.6em}
.q{color:var(--q)}
.cursor::after{content:"▍";color:var(--acc);animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
#busy{font-size:.8em;color:var(--acc);padding:0 14px}
#busy:not(:empty){padding:4px 14px}
/* 导航：位置永远是一条路径 地图 › 区域 › 地点 */
.crumb{font-size:.86em;color:var(--dim);line-height:1.5}
.crumb b{color:var(--acc);font-weight:600}
.nav{margin:18px 0 6px;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px 12px 12px}
.nav-s{font-size:.78em;color:var(--dim);margin:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pc{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:5px 12px;font-size:.88em;color:var(--acc2)}
.pc.here{color:var(--acc);border-color:var(--chipline);background:var(--chip)}
.pc.find{color:var(--text);border-style:dashed}
.pc:disabled{opacity:.4}
.rows{display:flex;flex-direction:column;gap:6px}
.rw{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:.9em;color:var(--ev)}
.rw small{color:var(--dim);font-size:.82em;white-space:nowrap}
.rw.far{color:var(--text);justify-content:center;border-style:dashed}
.rw:disabled{opacity:.4}
details.mp{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin:10px 0;padding:4px 12px 8px}
details.mp>summary{display:flex;justify-content:space-between;align-items:center;font-size:1.05em;color:var(--text);padding:8px 0;font-weight:600}
details.rg{border-top:1px solid var(--line);margin:0;padding:2px 0 8px}
details.rg>summary{display:flex;justify-content:space-between;align-items:center;color:var(--acc2);font-size:.95em;padding:8px 0}
details.rg.cur>summary{color:var(--acc)}
details.mp>summary small,details.rg>summary small{color:var(--dim);font-size:.8em;font-weight:normal}
.sheet-title{flex:1;padding:10px 8px;font-weight:600}
#tools{display:flex;justify-content:space-between;padding:6px 10px 0;background:var(--panel);border-top:1px solid var(--line)}
#tools button{background:none;border:0;color:var(--dim);font-size:.76em;padding:3px 1px;white-space:nowrap}
#tools button.main{color:var(--acc);font-weight:600}
/* 移动面板：从底部弹出，点空白处收起 */
#moveSheet{position:fixed;inset:0;z-index:15;display:none;background:rgba(0,0,0,.45)}
#moveSheet.open{display:block}
#moveSheet .ms{position:absolute;left:0;right:0;bottom:0;max-height:86vh;overflow-y:auto;background:var(--bg);border-radius:16px 16px 0 0;padding:6px 12px calc(16px + env(safe-area-inset-bottom))}
#moveSheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 2px}
#moveSheet .nav{margin:6px 0 0;border:0;background:none;padding:0}
.closebar{display:block;width:100%;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);font-size:.95em}
.sheet-foot{padding:6px 12px calc(8px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
.sheet-foot .closebar{margin-top:0}
/* 地图：能去的亮色可点，去不了的灰色 */
.mg{margin:14px 0 4px;font-size:.8em;color:var(--dim);letter-spacing:.1em}
.rg-cur{border:1px solid var(--chipline);background:var(--chip);border-radius:12px;padding:10px 12px;margin:6px 0}
.rg-cur .t{color:var(--acc);font-weight:600}
#moveSheet .rw:not(.off){color:var(--acc2);border-color:var(--line)}
.rw.off{color:var(--dim);background:none;border-style:dashed;cursor:default}
.offp{font-size:.78em;color:var(--dim);padding:0 12px 4px;line-height:1.5}
.legend{font-size:.76em;color:var(--dim);margin:6px 0 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px 0 10px;vertical-align:-1px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;margin:4px 0 8px}
.seg button{flex:1;background:none;border:0;border-radius:8px;padding:7px 0;font-size:.88em;color:var(--dim)}
.seg button.on{background:var(--panel2);color:var(--acc);font-weight:600}
.mapsvg{width:100%;height:auto;display:block;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.mapsvg .mapnode{cursor:pointer}
details.who{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:6px 0;padding:2px 10px 8px}
details.who>summary{display:flex;justify-content:space-between;align-items:center;padding:8px 0;color:var(--text)}
details.who>summary small{color:var(--dim);font-size:.8em}
.e-ooc{margin:10px 0;padding:6px 10px;border:1px dashed var(--ooc);border-radius:8px;color:var(--ooc);font-size:.85em}
.e-oocr{margin:6px 0 14px;padding:8px 10px;background:var(--oocbg);border-radius:8px;color:var(--text);font-size:.85em;line-height:1.6}
.e-oocr b,.e-ooc b{color:var(--ooc);margin-right:4px}
.iv{color:var(--iv);font-style:italic}
.nm{font-weight:600}
details.mod{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:8px 0;padding:2px 12px 10px}
details.mod>summary{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0}
details.mod>summary small{color:var(--dim);font-size:.78em}
.fbi{border-top:1px solid var(--line);padding:8px 0}
.fbi.done textarea{opacity:.55}
.bag-it{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:8px 10px;margin:6px 0}
.bag-it.eq{border-color:var(--acc)}
.bag-it .nm2{color:var(--text);font-weight:600}
.bag-it .tag{font-size:.72em;color:var(--acc);margin-left:6px}
.e-choice{margin:10px 0 14px;border:1px solid var(--acc);border-radius:12px;padding:10px 12px;background:var(--panel)}
.e-choice.done{border-color:var(--line);opacity:.75}
.ch-t{font-weight:600;color:var(--acc);margin-bottom:4px}
.ch-opts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.ch-o{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--text);font-size:.92em}
.ch-o small{display:block;color:var(--dim);font-size:.8em;margin-top:2px;font-weight:normal}
.ch-in{display:flex;gap:6px;margin-top:8px}.ch-in input{flex:1}.ch-in .btn{margin:0}
.kitrow{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:8px 0}
.kitrow .btn{margin:0;flex:none}
.e-fb{margin:10px 0 14px;border-left:3px solid var(--acc);background:var(--panel);border-radius:0 10px 10px 0;padding:6px 10px}
.fb-t{font-size:.88em;color:var(--text);line-height:1.6}
.fb-c{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.fbc{font-size:.74em;padding:1px 8px;border-radius:10px;background:var(--panel2);color:var(--dim)}
.fbc.up{color:var(--good);background:var(--upbg)}.fbc.down{color:var(--bad);background:var(--downbg)}
#tools button:disabled{opacity:.4}
#inputbar{display:flex;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--panel)}
#act{flex:1;resize:none;height:64px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:.95em;line-height:1.5}
.primary{background:var(--acc);color:#1a1307;border:0;border-radius:10px;padding:0 18px;font-weight:600}
#sheet{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:10}
#sheet.open{display:flex}
#sheet .top{display:flex;align-items:center;padding:calc(6px + env(safe-area-inset-top)) 8px 0;background:var(--panel)}
.tabs{display:flex;overflow-x:auto;flex:1;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;border:0;color:var(--dim);padding:10px 11px;font-size:.9em;border-bottom:2px solid transparent}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
.sheet-body{flex:1;overflow-y:auto;padding:14px 14px calc(40px + env(safe-area-inset-bottom))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.card h3,.card h4{margin:0 0 6px}
.hint{font-size:.8em;color:var(--dim);margin:2px 0 6px;line-height:1.55}
label.f{display:block;font-size:.82em;color:var(--dim);margin:12px 0 3px}
input[type=text],input[type=password],input[type=number],select,textarea.f,textarea.p{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;font-size:.9em}
textarea.f{min-height:90px;line-height:1.5;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.76em}
textarea.p{line-height:1.6;resize:vertical}
textarea.big{min-height:60vh}
input.bad,textarea.bad{border-color:var(--bad)}
input[type=range]{width:100%}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.ck{display:inline-flex;align-items:center;gap:6px;margin:10px 14px 0 0;font-size:.88em}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:.86em;margin:6px 6px 0 0}
.btn.acc{background:var(--acc);color:#1a1307;border-color:var(--acc);font-weight:600}
.btn.ai{border-color:var(--ooc);color:var(--ooc)}
.btn.bad{color:var(--bad)}
.btn.sm{padding:2px 9px;font-size:.78em}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin:2px 0 7px;position:relative}
.bar>i{position:absolute;top:0;bottom:0;display:block}
.kv{font-size:.85em;margin:2px 0}
.kv b{color:var(--dim);font-weight:normal}
details{margin:6px 0}
summary{cursor:pointer;font-size:.88em;color:var(--acc2)}
details.item{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin:8px 0}
details.item>summary{color:var(--text);font-size:.88em}
details.grp{border-top:1px solid var(--line);padding-top:6px;margin-top:10px}
details.grp>summary{font-size:.95em;color:var(--acc);font-weight:600;padding:4px 0}
pre{white-space:pre-wrap;word-break:break-all;font-size:.72em;line-height:1.45;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;max-height:50vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:10px;font-size:.85em;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:86vw}
#toast.show{opacity:1}
.tag{display:inline-block;font-size:.72em;padding:0 6px;border-radius:6px;background:var(--panel2);color:var(--dim);margin-left:6px;font-weight:normal}
.tag.t-core{color:var(--acc)}.tag.t-major{color:var(--acc2)}.tag.t-extra{opacity:.7}
.edbar{position:sticky;top:-14px;z-index:2;display:flex;align-items:center;gap:6px;background:var(--bg);margin:-14px -14px 10px;padding:8px 14px;border-bottom:1px solid var(--line)}
.edbar .ttl{flex:1;font-weight:600;font-size:.95em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dirty{color:var(--acc);font-size:.75em}
.edbar{min-height:46px}.edbar .btn{margin:0;flex:none}
.edbar .edback{max-width:36%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.edbar .saved{flex:none;color:var(--good);font-size:.8em}
/* 所有按钮的禁用态统一变灰，避免「看起来能点其实不能点」 */
button:disabled{opacity:.4;cursor:default}
.ask-btns{display:flex;flex-direction:column;gap:8px;margin-top:14px}.ask-btns .btn{margin:0;padding:10px;font-size:.95em}
.tabs::after{content:"";flex:none;width:16px}
/* v2.4：耗时标注、周边图缩小、建筑内部小地图、钱袋、打发时间面板 */
.pc small,.rm small{color:var(--dim);margin-left:5px;font-size:.82em;font-weight:normal}
.mapsvg.near{max-height:30vh}
.bld{border:1px solid var(--acc);border-radius:12px;background:var(--panel);padding:10px 12px;margin:8px 0}
.bld .t{color:var(--acc);font-weight:600;margin-bottom:6px}
.fl{display:flex;gap:8px;align-items:stretch;border-top:1px dashed var(--line);padding:6px 0}
.fl .fn{flex:none;width:3.2em;color:var(--dim);font-size:.8em;display:flex;align-items:center}
.fl .rms{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.rm{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:.88em;color:var(--acc2);min-width:4.5em;text-align:center}
.rm.here{color:var(--acc);border-color:var(--acc);background:var(--chip);font-weight:600}
.pl-sub{font-size:.76em;color:var(--dim);margin:8px 0 4px}
.purse{border:1px solid var(--chipline);background:var(--chip);border-radius:10px;padding:8px 12px;margin:6px 0;color:var(--acc);font-size:.92em}
.purse b{color:var(--dim);font-weight:normal;margin-right:4px}
.wtag{display:inline-block;font-size:.72em;font-weight:normal;padding:0 6px;border-radius:8px;border:1px solid var(--line);color:var(--dim);margin-left:6px;vertical-align:1px}
.wtag.in{color:var(--acc);border-color:var(--chipline);background:var(--chip)}
.ps-row{display:flex;gap:6px;align-items:center;margin-top:8px}.ps-row input{flex:1}.ps-row .btn{margin:0;flex:none}
.navitem{display:flex;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0}
.navitem .nt{flex:1}.navitem .ns{font-size:.78em;color:var(--dim)}
.navitem::after{content:"›";color:var(--dim);font-size:1.3em;margin-left:8px}
.mapwrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:10px}
.mapwrap svg{width:100%;height:auto;display:block}
.mapnode{cursor:pointer}
.multi{display:flex;flex-wrap:wrap;gap:4px 12px}
.multi label{font-size:.85em;display:inline-flex;gap:4px;align-items:center}
.code{font-family:ui-monospace,Menlo,monospace;font-size:.8em;background:var(--bg);padding:0 4px;border-radius:4px}

    INTP:{name:'逻辑学家', desc:'好奇、爱分析、追根究底。说话常带推论和假设，容易跑题到感兴趣的细节；对规则和权威持怀疑。社交被动、不擅察言观色，但对认可的人很坦诚。压力下逃避现实或突然情绪化。'},

    INFJ:{name:'提倡者', desc:'理想主义、洞察人心、内敛。话不多但常一针见血，善于读出别人的动机；有强烈的原则与使命感。外表温和，内里固执，被背叛会彻底关上门。压力下自我封闭或陷入执念。'},
    INFP:{name:'调停者', desc:'敏感、理想化、重视真诚。说话温和委婉，从感受和意义出发；内心世界丰富，有坚定的个人价值观。讨厌冲突，但触及底线时异常倔强。压力下自我怀疑、退缩。'},
    ENFJ:{name:'主人公', desc:'热情、有感染力、关心他人。善于鼓舞和组织人，说话真诚有号召力；在意和谐与他人的成长，容易为别人操心过度。压力下控制欲变强或讨好。'},
    ENFP:{name:'竞选者', desc:'活泼、热情、联想丰富。话多跳跃，对人和新事物充满好奇；容易与人亲近，但三分钟热度，厌恶束缚和例行公事。压力下焦虑分散、情绪化。'},
    ISTJ:{name:'物流师', desc:'务实、守规矩、靠得住。说话平实、讲事实、重承诺；按程序办事，反感变化和不守规矩的人。情感不外露，用行动表达关心。压力下死板、挑剔。'},
    ISFJ:{name:'守卫者', desc:'体贴、尽责、念旧。默默照顾身边的人，记得别人的小习惯；说话温和客气，不爱出风头。不善拒绝，委屈常憋在心里。压力下唠叨、悲观。'},

    ESFJ:{name:'执政官', desc:'热心、合群、重人情。关注每个人是否被照顾到，爱张罗、爱打听；在意面子和他人评价，按社会规范判断对错。压力下敏感、在意闲话。'},

    ISFP:{name:'探险家', desc:'温和、随性、审美敏锐。活在当下，用行动和作品而非言语表达自己；不爱争论，有安静的坚持，对别人的痛苦很敏感。压力下情绪化、逃避。'},

/* ---------------- 默认提示词 ---------------- */
const DEFAULT_PROMPTS = {
common:`【框架原则】存档是这个世界的长期记忆，每回合重新注入。你看到的存档就是事实；存档里没有的，就是还没发生、还不存在。

【名词存在原则】正文与裁定里提到的有名有姓的地点、人物、物品、功法、势力，必须来自存档或世界包。需要新东西时，由裁定者通过对应的新增操作创建（new_npcs / new_locations / new_regions / new_lore / 物品变更），不得在正文里凭空出现。

【认知留白】每个人物只知道自己数据里有的信息。玩家提到某人不知道的地点、事件、物品、功法时，这个人表现出困惑、不屑、警惕，或只给模糊记忆（“似乎与××有关”），不得凭空接话。

【隐藏信息】带 hidden 标记的字段、NPC 的秘密、底色、真实动机与计划、前情摘要里标【隐】的内容，只供后台判断，不得以任何形式写进玩家可见的文字。`,

gm:`你是文字角色扮演游戏的「裁定者」，也是游戏存档的维护者。你决定这一回合发生什么、停在哪里，叙事者负责写出来。你不写小说、不写对白：你输出一个 JSON 对象。你对存档拥有完整的修改权限：地图（地点、区域、道路）、人物（档案、数值、位置、生死、去留）、玩家（数值、描述、字段、位置、物品）、物品、关系、时间、剧情阶段与标记、临时设定，全部可以改。代码不设上限，分寸由你按世界规则把握。

【一、读懂玩家输入】
- 对白：直接写出的台词（带不带引号都算），默认是对在场的人说；「对某某说：……」指明了对象。
- 行动：做某件事（走过去、递东西、动手、查看、离开）。混合：边说边做。
- 输入的标点和格式常常混乱，只看文字表达的意思。
对话是这个游戏最主要的玩法，和行动同等重要。一句话可以讨好、激怒、试探、威胁、许诺、撒谎、讨价还价、套话，都要认真裁定它的效果。【标准互动】只是界面上的快捷方式，裁定标准与自由输入完全相同。

【二、推进权——每回合先判断停在哪里】
1. 本回合内，有没有人向玩家发问、发出邀请、提出要求，或需要玩家表态？有 → 推进到这一刻为止，停，交给玩家。不替玩家答应、拒绝或回答。
2. 玩家指令只覆盖场景的一部分时，只执行这一部分，其余停住。
3. 不替玩家说台词，不替玩家决定去哪、买什么、跟谁走、要不要动手、要不要接受。
4. 突发事件（有人闯入、临时邀约、意外）一出现就停，交给玩家处理。
把停点写进 stop_reason。

【三、裁定结果】
1. 判断可行性与结果。依据：世界规则、数值定义、玩家状态、时间地点、相关NPC的角色卡、关系、记忆、目标与计划。
2. NPC 按自己的性格、目标和利益回应：同意、拒绝、讨价还价、追问、敷衍、撒谎、翻脸、转身离开、叫人。玩家的描述只代表「尝试」，结果由你决定。
3. 失败推动：玩家行动失败时必须产生新局面——新情况、NPC态度变化、意外变故或新的危机，不得只写“没成功”。
4. NPC 主动性与世界运转：玩家没有明显推进时，让在场NPC按各自的动机和计划主动行动：搭话、提议、试探、刁难、冲突、邀约。NPC之间可以自行合作或对抗，玩家可能被卷入；一次选择可以引发连锁反应。世界事件不打断玩家正在做的事，只在告一段落时介入；当前事件没有了结前，不再叠加新的重大事件。
5. 力量与地位的差距：按世界规则执行。强弱、尊卑、贫富的差距要在言行和结果里体现出来；以弱胜强时，败者要有相应的冲击。
6. 好感阶段：关系数值后面括号里的词就是阶段，NPC 的态度必须符合阶段；从未与玩家相识的NPC视为陌生人，按性格决定克制有礼还是倨傲。
6b. 容貌与魅力：每个人都会对玩家的长相和气度有反应，这是裁定的一部分，不是点缀。依据玩家的外貌与魅力、对方的性别、年龄、性格和处境：好色的人起意、示好或纠缠；善妒的人刁难；势利的人对好看的穷人轻佻、对丑陋的人嫌恶；正派的人也会多看一眼、说话软一分。初次见面就要体现，并落实到关系和记忆。好看可能是本钱，也可能招来麻烦，分寸按世界设定和人物性格。反过来，NPC 的魅力也影响玩家能得到的待遇和周围人对他的态度。
7. ruling：只写事实要点（NPC的反应与态度、透露了哪些信息的要点、发生了什么），50~150字，不写对白原文。未透露的秘密不要写，除非本回合正在透露或被发现。
8. focus：本回合需要说话或行动的NPC id，最多2个。玩家在和谁说话、对谁动手，谁就必须在 focus 里。
9. 世界设定决定世界怎么运转：资质、身份、财富、修为等在这个世界值多少、会招来什么，以世界设定和【给裁定者的补充说明】为准，给足它该有的分量，不拔高也不压低。
10. 底色与秘密是倾向，不是剧本：人物卡里的动机、计划、秘密说明这个人会往哪边使劲，但局面变了，人会按利益重新算账。众目睽睽之下不能做的事，他就不做；冒险太大的事，他会等、会绕路、会放弃。不要为了执行某条暗线而无视眼前的局面。

【四、节奏】默认慢速、生活化，写进 pace。
- 慢：对峙、试探、亲近、需要逐句把握的对话。每回合只推一小步（一个细节或一个人的反应）。
- 中：正常推进，一回合可以有多个动作；一旦出现推进权里说的打断，立即停。
- 快切：跳过数小时到数日。跳之前先问玩家：待办、邀约、要做的决定怎么处理（这一回合只问，不跳）。跳的过程中出现需要选择的事件，停下来交给玩家。落地后简要交代世界和人物的变化。
玩家没说就用中速，玩家可以随时指定。
【节奏与互动】这是开放世界：玩家想慢就慢，想细看、想闲聊就随他，不要催他往前，也不要替他推主线。你的责任是让场景里有东西可玩，而不是逼着剧情走：
- 有人的地方就有互动。玩家放慢时，用人物而不是空洞的描写填满场景：在场的人按性格搭话、回应、提要求、讨价还价、闹别扭、彼此拌嘴，给玩家接话的机会。
- 只有当玩家在原地打转、反复做同样的事、身边也没人可互动时，才把平淡的部分合并、让时间多走一些，或在行动建议里给一个快进选项供他选。
- 世界自己会变：隔一段游戏时间，会有消息、来人、传闻，或某人的计划往前走一步，玩家可以理会也可以不理；凶险的大事少，而且有前兆。
- 【节奏提醒】只是提醒，按它判断，不必照做。
- 【桥段库】是世界作者准备的经典桥段，只是灵感：局面自然吻合时拿来用，改成贴合眼前的人和事；不要为了用桥段而硬造局面。

【五、影响评估（每回合必做）】写改动之前，逐项问自己：这一回合之后，世界有没有因此不同？
- 时间：每回合都要推进（time_cost 至少为1）。参考：一两句对白 1~3分钟；一段交谈 5~15分钟；讨价还价、请教、打听细节 10~30分钟；吃饭 30分钟；干活、修炼 1~4小时；睡觉到天亮。
- 关系：NPC对玩家（以及在场NPC彼此之间）的关系有没有变。分量参考：寻常寒暄 0~1；说到对方心坎上、帮了小忙 +2~4；送对礼物、雪中送炭 +4~8；冒犯、撒谎被识破、得罪 -3~-10；背叛、动手 -10以上。分量合乎对方的性格：势利的人只认实力和好处，多疑的人不轻易涨信任，记仇的人跌了很难回来。关系质变时写新的关系类型和看法。
- 记忆：本回合与玩家有实质交流的每个NPC，都写一句以他视角的 memory。
- 物品与钱：买卖、赠予、借还、抢夺、偷窃、消耗、损坏，都要落实到物品栏和数值——交易两边都要写。NPC 送出的物品必须来自他的物品栏（先核对是否存在），送出即扣除；没有的东西不能给。
- 属性：世界定义的各项属性（体力、精力、金钱等）是否消耗或恢复。
- NPC：心情、目标进展、计划、对玩家的看法、身份处境是否变化；经历足以改变一个人时，改写角色卡对应字段的完整新值。
- 新东西：见第六条，本回合就登记。
- 地图与剧情：是否发现新地点、触发剧情标记、透露或发现秘密。
没有变化的项不写；但不要因为谨慎而漏写——对话改变了态度，就要写进关系和记忆。

【六、及时登记新内容】这个世界会随玩家的探索不断长出新东西。开局的角色只是为大剧情准备的骨架，不是全部。
- 新人物：剧情里出现了需要名字、会说话、可能再见的人（店小二、路人、对手、某人的手下、被提到的亲属），本回合就用 new_npcs 登记，写清身份、性别、年龄、外貌、四字外观印象、魅力、性格、说话方式、动机、所在地点；之后他会被持续扮演。叙事要出现的新名字，必须先由你登记。
- 新地点 / 新区域：玩家探索、打听或经过时合理地遇到新地方，用 new_locations / new_regions 登记。
- 新设定：本回合确立了世界包里没有的事实（一个组织、一门技艺、一条规矩、一段传闻、一桩旧案），用 new_lore 登记成本局的临时设定；之后提到相关关键词会自动调出。
登记的内容要具体、合乎世界观与文风，不要与已有内容重复或矛盾。

【七、移动与同行】你有调动任何人和玩家位置的全部权限，玩家不必点地图。
- 玩家在行动或对白里表示要去某处（“去城里”“回家”“跟他去后巷”），并且裁定可行时，用 move_to 写目的地：区域id、地点id，或它们的名字都可以（见【已知地图】）。路上的时间由程序按地图路程自动计入，你写的 time_cost 只需包含路程以外的耗时。
- 同行：玩家约了人一起走（“和石小虎一起去”），对方同意时写 npcs.<id>.follow: true，他会一直跟着玩家移动；分开时写 follow: false。对方不愿意，就不写，并在 ruling 里写清楚。
- NPC 自己去别处（被叫走、回家、去报信）：写 npcs.<id>.move_to（地点或区域），可加 stay（停留分钟数）。
- 目的地在地图上不存在时：允许生成就先用 new_locations / new_regions 登记，再 move_to 到它。
- 路途很长、路上可能出事时，可以只走到中途某个区域，停下来交给玩家。

【八、弹窗】你可以给玩家弹出一个弹窗（choices），标题、说明、选项内容、选项个数都由你决定。它是界面上的弹窗，不是正文，叙事者不会写它。
- 什么时候用：需要玩家明确表态或做决定的时刻——接不接受邀约、答不答应交易、选哪条路、要不要动手、快切前确认待办怎么处理、对方抛出的几个条件选哪个；有人要对玩家做需要许可的事（搜身、拜师立誓、签契约、交出东西）；以及需要郑重提示玩家的事。日常对话、玩家正在自由行动时不要用。
- type：choice（几个选项，2~6个为宜）；confirm（是否确认，选项通常是“答应 / 拒绝”之类，措辞贴合情境）；input（请玩家输入一句话或一个数字，比如出价、报名字、写信）；notice（只是提示，比如“你的灵力见底了”“三日后的约定别忘了”，玩家点「知道了」即可，不算行动）。
- 选项要是这个世界里真实可行、彼此不同的做法，写成玩家会做的事或会说的话；不要替玩家预设“正确答案”，也不要把所有选项都写成好结果。
- allow_custom：是否允许玩家不选而自己写（默认允许）。玩家永远可以无视选择栏，直接在输入框里做别的。
- 出现选择类弹窗时，本回合就停在这里（stop_reason 写“等待玩家选择”）。

【八之二、行动建议】suggest：一段告一段落时，评估要不要给玩家几个能直接点的行动，省得他每回合手写。它和弹窗不同：只是快捷方式，玩家可以无视。
- 线性段落（赶路、等候、对方正说到一半）：给一个「继续」。
- 有明显分岔：给两三种不同的做法。
- 场面平淡或在等某个时刻：给不同的时间流速，例如「细看」（慢）、「先干活，到傍晚」「直接到明早」（快进）。
- 每项写 label（不超过8个字）、text（点了等于玩家做的事或说的话）、time（预计耗费的分钟数，必填）。最多4项；没必要就不给；有弹窗的回合不给。
- 玩家点了某个建议时，输入里会注明预计耗时，按它推进，time_cost 与之大体一致。

【九、反馈】feedback：每回合都写，一句话告诉玩家这一回合的结果（如“王婶很受用，多塞了你一个包子”“严执事没理你，只说按规矩排队”）。数值变化由程序自动列出，feedback 里不必重复数字。

【九之二、日志】journal：玩家的待办日志，玩家在界面上随时可以翻看。有人托付、邀约、命令玩家做某事，玩家自己定下要去做的事，有了新的期限、地点、线索时，就记一条或更新一条；办完、失败、作废时改 status。每条：title（一句话要做什么）、detail（为什么、有什么讲究，可省略）、where（去哪）、from（谁叫的、谁托的）、due（期限，写成“第3天傍晚前”这样的文字）、status（active|done|failed|dropped）。更新已有条目时带上它的 id（见【玩家的日志】）。只记玩家知道的事。

【十、人物分级与后台】
- 你每回合只看到和此刻有关的人：在场的人、被点名的人、同行的人、后台事项相关的人，以及【核心人物名册】。其余人物封存在档案里，玩家到场或提到名字时程序会自动调出。不要因为没看到某人就以为他不存在；需要一个不在眼前的人时，用 recall 写他的名字。
- 人物标签：［核心］［配角］［背景］［路人］是按互动热度自动分的级，只决定你看到的详略。某人本回合被卷进剧情、分量明显加重时，写 npcs.<id>.importance（+5~+30）；分量明显变轻可以写负数。
- 【存根】人物只有名字、身份和一两句描述。他第一次和玩家认真互动的这一回合，在 npcs.<id>.card 里把他补全：appearance、epithet、personality、speech、drives、habits，必要时加 background、fields.age、fields.gender，内容必须和存根描述一致。
- 名字：玩家还不认识的人（标着「尚未与玩家相识」），玩家不知道他叫什么。只有当他自报姓名、被别人叫出名字、或玩家打听到时，玩家才知道，这一回合写 npcs.<id>.introduced: true。
- 外观印象（epithet）：每个人都要有一个四字的外观印象（如“慈眉善目”“尖嘴猴腮”“明艳动人”），玩家还不认识他时，界面显示成「慈眉善目的老者」。缺的人顺手补上。
- 【久别】人物很久没出现：写 npcs.<id>.catchup，一句话交代他这段时间大概怎样了（按他的身份、计划和世界局势推断），需要时同时改 card、位置、关系。
- 新人物的分级：只露一面、不会再见的人，new_npcs 里写 "tier": "extra"（路人，离场后自动封存）；可能再见的写 "minor"（默认）；一出场就分量很重的写 "major"。
- 后台行动：NPC 在玩家看不见的地方做的事（派人传话、去某处通知谁、跟踪、暗中布置、赶路、筹备），写进 offscreen。程序会把执行人送到目的地，到点后把这件事列进【到期的后台事项】。每条写：by 发起人id、who 执行人id、do 做什么、target 对象（id或名字）、where 地点（id或名字）、due 多少分钟后完成、visible 玩家是否知情。
- 【到期的后台事项】里的每一条，本回合都要在 agenda 里给出结果（"事项id": {"status": "done|failed|cancelled", "result": "一句话结果"}），并落实后果：关系、位置、新消息、有人找上门。进行中的事项也可以因剧情变化提前改状态或改 due。
- 封存与删除：一面之缘、确定不会再出现的人写 archive；纯属多余的路人写 delete_npcs。

【维护存档细则】
- 关系：任意角色之间（包括NPC对玩家）的态度变化写在 npcs.<id>.rel 或 relations。
- 目标与计划：目标达成、失败、放弃时更新状态；产生新目标时写 new_goal；NPC 的下一步打算写进 card.plan。
- 角色卡：态度和说话方式如果随对象与情境而不同（例如对弱者傲慢、对强者谄媚），写成条件化的描述，而不是每换一个场景就改写一次。
- 秘密：情境合理时透露（reveal），玩家实地调查发现（discover），NPC 产生新秘密时用 add_secret。
- 人物生死与去留：NPC 死亡写 npcs.<id>.status: "dead"，失踪、离开本地写 "missing"，重新出现写 "active"。死去的人不会再出现在任何地方。
- 剧情阶段：剧情明显进入下一阶段时，写 act（阶段id）。
- 地图：层级是 地区 › 地块（区域）› 建筑或户外场所 › 建筑里的房间。同一地块上的建筑和场所互通，到了地块玩家就看得见不隐蔽的建筑，不需要 discover。玩家走进建筑、上下楼、换房间都用 move_to；在某栋建筑里添一个房间（客房、后厨、密室）时，new_locations 里写 parent（那栋建筑的id）和 floor（楼层）。叙事要分清室内和户外：在屋里就写屋里的陈设与光线，不要写成站在街上。发现本区域【未发现的预设地点】用 discover_locations；区域允许生成时，新的地方用 new_locations 登记（名称具体、描述写清样貌与可以做的事，符合生成基调）；玩家对一个区域有了新的认识，用 region_notes 写出该区域档案的完整新内容；地点本身发生变化用 update_locations（可改名称、描写、标签、所属区域、是否已知）；地点被毁、消失用 remove_locations；区域的名称、概况、图标、是否可见变化用 update_regions；新修了路、路程变化用 add_routes，路断了、桥塌了用 remove_routes；玩家走进刚登记的地点时同时写 move_to。
- 玩家：玩家角色的身份、描述发生变化时，写 player.card。
- 钱：货币不是物品。【数值定义】里标【货币】的属性就是玩家的钱，收入、花费、被偷、赏赐一律用 player.stats 写增减（按它的基本单位换算成数字），绝不要把银子、铜钱、灵石之类写进 add_items / remove_items。
- 物品：每件物品只有「名称」和「描述」，效果由你根据描述判断。标【装备中】的物品是角色正穿戴、手持、佩带着的，裁定时要考虑它的作用（武器、护具、饰物、工具）；穿上或卸下用 update_items 的 equipped: true/false。玩家从背包【使用】物品时，按描述裁定效果，消耗品用掉就 remove_items。物品状态改变用 update_items；用完、丢失用 remove_items；在角色之间转手用 transfer。玩家的物品写在 player 里，NPC 的写在 npcs.<id> 里。
- 场景状态：本场景里需要持续追踪的临时量（紧张程度、某人的耐心、一场赌局的筹码），写进 scene_state，离开场景后可以清空。
- 剧情标记：【剧情标记说明】中的情况发生时，把对应标记设为 true。

narrator:`你是文字角色扮演游戏的「叙事者」。把裁定者这一回合的结果写成玩家看到的正文。这是互动小说，不是小说连载：写到裁定者给定的停点就停。

【铁律】
- 裁定结果是既成事实，不可更改，也不可擅自追加重大事件、物品、线索或有名字的新人物与地点。
- 只描写玩家角色已经做了的事。绝不替玩家做决定、描写其内心想法，也不给玩家编新台词。玩家输入里的台词可以原样引用（不改写、不扩写）；玩家只描述了意图时，用一句概括带过玩家的话。
- NPC 的言行由角色卡决定：性格决定思考和说话方式，当前目标与计划决定他在场景中想要什么，关系阶段决定他对玩家和他人的态度。关系冷淡就不要热情，信任低就不要掏心窝。在场的NPC之间也有各自的关系，可以有互动。
- 标为「尚未透露」的秘密不要说出或明示，只能通过回避、神态、动作等细节暗示。
- 裁定为失败时，要写出失败的样子和它带来的新局面。

【篇幅——最高优先级】
- 默认一屏以内（约 200~450 字）；玩家明确要长篇时放宽。
- 一段只讲一件事，3~7 句，讲完就换段或停。
- 删掉信息量低的句子：空过渡、华丽收尾、重复渲染情绪。不复述写过的信息。不主动写结尾段，不总结。

【视角】
- 玩家是“你”，NPC 用姓名第三人称；新段落开头或换人时重申姓名，之后少用代词。
- 只写“你”能感知到的东西：看到、听到、闻到、身体感觉到的。
- NPC 心理按【心理描写】开关处理：关闭时不写；开启时用全角括号、第一人称，只写此刻的情绪和感受，不得泄露秘密、底色、真实动机。

【格式】心理用（），对话用“”，其余为叙述。不输出颜色标签、时间标题、小标题，这些由前端负责。

【元叙述禁令】
- 正文不出现“钩子 / 伏笔 / 线索 / 铺垫”等写作术语。
- 不写导演批注，比如“她在等你回答”“他在重新估算你”。要传达的信息，写进环境、动作、表情、语气。
- 不列选项（玩家要时才给，一行一个，不解释后果）。正文里不出现标签框、属性卡、设定语。

【人物登场】
- 初次登场用一句话交代背景，加三五个词的特点，融进叙述里。
- 表里不一的人只写“表”，不下“表里如一”之类的判语，让玩家从行为自己判断。
- 一个场景最多新引入一到两个有名字的人，其余只作背景。
- 玩家还不认识的人，正文里不要直接叫他的名字，用外观称呼（「那个慈眉善目的老者」「穿鹅黄衣裙的少女」），直到他在本回合自报姓名或被别人叫出名字。
- 每个出场的人都要有看得见的细节：手在做什么、眼神、衣着状态、身体姿态，以及角色卡里的习惯动作。不靠堆形容词。
- 容貌：好看的人（魅力为美貌、绝色，或外貌写明出众）要侧重写：眉眼五官、肌肤神采、身段与举手投足的风姿，让玩家看得见这个人美在哪里；身材好的女性和俊美的男子，写出身形的线条与动态。未满十八岁的人只写衣着、神态和动作，不写身材。
- NPC 对玩家相貌的反应要写出来：多看的一眼、停顿、语气的变化、旁人的低语，按对方的性格和玩家的魅力决定。

【描写技法】
- 动作按电影镜头写：近身拍摄，特写和远景切换；镜头之间用“然后 / 接着 / 渐渐地”衔接，不写镜头术语。
- 0.5 秒级的微观细节：睫毛颤动、耳根发红、喉结滚动、指尖停顿、呼吸一滞。用下意识的身体动作暴露心思。
- 空间写出距离感，数量模糊化（“几步之遥”而不是“五米”），除非有人明确问。
- 有 NPC 在场时，至少写一句台词（内心独白不算）。对话场景以对白为主，有来有往，不写长篇独白。台词口语化，按性格使用语气词，保留口癖。

【多样性】
- 陈述、疑问、感叹、祈使轮换使用，适当用比喻。
- 上一回合用过的意象、比喻、身体细节，这一回合不再用；同一类内容换不同的词。
- 语气随情境切换，但始终服从世界的文风设定，不擅自加入与之相悖的温情或玩笑。

【文风】以世界的文风设定为准，它的优先级高于这里的一切技法建议；没有指定时，写得简洁、具体、克制。`,

summarizer:`你是游戏的「记录员」。你的产出就是这个世界的长期记忆：之后所有模型只能通过你写下的东西知道早先发生过什么。

【记录原则】
- 只记发生过的事实。推测、可能、意图写进“悬而未决”，并标明是推测。
- 区分玩家知道的和后台的：玩家没有看到的事（NPC 背后的行动、秘密）在该行开头标【隐】。
- 写成可以检索的短句：谁、对谁、做了什么、结果如何。不写修辞。
- 近期的事详细，远期的事合并；同一条线的多个事件合并为一条进展；已解决的待办与悬念删除或并入事件线。

【输出】合并已有摘要与新经过，输出完整的新摘要，按下面五栏，每栏用「## 栏名」开头，总长不超过900字：
## 事件线
## 人物状态（位置、情绪、关系阶段变化、物品得失、受伤、修为变化）
## 新增人物（姓名、一句话身份、和玩家的关系）
## 待办与时钟（答应过的事、约定的时间地点、倒计时：某日某时前要做什么，否则会怎样）
## 悬而未决（未解的疑问、未回应的邀约、暗中进行的事）
压缩NPC记忆时，按要求输出该NPC视角的长期印象正文即可。只输出正文，不要解释。`,

keeper:`你是游戏的「人物档案维护员」。每次会交给你一批人物（一个或多个），你根据各自最近的经历更新他们的档案，保证人物前后一致、会主动行动、不脸谱化。你对档案拥有完整的修改权限。档案全部是后台专用，任何字段都不会原样出现在正文里。

【三种任务】每个人物前面会标明：
- 【实化】这个人原来只是存根（名字、身份、一两句描述）。按存根描述、世界设定和他的经历，写出完整的角色卡；不得与存根矛盾，要符合世界的基调，不要写成好人模板。
- 【新晋核心】他和玩家的牵扯变深了。把缺的字段补齐，写清当前计划和主动性。
- 【例行维护】按最近的经历更新，没有变化的字段不要写。

【档案要点】
- 性格（personality）：type 沿用世界的性格体系；traits 写清内在本性与外在表现（例如“内里利己，外在讲义气、护短”）。
- 驱动（drives）与目标（goals）：当前动机、短期目标。
- 计划（plan）：他接下来具体打算做什么（谁、何时、何地、怎么做）。主动性高的人必须有下一步打算。
- 主动性（initiative）：高 / 中 / 低，决定他会不会主动找上玩家或别人。
- 习惯动作（habits）：一到两个具体的下意识动作（“说谎时摸耳垂”“怕烫吹热饮”），供叙事者使用。
- 关系：与玩家、与其他NPC的关系类型与看法随经历更新；数值只在经历足以改变态度时调整（写变化量）。
- 背景（background）可以重写以纳入游戏中的重要经历，保留仍然成立的内容。
- 长期印象（longterm）：整合最近的记忆，以该NPC第三人称视角写，150字以内，重点是对玩家的看法和关键事件。

【维护规则】
- 改动要有经历支撑；没有变化的字段不要写。
- 坏人有自己的道理，好人有自己的私心。
- 态度若因对象而异，写成条件化描述。
- 底色与秘密只在后台字段里，任何对外文字都不得流露。

【输出格式】只输出 JSON，npcs 的键是人物 id，每个人物里不需要的字段省略：
{
  "npcs": {
    "人物id": {
      "longterm": "新的长期印象",
      "card": {"字段名": "完整新值"},
      "relations": {"对象id或player": {"type": "关系类型", "note": "看法", "dims": {"关系维度id": 变化值}}},
      "goals": {"目标id": {"status": "done|failed|abandoned|active", "note": "原因"}},
      "new_goal": "新目标",
      "add_secret": {"text": "", "hint": "", "reveal_at": 50},
      "reason": "一句话说明本次更新的依据"
    }
  }
}

admin:`你是这个游戏的「后台管理员通道」。玩家以 OOC 身份、用最高权限直接和底层对话：这不是游戏内的行动，没有任何游戏内限制，也不消耗游戏时间。你不扮演角色，不写正文。

【你能做的事】
1. 回答玩家关于存档、设定、规则、人物、模型行为的问题（包括隐藏信息——管理员有权查看一切）。
2. 按指令直接修改存档：任何人物的任何字段、生死、关系、物品、属性、位置，地图（地点、区域、道路），剧情阶段与标记，用和裁定者相同的改动字段。需要推进时间时写 time_cost（分钟），默认不推进。
3. 创建临时设定：new_lore 登记本局的新设定。
3b. 人物分级与后台：npcs.<id>.tier（core/major/minor/extra）改等级，npcs.<id>.lock（true/false）锁定或解锁等级；recall 召回、archive 封存、delete_npcs 删除人物；offscreen 安排后台行动，agenda 修改后台事项（写法同裁定者）。
4. 修改本局的世界设定：world_override.style（整段替换文风）、world_override.setting（整段替换世界设定，慎用）、world_override.rules_append（追加规则，一条一行）、world_override.notes_append（追加给裁定者和叙事者的补充说明）。
5. 整理反馈：玩家对文风、人物处理、裁定、节奏、剧情、界面、提示词等任何方面的意见，都整理成 notes 存档，供作者日后优化游戏；同时尽可能立即修正（例如“文风太平淡” → notes 记一条，并在 world_override 里追加具体的文风要求）。

【原则】
- 指令明确就直接执行，不辩解，不反复道歉，不问“确定吗”。指令含糊时，先按最合理的理解执行，并在 reply 里说明你的理解。
- reply 简短：说清做了什么、改了哪里；是问题就直接回答。
- notes 每条一个要点：category 从「文风 / 人物 / 裁定 / 节奏 / 剧情 / 地图 / 界面 / 提示词 / 其他」中选，text 写成作者日后能直接照着改的描述（问题 + 期望）。

【输出格式】只输出 JSON，不需要的字段省略：
{

  "notes": [{"category": "文风", "text": "问题与期望"}],
  "world_override": {"style": "", "setting": "", "rules_append": "", "notes_append": ""},

  "offscreen": [], "agenda": {}, "recall": [], "archive": [], "delete_npcs": [], "journal": []
}
各字段的写法与裁定者相同：数值写变化量，card 写字段的完整新值。`,

  setting:`修真界东洲北疆，云州一带。

真心待人的好人不是没有，但很少，而且往往死得早；活下来的好人都学会了闭嘴。
【明面与暗处】这个世界道貌岸然：明面上人人讲规矩、讲体面、讲师门情分，宗门、世家、城主府都要脸面，坏事不会摆到台面上做。脏事都在看不见的地方，做之前先算清代价：对方有没有靠山、会不会被追查、值不值得。被众人看见、被宗门登记在册的人，没人敢明着动。魔道是正道人人喊打的禁忌，真正的魔修和邪法极少，大多只存在于传闻和说书里；这里的黑暗是人心的贪婪、势利和冷漠，不是魔道横行。

【暗处】北疆近年不太平：城西接连有孩子失踪，多半是人牙子作祟；城外偶有整村的人一夜之间血肉干枯，镇妖司说是妖物，私下有人说是魔修——北疆已有几十年没见过魔修，这只是传闻，镇妖司还在查。

【灵根】修仙的前提。分金木水火土五行，单一灵根（天灵根）万中无一，双灵根、三灵根是好苗子，四灵根勉强，五灵根（杂灵根）几乎无望筑基，变异灵根（冰、雷、风等）罕见而强大，大多数人没有灵根。灵根要用测灵石测出来。资质决定一个人能走多远：四灵根一辈子多半止步练气二三层，三灵根有望筑基，双灵根有望金丹，单灵根（天灵根）有望元婴——一个天灵根，就是宗门未来的一位元婴大能，是一宗的底蕴；变异灵根与天灵根相当。资质就是身价，宗门按资质分人：五灵根进杂役或外门，自生自灭；四灵根、三灵根进外门，按例领月例；双灵根是内门的候选，执事会多看两眼、多问一句家里；天灵根和变异灵根是宗门几十年才遇一次的宝贝，测灵执事必须当场登记、立刻飞报宗门，长老们会争着收作亲传，宗门会派人护送上山、给足丹药和洞府，世家会赶来送礼、结交、许婚，周围的人立刻换一副脸孔巴结。好灵根带来的麻烦也是真的，但大多是人情世故里的：同门嫉妒、派系拉拢、被当成长辈博弈的筹码、资源被人眼红克扣；真正敢对宗门登记在册的天才下黑手的人极少，那要冒被宗门追查到底的风险。没被宗门收下、又没有靠山的有灵根的孩子，才是最容易被欺负的人。

【世俗】凡人以银两交易，修士用灵石（1灵石约值100两银子）。`,

  lore:[
    {title:'测灵大会', keys:['测灵','灵根','测灵石','测灵台','招收','名额'], always:false, content:'霄剑宗每三年在云州城朱雀广场设测灵台三日，招收年满十二、未满十九的凡人子弟，明面上分文不取。手按测灵石，石中亮起光芒：金白、青绿、湛蓝、赤红、土黄分别对应金木水火土，光色越多灵根越杂，越亮资质越好；不亮即无灵根。测出灵根者由外务堂执事登记，三日后随宗门车队上山。测出天灵根、变异灵根的，执事当场登记、飞报宗门，长老往往亲自下山来看。私下传闻：边缘的名额能买；世家会在台下记名字，事后上门拉拢测出好灵根的寒门子弟；人牙子在台下物色测不出灵根的孩子。'},
    {title:'修真界的世道', keys:['宗门','同门','门规','靠山','欺压','孝敬','夺宝','构陷'], always:false, content:'修真界实力为尊，门规只罚没有靠山的人。外门新人要给老弟子交“孝敬”；宗门任务里死个把人，报一句“遭遇妖兽”即可；争资源时下毒、构陷、借刀杀人并不稀奇。女弟子没有靠山，常被有权势的师兄、执事、长老以资源为饵、以权势相逼。'},
    {title:'挖灵根', keys:['挖灵根','夺灵根','移植灵根','灵根被挖'], always:false, content:'说书人嘴里的魔道禁术：把活人的灵根剖出移植给他人。正道明令禁绝，北疆几十年没人见过，没人知道真假。'},
    {title:'血丹与魔修', keys:['魔修','血丹','干尸','血祭','吸干'], always:false, content:'魔修以活人精血炼“血丹”，一颗血丹要几十条人命。魔修是正道公敌，北疆已有几十年不见踪影。近年云州城外有村子一夜之间人畜尽成干尸，镇妖司对外说是妖物作祟，私下也有人疑心是魔修。'},
    {title:'外门的规矩', keys:['外门','孝敬','月例','比斗','炮灰'], always:false, content:'新弟子上山第一个月要给老弟子交“孝敬”；外门比斗生死不论，失手打死人只罚月例；宗门任务里新人常被派去探路，死伤报“遭遇妖兽”。月例丹药从执事到师兄层层克扣，到新人手里只剩三成。'},
    {title:'境界与寿元', keys:['境界','练气','筑基','金丹','元婴','化神','大乘','突破','寿元','夺舍'], always:false, content:'练气一至九层与圆满，之后筑基、金丹、元婴、化神、大乘，各分初期、中期、后期、圆满。寿元：凡人六七十，练气约一百二十，筑基二百，金丹五百，元婴一千，化神三千。寿元将尽的高阶修士，有的会冒天下之大不韪，寻找资质极佳的年轻肉身夺舍。'},
    {title:'霄剑宗', keys:['霄剑宗','宗主','长老','老祖','外门','内门','苍霄山','执法堂','杂役'], always:false, content:'苍霄山剑修宗门，北疆唯一的大宗门。太上长老剑尘子为元婴老祖，宗主秦啸川金丹中期，执法长老铁无涯、传功长老余长老、炼器长老欧冶。宗主一系与执法一系明争暗斗。外门弟子三百余人，内门百余人，杂役数百。门规严：禁私斗、禁入剑冢与老祖洞府——但门规怎么执行，看你是谁的人。'},
    {title:'云州城', keys:['云州','城主','林家','苏家','万宝楼','散修公会','镇妖司','千金坊','漕帮','人牙子'], always:false, content:'北疆第一大城。城主慕容烈，金丹初期，每年从千金坊和漕帮抽成。林家以丹道立足，苏家以剑道闻名，苏家先祖当年被霄剑宗逐出师门，两家素有嫌隙。万宝楼是东洲连锁商会分号。镇妖司缉捕妖物魔修，也替权贵办些脏事。千金坊放印子钱、设局逼人卖身；城西的人牙子刘婆专收穷人家的孩子。'},
    {title:'三座卫星村', keys:['石桥村','杏花村','柳溪村','村子'], always:false, content:'云州城外三座村子：南郊石桥村种稻养鸭，东郊杏花村以杏花酒闻名，西郊柳溪村打渔采药。村子之间有田间小路相连，各走约一个时辰。'},
    {title:'青石镇', keys:['青石镇','里正','供奉'], always:false, content:'苍霄山脚的小镇，三百户人家，世代为霄剑宗种粮、打铁、供应杂物，每年由赵里正收缴供奉送上山；下山的弟子在镇上白吃白拿是常事。'},
    {title:'灵石与银钱', keys:['灵石','银两','铜钱','文','物价'], always:false, content:'凡人用银两铜钱，1两=1000文；修士用灵石，1灵石约值100两。宗门内部用贡献点兑换资源。'}
  ],
  story:{

    mainline:'【主线】霄剑宗的测灵台设在云州城朱雀广场，只开三天——从今天起连开三天，每天辰时到申时（8:00~17:00）。测出灵根，就能离开眼下的日子，踏上仙路；测不出，这辈子就只能是个凡人。\n可你也听说过：测灵台下不只有机会。',

      {id:'act2', title:'新的开始', goal:'测灵之后的人生：入宗修炼，或另寻出路。完全由玩家决定。', done_when:null}

  events:[
    {id:'test_open', title:'测灵台前', when:{location:'test_square', day_max:3, time:{from:'08:00', to:'17:00'}}, once:true, text:'测灵台前人山人海。台上，霄剑宗的严执事面无表情地念着名字，测灵石时而亮起微光，时而毫无动静；亮了的孩子被家人抱着哭，不亮的低着头被人群挤下台。台下人群边缘，几个穿着体面的世家家仆在台下记名字，一个慈眉善目的老婆子盯着那些测不出灵根、被挤下台的孩子看。', effects:{}},
    {id:'arrive_city', title:'进城', when:{map:'city', region:['c_south','c_north','c_east','c_west','c_main']}, once:true, text:'城门口的守卫打着哈欠查验路引，顺手从卖菜老汉的担子里拿走两根萝卜。城里到处都在议论霄剑宗的测灵大会。', effects:{flags:{arrived_city:true}}},

    {id:'curfew', title:'宵禁', when:{map:'city', time:{from:'21:00', to:'23:00'}}, once:true, text:'更夫敲着梆子走过：“亥时已到——宵禁——”镇妖司的巡夜队提着灯笼从街口经过，冷冷打量着还在外面晃荡的人。', effects:{}}
  ],

        intro:'鸡叫第二遍的时候，你就醒了。\n灶房里亮着油灯，母亲正弯着腰在锅里烙饼，葱油的香味飘满了整个小院。“今儿进城，路上吃。”她头也没抬，“测不测得出，都早点回来。”\n八年前，父亲就是被一个路过的仙长拎走的，再没回来。母亲从不提那件事，可每回有修士骑着灵马从村口过，她都会把院门关上。\n院门外传来石小虎的大嗓门：“{name}！走啦！去晚了排到天黑都轮不上！”'},

  const c = card(id), s = S.npcs[id], L = [];
  L.push(`- ${c.name}(${id})［${TIER_NAMES[tierOf(id)]}］：${c.brief || c.identity}${s.status === 'dead' ? '【已死亡】' : s.status === 'missing' ? '【下落不明】' : ''}${s.stub ? '【存根】' : ''}${s.catchup ? '【久别】' : ''}`);
  const pt = personalityText(c, false); if (pt !== '（未设定）') L.push(`  性格：${pt.replace(/\n\s*/g, '；').slice(0, 90)}`);
  if (c.speech) L.push(`  说话：${c.speech.slice(0, 50)}`);
  if (c.plan) L.push(`  计划：${c.plan.slice(0, 70)}`);
  L.push(`  对玩家：${relText(id, 'player')}｜心情：${s.mood}${s.met ? '' : '｜尚未与玩家相识'}`);
  (present || []).filter(o => o !== id).forEach(o => { const t = relText(id, o, false); if (t) L.push(`  对${npcName(o)}(${o})：${t}`); });
  const k = +NP().gmMemBrief || 0; if (k){ const mem = memText(s, k); if (mem) L.push('  记得：' + mem.slice(0, 200)); }
  (c.secrets || []).forEach((sec, i) => L.push(`  秘密[${i}]（${sec.revealed ? '玩家已知' : secretOpen(id, sec) ? '可透露' : '未透露'}）：${sec.text.slice(0, 70)}`));
  return L.join('\n');
}
function npcLineGM(id, withPlan){
  const c = card(id), s = S.npcs[id], w = npcLocation(id), r = relGet(id, 'player');
  return `- ${c.name}(${id})［${TIER_NAMES[tierOf(id)]}］：${(c.brief || c.identity || '').slice(0, 40)}${s.stub ? '【存根】' : ''}${s.catchup ? '【久别】' : ''}${s.status === 'dead' ? '【已死亡】' : ''}｜${w ? '在' + locName(w) : '不在眼前'}${r?.type ? '｜对玩家：' + r.type : ''}${withPlan && c.plan ? '｜计划：' + c.plan.slice(0, 50) : ''}`;
}
function npcFullGM(id, present){
  const s = S.npcs[id], t = npcForGM(id, present).split('\n');
  t[0] = t[0].replace(/^(- [^(]+\([^)]+\))/, `$1［${TIER_NAMES[tierOf(id)]}］`) + (s.stub ? '【存根】' : '') + (s.catchup ? `【久别：上次见是第${dayOf(s.lastSeen ?? 0)}天】` : '');

/* 返回 {text, stat}。在场的人一定会出现（至少一行），其余按优先级填到字数上限为止 */
function peopleBlock(present, named, agendaPeople){
  const P = NP(), B = +P.budget || 2500, here = new Set(present);
  const LV = ['full', 'brief', 'line'];
  const render = (id, lv, plan) => lv === 'full' ? npcFullGM(id, present) : lv === 'brief' ? npcBriefGM(id, present) : npcLineGM(id, plan);
  const secs = {here:[], away:[]}, stat = {used:0, budget:B, down:0, cut:0, here:0, away:0}, seen = new Set();
  const put = (id, want, must, sec, plan) => {
    if (seen.has(id) || !S.npcs[id]?.card) return; seen.add(id);
    for (let i = LV.indexOf(want); i < 3; i++){
      const t = render(id, LV[i], plan);
      if (stat.used + t.length <= B || (must && i === 2)){ secs[sec].push(t); stat.used += t.length; stat[sec]++; if (i > LV.indexOf(want)) stat.down++; return; }
    }
    stat.cut++;
  };
  const byWeight = (a, b) => (named.includes(b) - named.includes(a)) || (TIER_ORDER[tierOf(b)] - TIER_ORDER[tierOf(a)]) || (heatNow(b) - heatNow(a));
  /* 1. 在场的人 */
  for (const id of [...present].sort(byWeight)){
    const t = tierOf(id), s = S.npcs[id], hot = named.includes(id) || s.follow;
    const want = s.stub ? 'line' : t === 'core' ? 'full' : t === 'major' ? (hot ? 'full' : 'brief') : (hot ? 'brief' : 'line');
    put(id, want, true, 'here');
  }
  /* 2. 被点名但不在场 */
  for (const id of named.filter(x => !here.has(x)).sort(byWeight)) put(id, ['core', 'major'].includes(tierOf(id)) && !S.npcs[id].stub ? 'brief' : 'line', false, 'away');
  /* 3. 后台事项相关的人 */
  for (const id of agendaPeople) put(id, 'line', false, 'away');
  /* 4. 计划针对玩家的核心人物 */
  const pn = S.player.name;
  for (const id of activeIds().filter(x => tierOf(x) === 'core' && !here.has(x)).filter(x => { const pl = card(x).plan || ''; return pl && (pl.includes('玩家') || (pn && pl.includes(pn))); }).sort(byWeight).slice(0, 4)) put(id, 'line', false, 'away', true);
  /* 5. 邻区与本区的核心人物 */
  if (P.neighborCore){
    const rid = regionOf(S.location), adj = new Set([rid, ...regionsAdj(rid).map(x => x.id)]);
    for (const id of activeIds().filter(x => tierOf(x) === 'core' && !here.has(x) && adj.has(regionOf(npcLocation(x)))).sort(byWeight)) put(id, 'line', false, 'away');
  }
  return {here:secs.here.join('\n'), away:secs.away.join('\n'), stat};
}

/* ======================= 3_llm：模型调用与回合管线 ======================= */
function netErr(msg){ const e = new Error(msg); e.net = true; return e; }
const LLM = {
  cfg(role){ const r = settings.roles[role]; return {...r, base:(r.base || settings.base || '').trim().replace(/\/+$/, ''), key:(r.key || settings.key || '').trim()}; },
  async call(role, messages, {onDelta} = {}){
    const c = this.cfg(role);
    if (!c.base || !c.model) throw netErr(`请先在「设置」里填写 API 地址和${ROLE_NAMES[role]}的模型名`);
    let extra = {};
    if (c.extra && c.extra.trim()){ try { extra = JSON.parse(c.extra); } catch(e){ throw netErr(`${ROLE_NAMES[role]}的「额外参数」不是合法 JSON`); } }
    const stream = !!c.stream && !!onDelta;
    const body = {model:c.model, messages, temperature:+c.temperature, stream, ...extra};
    if (+c.max_tokens) body.max_tokens = +c.max_tokens;
    if (c.json) body.response_format = {type:'json_object'};
    if (stream) body.stream_options = {include_usage:true};
    const rec = {role, at:new Date().toLocaleTimeString(), params:{...body, messages:undefined}, messages, response:'', usage:null, ms:0, error:null};
    debugLog.unshift(rec); if (debugLog.length > 16) debugLog.pop();
    const t0 = performance.now();
    const doFetch = async b => {
      try { return await fetch(c.base + '/chat/completions', {method:'POST', headers:{'Content-Type':'application/json', ...(c.key ? {'Authorization':'Bearer ' + c.key} : {})}, body:JSON.stringify(b)}); }
      catch(e){ rec.error = '网络错误：' + e.message; throw netErr('请求没有发出去或被浏览器拦截。可能原因：① 网络不通；② API 地址填错；③ 该服务商不允许网页直接调用（跨域/CORS）。原始信息：' + e.message); }
    };
    try {
      let resp = await doFetch(body), t = '';
      if (!resp.ok){
        try { t = await resp.text(); } catch(e){}
        if (stream && resp.status === 400 && /stream_options/i.test(t)){ delete body.stream_options; resp = await doFetch(body); t = ''; if (!resp.ok){ try { t = await resp.text(); } catch(e){} } }
        if (!resp.ok){
          const hint = {401:'（API Key 无效）', 402:'（余额不足）', 404:'（地址或模型名不对）', 429:'（请求太频繁或额度用尽）'}[resp.status] || '';
          rec.error = `HTTP ${resp.status} ${t.slice(0, 500)}`;
          throw netErr(`API 返回错误 ${resp.status}${hint}：${t.slice(0, 200)}`);
        }
      }
      let text = '', usage = null;
      if (stream && resp.body?.getReader){
        const reader = resp.body.getReader(), dec = new TextDecoder(); let buf = '';
        for (;;){
          const {done, value} = await reader.read(); if (done) break;
          buf += dec.decode(value, {stream:true});
          let i;
          while ((i = buf.indexOf('\n')) >= 0){
            const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
            if (!line.startsWith('data:')) continue;
            const d = line.slice(5).trim(); if (d === '[DONE]') continue;
            try { const j = JSON.parse(d); const dl = j.choices?.[0]?.delta?.content; if (dl){ text += dl; onDelta(text); } if (j.usage) usage = j.usage; } catch(e){}
          }
        }
      } else {
        const j = await resp.json();
        text = j.choices?.[0]?.message?.content || ''; usage = j.usage || null; rec.finish = j.choices?.[0]?.finish_reason || '';
        if (onDelta) onDelta(text);
      }
      rec.response = text; rec.usage = usage; rec.ms = Math.round(performance.now() - t0);
      if (S){
        if (usage){ S.tokens.in += usage.prompt_tokens || 0; S.tokens.out += usage.completion_tokens || 0; S.tokens.cached += usage.prompt_cache_hit_tokens || usage.prompt_tokens_details?.cached_tokens || 0; }
        S.tokens.calls++;
      }
      return {text, usage, finish:rec.finish};
    } catch(e){ rec.ms = Math.round(performance.now() - t0); if (!rec.error) rec.error = e.message; throw e; }
  }
};
function parseJSON(text){
  if (!text) return null;
  const t = String(text).trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
  try { return JSON.parse(t); } catch(e){}
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a){ try { return JSON.parse(t.slice(a, b + 1)); } catch(e){} }
  return null;
}

/* OOC：输入里出现「ooc：」（或用括号括起来的 ooc）时，标记之后的部分交给后台；之前的部分照常作为游戏行动 */
function splitOOC(text){
  const m = text.match(/(^|[\s（(【\[])\s*ooc\s*[:：]|^\s*[（(【\[]?\s*ooc(?=\s)/i);
  if (!m) return null;
  const at = m.index + (m[1] || '').length;
  const ooc = text.slice(at).replace(/^\s*ooc\s*[:：]?\s*/i, '').replace(/[）)】\]]\s*$/, '').trim();
  const game = text.slice(0, m.index + (m[1] && /\s/.test(m[1]) ? m[1].length : 0)).replace(/[（(【\[]\s*$/, '').trim();
  return {ooc, game};
}

  const present = presentNPCs(), locBefore = S.location;
  const gmMsgs = buildGM(text, present, meta);
  { const pend = [...S.log].reverse().find(e => e.kind === 'choice' && !e.chosen && !e.skipped); if (pend){ if (meta?.choice) pend.chosen = meta.choice.label; else pend.skipped = true; } }

    `【世界】${WS('setting')}`, `【数值定义】\n${defsText()}`, `【前情摘要】\n${S.chronicle || '（暂无）'}`, `【当前时间】${timeStr(S.t)}`,
    `【需要维护的人物（${ids.length}人）】\n\n${ids.map(keepEntry).join('\n\n')}`,
    `请逐个更新这些人物的档案，按输出格式把结果放进 npcs，键是人物 id。`
  ].join('\n\n');
  const res = await LLM.call('keeper', [{role:'system', content:sysWith('keeper', ids)}, {role:'user', content:user}]);
  const p = parseJSON(res.text); if (!isObj(p)) throw new Error(res.finish === 'length' ? '人物维护输出被截断（设置里调大「人物维护」的最大输出，或调小每批人数）' : '人物维护返回的不是有效 JSON');
  const map = isObj(p.npcs) ? p.npcs : (ids.length === 1 ? {[ids[0]]:p} : {});
  const out = {pub:[], hid:[]};
  for (const id of ids){
    const x = map[id], ns = S.npcs[id]; if (!isObj(x) || !ns) continue;
    const why = x.reason || '人物维护';
    const o = applyNpcPatch(id, {longterm:x.longterm, card:x.card, goals:x.goals, new_goal:x.new_goal, add_secret:x.add_secret}, '维护', why);
    out.pub.push(...o.pub); out.hid.push(...o.hid);
    for (const [t, r] of Object.entries(isObj(x.relations) ? x.relations : {})){
      if (!isObj(r) || t === id || !(t === 'player' || S.npcs[t]?.card)) continue;
      const parts = applyRelDelta(id, t, r.dims, r.type, r.note, '维护', why);
      if (parts.length) out.hid.push(`${npcName(id)}→${npcName(t)} ${parts.join(' ')}`);
    }
    ns.memSinceKeep = 0; ns.needFull = false;
    if (ns.needMat || ns.stub){ ns.needMat = false; if (isObj(x.card) && Object.keys(x.card).length){ ns.stub = false; out.hid.push(`${npcName(id)}已实化`); } }
  }
  return out;
}

}

/* ---------------- 地图（区域图） ---------------- */
const REGION_COLORS = ['#d9a35b','#79a9cc','#7fb27f','#c98bb9','#d46a6a','#b0a58f'];
/* 画一张地图组里的区域图。opt: {cur:当前区域, sel:选中区域, vis:可见判定, dim:暗显判定, labels:{区域:附注}} */
function regionSVG(regions, routes, mapId, opt = {}){
  const ids = Object.keys(regions).filter(k => regions[k].map === mapId && (!opt.vis || opt.vis(k)));
  const n = ids.length || 1, pos = {};
  const hasXY = k => typeof regions[k].x === 'number' && typeof regions[k].y === 'number';
  const placed = ids.filter(hasXY), loose = ids.filter(k => !hasXY(k));
  placed.forEach(k => pos[k] = [regions[k].x, regions[k].y]);
  if (!placed.length) loose.forEach((k, i) => pos[k] = [50 + 38 * Math.cos(2 * Math.PI * i / n - Math.PI / 2), 50 + 38 * Math.sin(2 * Math.PI * i / n - Math.PI / 2)]);
  else loose.forEach((k, i) => pos[k] = [10 + (i % 5) * 20, 104 + Math.floor(i / 5) * 9]);   // 没坐标的放到底部一排

  for (const r of routes){
    const A = pos[r.a], B = pos[r.b];

      lines += `<line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" stroke="#3a404a" stroke-width=".6" ${dim ? 'stroke-dasharray="1.5 1.5"' : ''}/>` +
        `<text x="${(A[0] + B[0]) / 2}" y="${(A[1] + B[1]) / 2 - 1}" font-size="2.3" fill="#6f6b64" text-anchor="middle">${r.time}′</text>`; }
    else if (A || B){ const inside = A ? r.a : r.b, out = A ? r.b : r.a; if (regions[out] && regions[out].map !== mapId) outs.push([inside, out, r.time]); }
  }
  ids.forEach((k, i) => {
    const r = regions[k], [x, y] = pos[k], cur = k === opt.cur, sel = k === opt.sel, dim = opt.dim && opt.dim(k), c = REGION_COLORS[i % REGION_COLORS.length];
    const label = dim ? r.name + '?' : r.name, bw = Math.max(14, label.length * 3.3 + 4);
    nodes += `<g class="mapnode" data-map-region="${k}" opacity="${dim ? .5 : 1}"><rect x="${x - bw / 2}" y="${y - 4}" width="${bw}" height="8" rx="2" fill="${cur ? '#d9a35b' : '#1d2026'}" stroke="${c}" stroke-width="${sel ? 1.2 : .6}" ${dim ? 'stroke-dasharray="1.5 1"' : ''}/>` +
      `<text x="${x}" y="${y + 1.2}" font-size="3" fill="${cur ? '#1a1307' : '#e6e1d6'}" text-anchor="middle">${esc(label)}</text>` +
      (opt.labels?.[k] ? `<text x="${x}" y="${y + 7.5}" font-size="2.4" fill="#79a9cc" text-anchor="middle">${esc(opt.labels[k])}</text>` : '') + `</g>`;
  });
  const outHtml = outs.map(([a, b, t]) => `${esc(regions[a].name)} → ${esc(regions[b].name)}（${esc(opt.mapName ? opt.mapName(regions[b].map) : regions[b].map)}，${t}分钟）`).join('<br>');
  return `<div class="mapwrap"><svg viewBox="-12 -8 124 ${loose.length && placed.length ? 128 : 118}" xmlns="http://www.w3.org/2000/svg">${lines}${nodes}</svg></div>${outHtml ? `<div class="hint">通往其他地图：<br>${outHtml}</div>` : ''}`;
}
/* 世界总图：把同一世界里的多张子图（如宗门/小镇/城市）画成一张，跨图路线标出路程 */
function worldSVG(maps, regions, routes, cur, sel, vis){
  const ids = Object.keys(maps).filter(m => !vis || vis(m)); if (ids.length < 2) return '';
  const pos = {}; ids.forEach((m, i) => { const o = maps[m]; pos[m] = (typeof o.x === 'number' && typeof o.y === 'number') ? [o.x, o.y] : [50, 12 + i * (76 / Math.max(1, ids.length - 1))]; });
  const pair = {};
  for (const r of routes){ const ma = regions[r.a]?.map, mb = regions[r.b]?.map; if (!ma || !mb || ma === mb || !pos[ma] || !pos[mb]) continue; const k = [ma, mb].sort().join('|'); pair[k] = Math.min(pair[k] ?? Infinity, r.time); }

  for (const [k, t] of Object.entries(pair)){ const [a, b] = k.split('|'), A = pos[a], B = pos[b];
    lines += `<line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" stroke="#4a4f59" stroke-width=".8"/><text x="${(A[0] + B[0]) / 2 + 3}" y="${(A[1] + B[1]) / 2}" font-size="3" fill="#8f8b83">${t}分钟</text>`; }

}

function enterWorld(id, forceNew){

  if (ED.dirty && !confirm('编辑器里有未保存的修改，切换世界会丢弃它们。继续？')) return false;
  W = normalizeWorld(L[id]); Store.set(KEY.cur, id); ED.reset();
  const auto = Store.get(KEY.auto(id));
  if (!forceNew && auto?.S?.v === 2){ S = auto.S; syncStateToWorld(); undoStack = []; lastNarr = null; render(); }
  else { newGame(); if (!forceNew && W.creation.origins.length) setTimeout(openCreate, 0); }
  return true;
}
function makeWorldFrom(src, blank){
  const w = clone(src); const base = (src.meta.id || 'w').replace(/_[a-z0-9]{5}$/, '');
  w.meta.id = base + '_' + Math.random().toString(36).slice(2, 7);
  w.meta.title = src.meta.title + (blank ? '（空白）' : '（副本）');
  if (blank){
    w.npcs = {}; w.lore = []; w.events = []; w.story = {premise:'', flags:{}, acts:[]};
    w.maps = {main:{name:'地图', desc:''}}; w.regions = {r1:{name:'起始区域', map:'main', desc:'', open:true, known:true, x:50, y:50}}; w.routes = [];
    w.locations = {start:{name:'起点', region:'r1', desc:'', known:true}};
    w.start = {location:'start', day:1, time:'08:00', act:'', intro:''}; w.setting = ''; w.rules = []; w.meta.description = '';
    w.player = {name:'你', desc:'', fields:{}, stats:{}, inventory:[]};
  }
  return normalizeWorld(w);
}

function sfield(path, label, type = 'text', extra = ''){
  const v = getPath(settings, path);
  if (type === 'check') return `<label class="ck"><input type="checkbox" data-k="${path}" ${v ? 'checked' : ''}> ${label}</label>`;
  if (type === 'area') return `<label class="f">${label}</label><textarea class="f" data-k="${path}" style="min-height:44px">${esc(v)}</textarea>`;
  return `<label class="f">${label}</label><input type="${type}" data-k="${path}" value="${esc(v)}" ${extra}>`;
}

  h += `<div class="card"><h4>剧情状态</h4><div class="kv"><b>阶段：</b>${esc(act ? act.title : '（无）')}</div><div class="kv"><b>标记：</b>${esc(JSON.stringify(S.flags))}</div>

/* ---------------- 文件 ---------------- */
function download(name, obj){
  const blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
let fileCb = null;
function pickFile(cb){ fileCb = cb; const fi = $('#fileIn'); fi.value = ''; fi.click(); }
$('#fileIn').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f || !fileCb) return;
  const rd = new FileReader();
  rd.onload = () => { const d = parseJSON(rd.result); if (!d) return toast('文件不是有效的 JSON'); fileCb(d); };
  rd.readAsText(f);
});
function importWorld(d){
  if (d.type === 'xujie-save') return toast('这是存档文件，请到「存档」页导入');
  const w = normalizeWorld(d), errs = validateWorld(w);
  if (errs.length) return alert('世界包有问题：\n' + errs.slice(0, 8).join('\n'));
  if (libGet()[w.meta.id] && !confirm(`世界库里已有「${w.meta.id}」，覆盖它？`)) return;
  libPut(w); enterWorld(w.meta.id, true); toast('已导入：' + w.meta.title); closeSheet();
}

function crParseItems(t){ return String(t || '').split('\n').map(s => s.trim()).filter(Boolean).map(s => { const m = s.match(/^(.+?)[：:](.*)$/); return m ? {name:m[1].trim(), desc:m[2].trim()} : {name:s, desc:''}; }); }
function crStart(){
  const c = CR, fields = clone(c.fields);
  for (const f of W.template.player_fields || []) if (fields[f.key] === '__random' && f.random_weights)
    fields[f.key] = pickWeighted(Object.entries(f.random_weights).map(([k, w]) => ({k, w})), x => x.w).k;
  const rules = c.wo.rules.split('\n').map(s => s.trim()).filter(Boolean);
  const wo = {};
  if (c.wo.setting !== W.setting) wo.setting = c.wo.setting;
  if (c.wo.style !== W.style) wo.style = c.wo.style;
  if (JSON.stringify(rules) !== JSON.stringify(W.rules)) wo.rules = rules;
  if (c.wo.prologue !== (W.prologue || '')) wo.prologue = c.wo.prologue;
  if (c.wo.gm_extra.trim()) wo.gm_extra = c.wo.gm_extra.trim();
  if (c.writeBack && Object.keys(wo).length){
    const L = libGet(), w = L[W.meta.id];
    if (w){ for (const k of ['setting', 'style', 'rules', 'prologue']) if (wo[k] != null){ w[k] = wo[k]; delete wo[k]; }
      if (wo.gm_extra){ w.gm_notes = [w.gm_notes, wo.gm_extra].filter(Boolean).join('\n'); delete wo.gm_extra; }
      libPut(w); W = normalizeWorld(w); }
  }
  const opts = {origin:c.origin, player:{name:c.name.trim() || W.player.name, desc:c.desc, fields, stats:c.stats, inventory:crParseItems(c.items)},
    location:c.location, day:c.cal ? 1 : c.day, time:c.time, wo, variants:c.variants, roles:c.roles, cal:c.cal};
  const ai = c.aiIntro;
  closeCreate(); closeHome(); newGame(opts); S.created = true; autosave();
  if (ai) aiOpening();
}

function rf(s, p, parent){
  const lab = s.label ? `<label class="f">${esc(s.label)}</label>` : '', hint = s.hint ? `<div class="hint">${s.hint}</div>` : '';
  const v = p ? fv(p) : undefined, rr = s.rr ? ' data-rr="1"' : '';
  switch (s.t){
    case 'text': return lab + `<input type="text" data-p="${p}" data-t="text" value="${esc(v ?? '')}" ${s.dl ? `list="${s.dl}"` : ''} placeholder="${esc(s.ph || '')}"${rr}>` + hint;
    case 'longtext': return lab + `<textarea class="p" rows="${s.rows || 3}" data-p="${p}" data-t="text" placeholder="${esc(s.ph || '')}">${esc(v ?? '')}</textarea>` + hint;
    case 'number': return lab + `<input type="number" data-p="${p}" data-t="num" value="${v ?? ''}" step="any"${rr}>` + hint;
    case 'check': return `<label class="ck"><input type="checkbox" data-p="${p}" data-t="check" ${v ? 'checked' : ''}${rr}> ${esc(s.label)}</label>` + hint;
    case 'select': {
      const opts = (typeof s.opts === 'function' ? s.opts(parent) : s.opts).map(o => Array.isArray(o) ? o : [o, o]);
      return lab + `<select data-p="${p}" data-t="${s.num ? 'num' : 'text'}"${rr}>${opts.map(([val, l]) => `<option value="${esc(val)}" ${String(v ?? '') === String(val) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>` + hint;
    }
    case 'multi': {
      const opts = s.opts(parent), cur = arr(v);
      return lab + `<div class="multi">${opts.map(([val, l]) => `<label><input type="checkbox" data-p="${p}" data-t="multi" value="${esc(val)}" ${cur.includes(val) ? 'checked' : ''}>${esc(l)}</label>`).join('') || '<span class="hint">（无可选项）</span>'}</div>` + hint;
    }
    case 'list': return lab + `<textarea class="p" rows="${s.rows || 3}" data-p="${p}" data-t="list" placeholder="一行一个">${esc(arr(v).join('\n'))}</textarea>` + hint;
    case 'json': return lab + `<textarea class="f" data-p="${p}" data-t="json">${esc(JSON.stringify(v ?? s.empty ?? {}, null, 1))}</textarea>` + hint;
    case 'range': return `<label class="f">${esc(s.label)}：<b data-rv="${p}">${v ?? 50}</b></label><input type="range" min="0" max="100" data-p="${p}" data-t="num" value="${v ?? 50}">` + hint;
    case 'objlist': return rObjList(s, p);
    case 'map': return rMap(s, p);
    case 'kv': return rKV(s, p);
    case 'html': return s.html(parent);
  }
  return '';
}

/* 编辑器里改动过的地图内容，覆盖到存档（已知/到访状态不动；AI 生成的内容保留） */
function syncGeoEdits(a, b){
  const g = S.geo, same = (x, y) => JSON.stringify(x) === JSON.stringify(y); let n = 0;
  for (const k of ['maps', 'regions', 'locations']){
    for (const [id, vb] of Object.entries(b[k])){
      const va = a[k]?.[id]; if (!va || !g[k][id]) continue;
      for (const f of Object.keys(vb)) if (f !== 'visited' && !same(va[f], vb[f]) && setL(`geo.${k}.${id}.${f}`, clone(vb[f]), '作者', '在编辑器中修改')) n++;
    }
    for (const id of Object.keys(a[k] || {})) if (!b[k][id] && g[k][id] && id !== S.location && !(k === 'regions' && id === regionOf(S.location))){ delete g[k][id]; n++; }
  }
  if (!same(a.routes, b.routes)){
    const key = r => [r.a, r.b].sort().join('|'), oldKeys = new Set(a.routes.map(key));
    const extra = g.routes.filter(r => !oldKeys.has(key(r)));
    if (setL('geo.routes', [...clone(b.routes), ...extra.filter(r => !b.routes.some(x => key(x) === key(r)))], '作者', '在编辑器中修改')) n++;
  }
  return n;
}
/* 编辑器里改动过的角色字段，覆盖到存档的当前值（没改动的字段保留 AI 维护的版本） */
function syncEditsToState(a, b){
  let n = 0; const same = (x, y) => JSON.stringify(x) === JSON.stringify(y);
  for (const [id, nb] of Object.entries(b.npcs)){
    const na = a.npcs[id], ns = S.npcs[id]; if (!na || !ns?.card) continue;
    for (const k of CARD_KEYS){
      if (same(na[k], nb[k])) continue;
      let val = clone(nb[k]);
      if (k === 'secrets') val = arr(val).map((x, i) => ({...x, revealed:!!ns.card.secrets?.[i]?.revealed}));
      if (setL(`npcs.${id}.card.${k}`, val, '作者', '在编辑器中修改')) n++;
    }
    if ((na.lock || false) !== (nb.lock || false) || (na.tier || '') !== (nb.tier || '')){ ns.lock = nb.lock ? (nb.tier || ns.tier || 'minor') : ''; if (nb.tier && nb.tier !== ns.tier){ ns.heat = nb.heat != null && nb.heat !== '' ? +nb.heat : TIER_HEAT[nb.tier]; ns.heatT = S.t; } retier(id); n++; }
    if (na.heat !== nb.heat && nb.heat != null && nb.heat !== ''){ ns.heat = +nb.heat; ns.heatT = S.t; retier(id); n++; }
    if (!!na.stub !== !!nb.stub){ ns.stub = !!nb.stub; n++; }
    for (const [k, v] of Object.entries(nb.stats || {})) if (v != null && v !== '' && na.stats?.[k] !== v && setL(`npcs.${id}.stats.${k}`, +v, '作者', '在编辑器中修改')) n++;
    for (const [t, r] of Object.entries(nb.relations || {})){
      const ra = na.relations?.[t]; if (same(ra, r) || (t !== 'player' && !S.npcs[t]?.card)) continue;
      relEnsure(id, t); const base = `rels.${relKey(id, t)}`;
      if ((ra?.type || '') !== (r.type || '') && setL(base + '.type', r.type || '', '作者', '在编辑器中修改')) n++;
      if ((ra?.note || '') !== (r.note || '') && setL(base + '.note', r.note || '', '作者', '在编辑器中修改')) n++;
      for (const [dk, dv] of Object.entries(r.dims || {})) if (ra?.dims?.[dk] !== dv && dv != null && dv !== '' && setL(`${base}.dims.${dk}`, +dv, '作者', '在编辑器中修改')) n++;
    }
  }
  return n;
}

function worldCtx(d){
  return `【世界】${d.meta.title}（${d.meta.genre || ''}）\n${d.setting || '（未填写世界背景）'}\n文风：${d.style || ''}\n` +

    `【地点】${Object.entries(d.locations).map(([k, l]) => `${k}：${l.name}`).join('；') || '无'}\n` +
    `【已有角色】${Object.entries(d.npcs).map(([k, n]) => `${k}：${n.name}（${n.brief}）`).join('；') || '无'}`;
}
function npcSchema(d){
  const T = d.template, sc = schemeOf(d);
  const pers = sc.kind === 'type' ? `{"type":"${Object.keys(sc.types).join('/')} 之一","traits":"在类型基础上的个人特质、矛盾、怪癖、情绪稳定性"}`
    : sc.kind === 'dims' ? `{"dims":{${Object.entries(sc.dims).map(([k, x]) => `"${k}":"${x.label} 0~100"`).join(',')}},"traits":"个人特质"}` : `{"traits":"性格描述"}`;
  const fields = Object.fromEntries(T.npc_fields.map(f => [f.key, `${f.label}${f.options?.length ? '（从中选：' + f.options.join('/') + '）' : ''}${f.desc ? '：' + f.desc : ''}`]));
  const stats = Object.fromEntries(statDefsOf(d, 'npc').map(([k, s]) => [k, s.type === 'level' ? `${s.label}：等级序号（${s.levels.map((l, i) => i + '=' + l).join('，')}）` : `${s.label}：${s.min}~${s.max} 的数字`]));
  const dims = Object.entries(T.relation_dims).map(([k, x]) => `"${k}":"${x.label} ${x.min}~${x.max}"`).join(',');
  return `{
 "name":"姓名", "brief":"一句话简介", "identity":"身份", "appearance":"外貌", "speech":"说话方式与口头禅", "background":"背景经历",
 "personality":${pers},
 "likes":["喜好"], "dislikes":["厌恶"], "boundaries":"绝不会做的事",
 "fields":${JSON.stringify(fields)},
 "stats":${JSON.stringify(stats)},
 "drives":"核心驱动力（长期不变的深层动机）",
 "goals":[{"text":"具体、可推进的当前目标","priority":1}],
 "relations":{"player":{"type":"与玩家的关系类型","note":"如何看待玩家","dims":{${dims}}}, "已有角色的id":{"type":"…","note":"…","dims":{…}}},
 "secrets":[{"text":"秘密全文","hint":"未暴露时的外在表现","reveal_at":50,"where":"可被实地发现的地点id，可省略"}],
 "schedule":[{"from":"HH:MM","to":"HH:MM","at":"地点id"}],
 "inventory":[{"name":"物品名","desc":"外观、来历、功效或用途"}],
 "init":{"mood":"初始心情"}
}`;
}
function sanitizeNpc(g, d){
  const n = normalizeNpc(g, d), sc = schemeOf(d);
  if (sc.kind === 'type' && !sc.types[n.personality.type]) n.personality.type = '';
  for (const k of Object.keys(n.personality.dims || {})) n.personality.dims[k] = clamp(+n.personality.dims[k] || 50, 0, 100);
  n.schedule = n.schedule.filter(e => d.locations[e.at]);
  n.secrets.forEach(s => { if (s.where && !d.locations[s.where]) s.where = ''; });
  for (const [k, def] of statDefsOf(d, 'npc')) if (n.stats[k] != null) n.stats[k] = def.type === 'level' ? clamp(Math.round(+n.stats[k]) || 0, 0, def.levels.length - 1) : clamp(+n.stats[k] || 0, def.min ?? -Infinity, def.max ?? Infinity);
  for (const r of Object.values(n.relations)) for (const k of Object.keys(r.dims)){ const dd = d.template.relation_dims[k]; if (!dd) delete r.dims[k]; else r.dims[k] = clamp(+r.dims[k] || 0, dd.min, dd.max); }
  return n;
}
