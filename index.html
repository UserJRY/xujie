$('#moveBody').addEventListener('toggle', e => { const el = e.target; if (el.dataset?.open) ED.open[el.dataset.open] = el.open; }, true);
$('#moveBody').addEventListener('click', e => {
  const t = e.target.closest('[data-maptab],[data-map-area],[data-go-region],[data-go-place],[data-ia],[data-q],[data-say],[data-bag],[data-jr],[data-pass],[data-durpick]'); if (!t || t.disabled) return;
  if (t.dataset.pass){ if (!busy){ closeMove(); openPass(t.dataset.pass); } return; }
  if (t.dataset.durpick){ if (!busy){ closeMove(); openDur(t.dataset.durpick); } return; }
  if (t.dataset.jr){ journalMark(t.dataset.id, t.dataset.jr); return renderBottom(); }
  if (t.dataset.bag){ if (!busy) bagAction(t.dataset.bag, t.dataset.name); return; }
  if (t.dataset.say){ const ns = S.npcs[t.dataset.say], nm = ns.met || settings.godMode ? card(t.dataset.say).name : '那人'; closeMove(); const a = $('#act'); a.value = `对${nm}说：「」`; a.focus(); a.setSelectionRange(a.value.length - 1, a.value.length - 1); return; }
  if (t.dataset.maptab){ mapTab = t.dataset.maptab; mapView = null; return renderBottom(); }
  if (t.dataset.mapArea){ mapTab = 'walked'; mapView = t.dataset.mapArea; return renderBottom(); }
  if (t.dataset.q === 'bag'){ sheetMode = 'bag'; return renderBottom(); }
  if (t.dataset.q === 'people'){ closeMove(); return openSheet('people'); }
  if (busy) return;
  closeMove();
  if (t.dataset.goPlace) doMove('place', t.dataset.goPlace);
  else if (t.dataset.goRegion) doMove('region', t.dataset.goRegion);
  else if (t.dataset.ia) doInteract(t.dataset.ia, t.dataset.id, t.dataset.npc, t.dataset.item, t.dataset.dur);
  else if (t.dataset.q === 'explore') doExplore();
});
$('#statusbar').addEventListener('click', e => { const b = e.target.closest('[data-npc]'); if (b) openNpcCard(b.dataset.npc); });
$('#pop').addEventListener('click', e => {
  if (e.target.id === 'pop') return closePop();
  const b = e.target.closest('[data-pop]'); if (!b || b.disabled) return;
  const id = b.dataset.id, k = b.dataset.pop;
  if (k === 'close') return closePop();
  if (k === 'gift') return openNpcCard(id, !b.textContent.includes('▴'));
  if (k === 'say'){ closePop(); const ns = S.npcs[id], nm = ns.met || settings.godMode ? card(id).name : strangerName(id); const a = $('#act'); a.value = `对${nm}说：「」`; a.focus(); a.setSelectionRange(a.value.length - 1, a.value.length - 1); return; }
  if (k === 'ia'){ closePop(); whenIdle(() => doInteract('npc', b.dataset.ia, id, b.dataset.item)); }
});
$('#tabs').addEventListener('click', async e => {
  const b = e.target.closest('[data-tab]'); if (!b || b.dataset.tab === curTab) return;
  flushInput(); if (curTab === 'editor' && !(await edLeaveOK())) return;
  if (b.dataset.tab === 'editor') ED.from = curTab;   // 记住从哪一页进的编辑器，编辑器首页的「‹」回到那里
  curTab = b.dataset.tab; renderSheet(false);
});

const SB = $('#sheetBody');
SB.addEventListener('toggle', e => { const el = e.target; if (el.dataset?.open) ED.open[el.dataset.open] = el.open; }, true);
SB.addEventListener('input', e => {
  const el = e.target;
  if (el.type === 'range' && el.dataset.p){ const o = SB.querySelector(`[data-rv="${el.dataset.p}"]`); if (o) o.textContent = el.value; }
  if (curTab === 'editor' && (el.dataset.p || el.dataset.kvkey != null)) markDirty();   // 一开始输入，顶栏就出现「保存」
});
SB.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.p || el.dataset.kvkey != null) return edChange(el);
  if (el.dataset.k){
    const v = el.type === 'checkbox' ? el.checked : el.type === 'number' ? (parseFloat(el.value) || 0) : el.value;
    setPath(settings, el.dataset.k, v);
    if (saveSettings()) toast(el.dataset.k === 'godMode' ? (v ? '已开启上帝视角' : '已关闭上帝视角') : '设置已自动保存');   // 设置页没有保存按钮，改完即存，给个回执
    if (el.dataset.k === 'godMode') renderSheet();
  } else if (el.dataset.kitsel){ ED[el.dataset.kitsel] = el.value;
  } else if (el.dataset.npclock && S){
    const id = el.dataset.npclock, ns = S.npcs[id]; if (!ns) return;
    pushUndo(); ns.lock = el.value; if (!el.value){ ns.heatT = S.t; } retier(id); autosave(); renderSheet(); toast(el.value ? `已锁定为${TIER_NAMES[el.value]}` : '已改为按热度自动分级');
  } else if (el.dataset.ag && S){
    const [i, f] = el.dataset.ag.split('.'); const e = S.agenda?.[+i]; if (!e) return;
    e[f] = el.value; if (f === 'status' && el.value !== 'active') e.closedAt = S.t; autosave(); if (f !== 'result') renderSheet(); else toast('已保存');
  } else if (el.dataset.mod){
    const [i, f] = el.dataset.mod.split('.'); const m = settings.modules[+i]; if (!m) return;
    m[f] = el.type === 'checkbox' ? el.checked : el.value; saveSettings(); if (f !== 'text') renderSheet(); else toast('模块已保存');
  } else if (el.dataset.modt){
    const [i, t] = el.dataset.modt.split('.'); const m = settings.modules[+i]; if (!m) return;
    m.targets = arr(m.targets).filter(x => x !== t); if (el.checked) m.targets.push(t); saveSettings(); renderSheet();
  } else if (el.dataset.fb){
    const [i, f] = el.dataset.fb.split('.'); const list = fbGet(); if (!list[+i]) return; list[+i][f] = el.value; fbSet(list); if (f !== 'text') renderSheet(); else toast('已保存');
  } else if (el.dataset.lore != null && S){
    const e = S.lore?.[+el.dataset.lore]; if (e){ e.content = el.value; autosave(); toast('已保存'); }
  } else if (el.dataset.wo && S){
    S.wo = S.wo || {}; S.wo[el.dataset.wo] = el.value.trim(); autosave(); toast('已保存');
  }  else if (el.dataset.prompt){
    const r = el.dataset.prompt; settings.prompts[r] = el.value.trim() === DEFAULT_PROMPTS[r].trim() ? '' : el.value; saveSettings(); toast('提示词已保存');
  } else if (el.dataset.actChange === 'preset'){
    const p = PRESETS[el.value]; settings.preset = el.value; if (p.base) settings.base = p.base;
    for (const r of Object.keys(settings.roles)){ if (p.model) settings.roles[r].model = p.model; settings.roles[r].extra = p.extra; }
    saveSettings(); renderSheet(); toast('已套用预设' + (p.model ? '' : '，请填写模型名'));
  }
});
SB.addEventListener('click', async e => {
  if (e.target.closest('button')) flushInput();   // 先提交正在输入的框，再执行按钮动作
  const mm = e.target.closest('[data-map-map]');
  if (mm){ mapView = mm.dataset.mapMap; mapSel = null; renderSheet(); return; }
  const mr = e.target.closest('[data-map-region]');
  if (mr){ const id = mr.dataset.mapRegion; if (curTab === 'editor'){ edPush({v:'region', id}); renderSheet(false); } else { mapSel = id; renderSheet(); } return; }
  const eb = e.target.closest('[data-ed]'); if (eb){ if (!eb.disabled) await edClick(eb); return; }
  const jr = e.target.closest('[data-jr]'); if (jr && S){ journalMark(jr.dataset.id, jr.dataset.jr); renderSheet(); return; }
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, i = b.dataset.i, id = b.dataset.id;
  switch (act){
    case 'map-go-place': closeSheet(); doMove('place', id); break;
    case 'map-go-region': closeSheet(); mapSel = null; doMove('region', id); break;
    case 'map-explore': closeSheet(); doExplore(); break;
    case 'map-view': mapView = id; mapSel = null; renderSheet(); break;
    case 'goto-editor': ED.from = curTab; ED.stack = [{v:'home'}]; curTab = 'editor'; renderSheet(false); break;   // 从「编辑这个世界」进来，从编辑器首页开始（草稿不受影响）
    case 'world-new': {
      const src = normalizeWorld(BUILTIN_WORLDS[$('#tplSel').value]), w = makeWorldFrom(src, $('#tplBlank').checked);
      if (!libPut(w)) return alert('新建失败：浏览器存储空间可能已满。');
      if (enterWorld(w.meta.id, true)){ ED.from = 'worlds'; curTab = 'editor'; renderSheet(false); toast('已新建：' + w.meta.title); } break; }
    case 'world-import': pickFile(importWorld); break;
    case 'world-enter': if (enterWorld(id)){ closeSheet(); closeHome(); toast('已进入：' + W.meta.title); } break;
    case 'world-dup': { const w = makeWorldFrom(normalizeWorld(libGet()[id]), false); libPut(w); renderSheet(); toast('已复制：' + w.meta.title); break; }
    case 'world-export': { const w = libGet()[id]; download(`叙界世界包_${w.meta.title}.json`, w); break; }
    case 'world-del': if (confirm(`删除世界「${libGet()[id]?.meta.title}」？它的自动存档也会删除。`)){ libDel(id); renderSheet(); } break;
    case 'newgame': {
      if (!confirm('开始新游戏？这个世界的自动存档会被覆盖。')) return;
      closeSheet(); newGame(); openCreate(); break; }
    case 'slot-save': Store.set(KEY.slot(i), {worldId:W.meta.id, savedAt:Date.now(), S}); toast('已保存到存档 ' + i); renderSheet(); break;
    case 'slot-load': {
      const d = Store.get(KEY.slot(i)); if (!d) return toast('空存档');
      if (d.S?.v !== 2) return toast('旧版本存档，无法读取');
      if (d.worldId !== W.meta.id){ if (!libGet()[d.worldId]) return toast('这个存档所属的世界不在世界库里'); if (!enterWorld(d.worldId)) return; }
      S = d.S; syncStateToWorld(); undoStack = []; lastNarr = null; autosave(); closeSheet(); closeHome(); toast('已读取存档 ' + i); break; }
    case 'slot-del': if (confirm('删除存档 ' + i + '？')){ Store.del(KEY.slot(i)); renderSheet(); } break;
    case 'save-export': download(`叙界存档_${W.meta.title}_第${dayOf(S.t)}天.json`, {type:'xujie-save', world:W, S}); break;
    case 'save-import': pickFile(d => {
      if (d.type !== 'xujie-save' || !d.S || !d.world) return toast('不是叙界的存档文件');
      if (d.S.v !== 2) return toast('旧版本存档，无法读取');
      const w = normalizeWorld(d.world), errs = validateWorld(w); if (errs.length) return alert('存档内的世界包有问题：\n' + errs.join('\n'));
      libPut(w); W = w; Store.set(KEY.cur, w.meta.id); ED.reset(); S = d.S; syncStateToWorld(); undoStack = []; lastNarr = null; autosave(); closeSheet(); toast('已导入进度'); }); break;
    case 'test': {
      const out = $('#testOut'); out.textContent = '测试中…';
      try {
        const res = await LLM.call('gm', [{role:'system', content:'你是连接测试。只输出 JSON。'}, {role:'user', content:'请输出 JSON：{"ok": true, "msg": "一句中文问候"}'}]);
        out.innerHTML = `<span style="color:var(--good)">✓ 连接成功（裁定者模型）</span> 返回：${esc(res.text.slice(0, 120))}${parseJSON(res.text) ? '' : '<br><span style="color:var(--bad)">但返回的不是 JSON，裁定可能不稳定。</span>'}`;
      } catch(err){ out.innerHTML = `<span style="color:var(--bad)">✗ ${esc(err.message)}</span>`; }
      break; }
    case 'prompt-reset': settings.prompts[b.dataset.r] = ''; saveSettings(); renderSheet(); toast('已恢复默认'); break;
    case 'theme': settings.theme = b.dataset.v; saveSettings(); applyLook(); renderSheet(); break;
    case 'font': settings.font = b.dataset.v; saveSettings(); applyLook(); renderSheet(); break;
    case 'lh': settings.lh = +b.dataset.v; saveSettings(); applyLook(); renderSheet(); break;
    case 'go-home': closeSheet(); openHome(); break;
    case 'fs-': case 'fs+': settings.fs = clamp(settings.fs + (act === 'fs+' ? 1 : -1), 12, 24); saveSettings(); document.documentElement.style.setProperty('--fs', settings.fs + 'px'); renderSheet(); break;
    case 'chg-undo': {
      const e = S.changelog[+i]; if (!e) return;
      if (!confirm(`撤销这条修改？\n${pathLabel(e.path)}：恢复为 ${shortV(e.from)}`)) return;
      pushUndo();
      const cur = clone(getPath(S, e.path));
      if (e.from === undefined) delPath(S, e.path); else setPath(S, e.path, clone(e.from));
      S.changelog.push({turn:S.turn, t:S.t, by:'撤销', path:e.path, from:cur, to:clone(e.from), reason:'撤销了一条修改'});
      autosave(); render(); toast('已撤销'); break; }
    case 'mod-add': settings.modules = [...arr(settings.modules), {id:'m' + Date.now().toString(36), name:'新模块', kind:'normal', on:false, targets:['narrator'], text:''}]; saveSettings(); renderSheet(); break;
    case 'mod-del': if (confirm('删除这个模块？')){ settings.modules.splice(+b.dataset.i, 1); saveSettings(); renderSheet(); } break;
    case 'fb-add': { const t = prompt('反馈内容：', ''); if (t && t.trim()){ fbAdd('其他', t.trim(), ''); renderSheet(); } break; }
    case 'fb-del': if (confirm('删除这条反馈？')){ const l = fbGet(); l.splice(+b.dataset.i, 1); fbSet(l); renderSheet(); } break;
    case 'fb-copy': try { await navigator.clipboard.writeText(fbMarkdown()); toast('已复制，可以直接粘贴给 Claude'); } catch(e){ toast('复制失败，请用导出'); } break;
    case 'fb-export': { const blob = new Blob([fbMarkdown()], {type:'text/markdown'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '叙界反馈档案.md'; a.click(); break; }
    case 'lore-del': if (S && confirm('删除这条设定？')){ S.lore.splice(+b.dataset.i, 1); autosave(); renderSheet(); } break;
    case 'npc-defaults': settings.npc = clone(DEFAULT_SETTINGS.npc); saveSettings(); renderSheet(); toast('已恢复默认'); break;
    case 'npc-archive': if (S?.npcs[id]){ pushUndo(); archiveNpc(id, '手动封存'); autosave(); renderSheet(); toast('已封存：' + npcName(id)); } break;
    case 'npc-recall': if (S?.npcs[id]){ pushUndo(); unarchiveNpc(id, '手动召回'); autosave(); renderSheet(); toast('已召回：' + npcName(id)); } break;
    case 'npc-delete': if (S?.npcs[id] && confirm(`彻底删除「${npcName(id)}」？他的档案、记忆和关系都会删掉（可以用撤销恢复）。`)){ pushUndo(); deleteNpc(id, '手动删除'); autosave(); renderSheet(); } break;
    case 'ag-del': if (S && confirm('删除这条后台事项？')){ S.agenda.splice(+i, 1); autosave(); renderSheet(); } break;
    case 'mem-now': { closeSheet(); setBusy(true, '🗂 整理记忆…'); await maintenance(false, true); autosave(); setBusy(false); render(); toast('记忆整理完成'); break; }
    case 'npc-keep': {
      if (busy) return; setBusy(true, `🧬 维护人物档案：${npcName(id)}…`);
      try { const o = await keepNpc(id); toast(o.hid.length || o.pub.length ? '档案已更新：' + [...o.pub, ...o.hid].join('；').slice(0, 80) : '没有需要更新的内容'); autosave(); }
      catch(err){ alert('维护失败：' + err.message); }
      setBusy(false); renderSheet(); break; }
    case 'state-apply': {
      const j = parseJSON($('#stateJson').value); if (!isObj(j) || j.v !== 2) return toast('JSON 无效');
      pushUndo(); S = {...j, log:S.log}; syncStateToWorld(); autosave(); render(); toast('状态已修改'); break; }
  }
});
window.addEventListener('beforeunload', e => { if (ED.dirty){ e.preventDefault(); e.returnValue = ''; } });

/* ======== 手机返回键 / 侧滑返回：关掉最上面一层，而不是直接离开页面 ========
   有任何一层（弹窗、小卡、底部面板、菜单页、捏人页、主菜单的子页）打开时，在浏览器历史里放一个「守卫」条目；
   按返回会先消耗守卫，由 navBack 关掉最上面一层；还有层开着就再放一个守卫。 */
function navBack(){
  if ($('#modal').classList.contains('open')){ closeModal(); if (S) renderSugg(); return; }
  if ($('#pop').classList.contains('open')) return closePop();
  if ($('#moveSheet').classList.contains('open')) return closeMove();
  if ($('#sheet').classList.contains('open')) return curTab === 'editor' ? edBack() : sheetExit(false);
  if ($('#createSheet').classList.contains('open')){ closeCreate(); return openHome('worlds'); }
  if ($('#home').classList.contains('open') && homeView !== 'main') return openHome('main');
}
const Nav = {
  armed:false, skip:false, ok:true,
  layered(){ return ['#modal', '#pop', '#moveSheet', '#sheet', '#createSheet'].some(s => $(s).classList.contains('open')) || ($('#home').classList.contains('open') && homeView !== 'main'); },
  sync(){
    if (!this.ok) return;
    try {
      const need = this.layered();
      if (need && !this.armed){ history.pushState({xj:1}, ''); this.armed = true; }
      else if (!need && this.armed){ this.armed = false; if (history.state?.xj){ this.skip = true; history.back(); } }   // 层都用按钮关掉了：把守卫收回，免得下次按返回没反应
    } catch(e){ this.ok = false; }   // 受限环境（沙盒 iframe 等）不支持就放弃，不影响其他功能
  }
};
window.addEventListener('popstate', () => {
  if (Nav.skip){ Nav.skip = false; return; }
  if (!Nav.armed) return;
  Nav.armed = false; navBack(); Nav.sync();
});
{ const mo = new MutationObserver(() => queueMicrotask(() => Nav.sync()));
  for (const s of ['#modal', '#pop', '#moveSheet', '#sheet', '#createSheet', '#home']) mo.observe($(s), {attributes:true, attributeFilter:['class']}); }

(function boot(){
  applyLook();
  const L = libGet();
  if (!Store.get('xj.v07')){   // v0.7：删除旧的预设世界（雾港、青云外门、合租日记、柳河镇、旧霄剑宗）
    for (const k of Object.keys(L)) if (['fogport','qingyun','city','liuhe','xiaojian'].includes(k) || /^xiaojian_old/.test(k)){ delete L[k]; Store.del(KEY.auto(k)); }
    Store.set('xj.v07', 1);
  }
  const old = Store.get('xj.world');   // v0.1 迁移
  if (old){ try { const w = normalizeWorld(old); if (w.meta.id !== 'fogport' && !L[w.meta.id]) L[w.meta.id] = w; } catch(e){} Store.del('xj.world'); Store.del('xj.save.auto'); }
  for (const [k, w] of Object.entries(BUILTIN_WORLDS)) if (!Store.get('xj.builtin.' + k)){ if (!L[k]) L[k] = normalizeWorld(w); Store.set('xj.builtin.' + k, w.meta.version); }
  // 内置世界升级：旧版连同自动存档备份为「（旧版）」，世界库里换成新版
  for (const [k, ver] of Object.entries(BUILTIN_UPGRADES)){
    const w = BUILTIN_WORLDS[k], flag = Store.get('xj.builtin.' + k);
    if (!w || flag === ver) continue;
    if (L[k] && L[k].meta?.version !== ver){
      const bid = k + '_old' + Math.random().toString(36).slice(2, 5), old = clone(L[k]);
      old.meta.id = bid; old.meta.title = (old.meta.title || k) + '（旧版）'; L[bid] = old;
      const auto = Store.get(KEY.auto(k)); if (auto){ auto.worldId = bid; if (auto.S) auto.S.worldId = bid; Store.set(KEY.auto(bid), auto); Store.del(KEY.auto(k)); }
    }
    L[k] = normalizeWorld(w); Store.set('xj.builtin.' + k, ver);
  }
  for (const [k, w] of Object.entries(BUILTIN_WORLDS)) if (L[k]){   // 给旧版本存进世界库的内置世界补上物品描述
    const src = normItems(w.player.inventory), inv = normItems(L[k].player?.inventory);
    inv.forEach(it => { if (!it.desc) it.desc = src.find(x => x.name === it.name)?.desc || ''; }); if (L[k].player) L[k].player.inventory = inv;
    for (const [nid, n] of Object.entries(w.npcs)) if (L[k].npcs?.[nid] && !arr(L[k].npcs[nid].inventory).length) L[k].npcs[nid].inventory = clone(n.inventory || []);   // 补上NPC物品栏
  }
  if (!Object.keys(L).length) L.xianxia = normalizeWorld(BUILTIN_WORLDS.xianxia);
  Store.set(KEY.lib, L);
  let cur = Store.get(KEY.cur); if (!L[cur]) cur = L.xianxia ? 'xianxia' : Object.keys(L)[0];
  W = normalizeWorld(L[cur]); Store.set(KEY.cur, cur);
  const auto = Store.get(KEY.auto(cur));
  if (auto?.S?.v === 2){ S = auto.S; syncStateToWorld(); render(); } else newGame();
  openHome();
})();
