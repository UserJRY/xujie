      if (setL(`npcs.${id}.card.${k}`, val, '作者', '在编辑器中修改')) n++;
    }
    for (const [k, v] of Object.entries(nb.stats || {})) if (v != null && v !== '' && na.stats?.[k] !== v && setL(`npcs.${id}.stats.${k}`, +v, '作者', '在编辑器中修改')) n++;
    for (const [t, r] of Object.entries(nb.relations || {})){
      const ra = na.relations?.[t]; if (same(ra, r) || (t !== 'player' && !S.npcs[t]?.card)) continue;
      relEnsure(id, t); const base = `rels.${relKey(id, t)}`;
      if ((ra?.type || '') !== (r.type || '') && setL(base + '.type', r.type || '', '作者', '在编辑器中修改')) n++;
      if ((ra?.note || '') !== (r.note || '') && setL(base + '.note', r.note || '', '作者', '在编辑器中修改')) n++;
      for (const [dk, dv] of Object.entries(r.dims || {})) if (ra?.dims?.[dk] !== dv && dv != null && dv !== '' && setL(`${base}.dims.${dk}`, +dv, '作者', '在编辑器中修改')) n++;
    }
  }
  return n;
}

/* ---------------- AI 辅助创作（创作助手角色） ---------------- */
function worldCtx(d){
  return `【世界】${d.meta.title}（${d.meta.genre || ''}）\n${d.setting || '（未填写世界背景）'}\n文风：${d.style || ''}\n` +
    `【区域】${Object.entries(d.regions).map(([k, r]) => `${k}：${d.maps[r.map]?.name || ''}·${r.name}`).join('；') || '无'}\n` +
    `【地点】${Object.entries(d.locations).map(([k, l]) => `${k}：${l.name}`).join('；') || '无'}\n` +
    `【已有角色】${Object.entries(d.npcs).map(([k, n]) => `${k}：${n.name}（${n.brief}）`).join('；') || '无'}`;
}
function npcSchema(d){
  const T = d.template, sc = schemeOf(d);
  const pers = sc.kind === 'type' ? `{"type":"${Object.keys(sc.types).join('/')} 之一","traits":"在类型基础上的个人特质、矛盾、怪癖、情绪稳定性"}`
    : sc.kind === 'dims' ? `{"dims":{${Object.entries(sc.dims).map(([k, x]) => `"${k}":"${x.label} 0~100"`).join(',')}},"traits":"个人特质"}` : `{"traits":"性格描述"}`;
  const fields = Object.fromEntries(T.npc_fields.map(f => [f.key, `${f.label}${f.options?.length ? '（从中选：' + f.options.join('/') + '）' : ''}${f.desc ? '：' + f.desc : ''}`]));
  const stats = Object.fromEntries(statDefsOf(d, 'npc').map(([k, s]) => [k, s.type === 'level' ? `${s.label}：等级序号（${s.levels.map((l, i) => i + '=' + l).join('，')}）` : `${s.label}：${s.min}~${s.max} 的数字`]));
  const dims = Object.entries(T.relation_dims).map(([k, x]) => `"${k}":"${x.label} ${x.min}~${x.max}"`).join(',');
  return `{
 "name":"姓名", "brief":"一句话简介", "identity":"身份", "appearance":"外貌", "speech":"说话方式与口头禅", "background":"背景经历",
 "personality":${pers},
 "likes":["喜好"], "dislikes":["厌恶"], "boundaries":"绝不会做的事",
 "fields":${JSON.stringify(fields)},
 "stats":${JSON.stringify(stats)},
 "drives":"核心驱动力（长期不变的深层动机）",
 "goals":[{"text":"具体、可推进的当前目标","priority":1}],
 "relations":{"player":{"type":"与玩家的关系类型","note":"如何看待玩家","dims":{${dims}}}, "已有角色的id":{"type":"…","note":"…","dims":{…}}},
 "secrets":[{"text":"秘密全文","hint":"未暴露时的外在表现","reveal_at":50,"where":"可被实地发现的地点id，可省略"}],
 "schedule":[{"from":"HH:MM","to":"HH:MM","at":"地点id"}],
 "inventory":[{"name":"物品名","desc":"外观、来历、功效或用途"}],
 "init":{"mood":"初始心情"}
}`;
}
function sanitizeNpc(g, d){
  const n = normalizeNpc(g, d), sc = schemeOf(d);
  if (sc.kind === 'type' && !sc.types[n.personality.type]) n.personality.type = '';
  for (const k of Object.keys(n.personality.dims || {})) n.personality.dims[k] = clamp(+n.personality.dims[k] || 50, 0, 100);
  n.schedule = n.schedule.filter(e => d.locations[e.at]);
  n.secrets.forEach(s => { if (s.where && !d.locations[s.where]) s.where = ''; });
  for (const [k, def] of statDefsOf(d, 'npc')) if (n.stats[k] != null) n.stats[k] = def.type === 'level' ? clamp(Math.round(+n.stats[k]) || 0, 0, def.levels.length - 1) : clamp(+n.stats[k] || 0, def.min ?? -Infinity, def.max ?? Infinity);
  for (const r of Object.values(n.relations)) for (const k of Object.keys(r.dims)){ const dd = d.template.relation_dims[k]; if (!dd) delete r.dims[k]; else r.dims[k] = clamp(+r.dims[k] || 0, dd.min, dd.max); }
  return n;
}
async function aiCall(user){
  toast('✨ 生成中，通常需要十几秒…');
  const res = await LLM.call('builder', [{role:'system', content:prompt_('builder')}, {role:'user', content:user}]);
  const j = parseJSON(res.text); if (!isObj(j)) throw new Error('AI 返回的不是有效 JSON（可到「调试」页查看原文）');
  return j;
}
async function aiAction(a, id, p){
  if (ED.aiBusy) return toast('上一个生成还没完成');
  const d = ED.draft;
  try {
    if (a === 'ai-npc-new' || a === 'ai-npc-fill'){
      const cur = id ? d.npcs[id] : null;
      const concept = prompt(cur ? '补充要求（可留空，留空则按已填内容补全）：' : '用一句话描述这个角色：', ''); if (concept === null) return;
      ED.aiBusy = true;
      const g = await aiCall(`${worldCtx(d)}\n【关系类型参考】${d.template.relation_types.join('、')}\n\n【作者构想】${concept || '（无，按已有内容与世界设定发挥）'}\n` +
        (cur ? `【已填写的内容（在此基础上补全，保持一致）】\n${JSON.stringify(stripEmpty({...cur, name:cur.name === '新角色' ? '' : cur.name}))}\n` : '') +
        `\n请按下面的 JSON 结构输出一个角色。goals 1~3个；secrets 0~2个；inventory 0~3件（符合身份、最好有剧情用处）；schedule 覆盖角色一天的主要活动，地点只能用上面列出的id；与已有角色的关系挑相关的写：\n${npcSchema(d)}`);
      const n = sanitizeNpc(g, d);
      if (cur){
        const keep = confirm('只补全空白字段？\n确定＝保留你已填写的内容，只补空白\n取消＝用 AI 的结果整体替换');
        if (keep){ if (cur.name === '新角色') cur.name = ''; d.npcs[id] = normalizeNpc(fillBlank(cur, n), d); } else d.npcs[id] = n;
      } else { const nid = uniqueId('npc', d.npcs); d.npcs[nid] = n; ED.stack.push({v:'npc', id:nid}); }
      toast('✨ 已生成，检查后记得保存');
    } else if (a === 'ai-loc-new' || a === 'ai-loc-fill'){
      const cur = id ? d.locations[id] : null;
      const concept = prompt(cur ? '补充要求（可留空）：' : '用一句话描述这个地点：', ''); if (concept === null) return;
      ED.aiBusy = true;
      const g = await aiCall(`${worldCtx(d)}\n\n【作者构想】${concept || '（按已有内容发挥）'}\n${cur ? `【已填写的内容】${JSON.stringify(stripEmpty(cur))}\n` : ''}\n请输出一个地点：\n{"name":"地点名","desc":"60~120字的描写：样貌、氛围、可以在这里做的事","region":"所属区域id","tags":["关键词标签"]}`);
      const loc = {name:g.name || '新地点', desc:g.desc || '', region:d.regions[g.region] ? g.region : (cur?.region || Object.keys(d.regions)[0]), tags:arr(g.tags), known:cur ? cur.known : false};
      const lid = id || uniqueId('loc', d.locations);
      d.locations[lid] = cur ? fillBlank(cur, loc) : loc;
      if (!id) ED.stack.push({v:'loc', id:lid});
      toast('✨ 已生成，检查后记得保存');
    } else if (a === 'ai-region-fill'){
      const r = d.regions[id], have = Object.values(d.locations).filter(l => l.region === id).map(l => l.name);
      const concept = prompt(`为「${r.name}」生成几个地点？可以写具体要求（留空则按区域概况和生成基调）：`, ''); if (concept === null) return;
      ED.aiBusy = true;
      const g = await aiCall(`${worldCtx(d)}\n\n【区域】${r.name}：${r.desc}\n生成基调：${r.gen_style || '（无）'}\n已有地点：${have.join('、') || '无'}\n【作者要求】${concept || '生成4~6个有特色、可供剧情使用的地点'}\n\n请输出：{"locations":[{"name":"地点名","desc":"60~120字的描写：样貌、氛围、可以做的事","tags":["关键词"]}]}，不要与已有地点重复。`);
      let n = 0;
      for (const x of arr(g.locations)) if (isObj(x) && x.name && !have.includes(x.name)){ d.locations[uniqueId('loc', d.locations)] = {name:String(x.name), region:id, desc:String(x.desc || ''), tags:arr(x.tags), known:false}; n++; }
      toast(`✨ 已生成 ${n} 个地点（默认探索后出现），检查后记得保存`);
    } else if (a === 'ai-lore'){
      const it = fv(p); ED.aiBusy = true;
      const g = await aiCall(`${worldCtx(d)}\n\n【设定条目】标题：${it.title}\n关键词：${arr(it.keys).join('、')}\n已有内容：${it.content || '（空）'}\n\n请扩写这条设定（与世界观一致、具体、可供剧情使用，100~250字），并给出3~6个会触发它的关键词：\n{"title":"标题","keys":["关键词"],"content":"内容"}`);
      it.content = g.content || it.content; if (!arr(it.keys).length) it.keys = arr(g.keys); if (!it.title) it.title = g.title || '';
      toast('✨ 已扩写，检查后记得保存');
    }
    ED.dirty = true; renderSheet(false);
  } catch(e){ alert('生成失败：' + e.message); }
  finally { ED.aiBusy = false; }
}

      const cur = clone(getPath(S, e.path));
      if (e.from === undefined) delPath(S, e.path); else setPath(S, e.path, clone(e.from));
      S.changelog.push({turn:S.turn, t:S.t, by:'撤销', path:e.path, from:cur, to:clone(e.from), reason:'撤销了一条修改'});
      autosave(); render(); toast('已撤销'); break; }
    case 'mod-add': settings.modules = [...arr(settings.modules), {id:'m' + Date.now().toString(36), name:'新模块', kind:'normal', on:false, targets:['narrator'], text:''}]; saveSettings(); renderSheet(); break;
    case 'mod-del': if (confirm('删除这个模块？')){ settings.modules.splice(+b.dataset.i, 1); saveSettings(); renderSheet(); } break;
    case 'fb-add': { const t = prompt('反馈内容：', ''); if (t && t.trim()){ fbAdd('其他', t.trim(), ''); renderSheet(); } break; }
    case 'fb-del': if (confirm('删除这条反馈？')){ const l = fbGet(); l.splice(+b.dataset.i, 1); fbSet(l); renderSheet(); } break;
    case 'fb-copy': try { await navigator.clipboard.writeText(fbMarkdown()); toast('已复制，可以直接粘贴给 Claude'); } catch(e){ toast('复制失败，请用导出'); } break;
    case 'fb-export': { const blob = new Blob([fbMarkdown()], {type:'text/markdown'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '叙界反馈档案.md'; a.click(); break; }
    case 'lore-del': if (S && confirm('删除这条设定？')){ S.lore.splice(+b.dataset.i, 1); autosave(); renderSheet(); } break;
    case 'mem-now': { closeSheet(); setBusy(true, '🗂 整理记忆…'); await maintenance(false, true); autosave(); setBusy(false); render(); toast('记忆整理完成'); break; }
    case 'npc-keep': {
      if (busy) return; setBusy(true, `🧬 维护人物档案：${npcName(id)}…`);
      try { const o = await keepNpc(id); toast(o.hid.length || o.pub.length ? '档案已更新：' + [...o.pub, ...o.hid].join('；').slice(0, 80) : '没有需要更新的内容'); autosave(); }
      catch(err){ alert('维护失败：' + err.message); }
      setBusy(false); renderSheet(); break; }
    case 'state-apply': {
      const j = parseJSON($('#stateJson').value); if (!isObj(j) || j.v !== 2) return toast('JSON 无效');
      pushUndo(); S = {...j, log:S.log}; syncStateToWorld(); autosave(); render(); toast('状态已修改'); break; }
  }
});
window.addEventListener('beforeunload', e => { if (ED.dirty){ e.preventDefault(); e.returnValue = ''; } });

(function boot(){
  applyLook();
  const L = libGet();
  if (!Store.get('xj.v07')){   // v0.7：删除旧的预设世界（雾港、青云外门、合租日记、柳河镇、旧霄剑宗）
    for (const k of Object.keys(L)) if (['fogport','qingyun','city','liuhe','xiaojian'].includes(k) || /^xiaojian_old/.test(k)){ delete L[k]; Store.del(KEY.auto(k)); }
    Store.set('xj.v07', 1);
  }
  const old = Store.get('xj.world');   // v0.1 迁移
  if (old){ try { const w = normalizeWorld(old); if (w.meta.id !== 'fogport' && !L[w.meta.id]) L[w.meta.id] = w; } catch(e){} Store.del('xj.world'); Store.del('xj.save.auto'); }
  for (const [k, w] of Object.entries(BUILTIN_WORLDS)) if (!Store.get('xj.builtin.' + k)){ if (!L[k]) L[k] = normalizeWorld(w); Store.set('xj.builtin.' + k, w.meta.version); }
  // 内置世界升级：旧版连同自动存档备份为「（旧版）」，世界库里换成新版
  for (const [k, ver] of Object.entries(BUILTIN_UPGRADES)){
    const w = BUILTIN_WORLDS[k], flag = Store.get('xj.builtin.' + k);
    if (!w || flag === ver) continue;
    if (L[k] && L[k].meta?.version !== ver){
      const bid = k + '_old' + Math.random().toString(36).slice(2, 5), old = clone(L[k]);
      old.meta.id = bid; old.meta.title = (old.meta.title || k) + '（旧版）'; L[bid] = old;
      const auto = Store.get(KEY.auto(k)); if (auto){ auto.worldId = bid; if (auto.S) auto.S.worldId = bid; Store.set(KEY.auto(bid), auto); Store.del(KEY.auto(k)); }
    }
    L[k] = normalizeWorld(w); Store.set('xj.builtin.' + k, ver);
  }
  for (const [k, w] of Object.entries(BUILTIN_WORLDS)) if (L[k]){   // 给旧版本存进世界库的内置世界补上物品描述
    const src = normItems(w.player.inventory), inv = normItems(L[k].player?.inventory);
    inv.forEach(it => { if (!it.desc) it.desc = src.find(x => x.name === it.name)?.desc || ''; }); if (L[k].player) L[k].player.inventory = inv;
    for (const [nid, n] of Object.entries(w.npcs)) if (L[k].npcs?.[nid] && !arr(L[k].npcs[nid].inventory).length) L[k].npcs[nid].inventory = clone(n.inventory || []);   // 补上NPC物品栏
  }
  if (!Object.keys(L).length) L.xianxia = normalizeWorld(BUILTIN_WORLDS.xianxia);
  Store.set(KEY.lib, L);
  let cur = Store.get(KEY.cur); if (!L[cur]) cur = L.xianxia ? 'xianxia' : Object.keys(L)[0];
  W = normalizeWorld(L[cur]); Store.set(KEY.cur, cur);
  const auto = Store.get(KEY.auto(cur));
  if (auto?.S?.v === 2){ S = auto.S; syncStateToWorld(); render(); } else newGame();
  openHome();
})();
</script>
