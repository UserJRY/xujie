<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#14161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>叙界 v1.6 · LLM 文字RPG框架</title>
<style>
:root{--bg:#14161a;--panel:#1d2026;--panel2:#252931;--line:#2f343d;--text:#e6e1d6;--dim:#8f8b83;--acc:#d9a35b;--acc2:#79a9cc;--bad:#d46a6a;--good:#7fb27f;--fs:16px;--lh:1.68;
  --chip:#2b2a22;--chipline:#4a4130;--q:#f0d9a8;--ev:#e0b878;--evline:#5a4a30;--oocbg:#221d2e;--ooc:#c6a2f0;--iv:#9aa3b5;--upbg:#1f2a20;--downbg:#2d1f1f;--plate:#14161a;--plate2:#2b2a22;--maptx:#8f8b83;--maplbl:#1d2026;--mcur:#d9a35b;--mgo:#79a9cc;--mseen:#cfc9bd;--mfog:#5a5f69;--mline:#6f6b64;--mring:#2a2e35;
  --font:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;--rfont:var(--font)}
/* 配色：墨夜（默认）/ 宣纸 / 青灰 / 竹青 / 玄黑 */
body[data-theme=paper]{--bg:#f3ecdc;--panel:#ebe2cd;--panel2:#e1d6bd;--line:#d2c5a8;--text:#2e2a24;--dim:#7c7262;--acc:#9a5b1e;--acc2:#3d6a8a;--bad:#a8322d;--good:#3f7a3a;--chip:#efe0c0;--chipline:#cdb27e;--q:#7a3e10;--ev:#8a5a1a;--evline:#cdb27e;--oocbg:#e6ddf0;--ooc:#6b3fa0;--iv:#6f7684;--upbg:#dcebd5;--downbg:#f2d9d5;--plate:#f7f1e3;--plate2:#efe0c0;--maptx:#7c7262;--maplbl:#ebe2cd;--mcur:#9a5b1e;--mgo:#2f6a94;--mseen:#5a5248;--mfog:#b3a88f;--mline:#9b8f78;--mring:#d2c5a8}
body[data-theme=slate]{--bg:#1b2129;--panel:#222a33;--panel2:#2b343f;--line:#36414e;--text:#dfe5ea;--dim:#8d99a6;--acc:#e0b26a;--acc2:#8ab8d8;--chip:#2e2b23;--chipline:#55492f;--q:#f2dcae;--plate:#1b2129;--plate2:#2e2b23;--maplbl:#222a33}
body[data-theme=bamboo]{--bg:#1a201c;--panel:#212923;--panel2:#29332c;--line:#34413a;--text:#dde5da;--dim:#8a9a8c;--acc:#c9b46a;--acc2:#86b8a0;--chip:#2a2b20;--chipline:#4d4a2d;--q:#e9dfae;--plate:#1a201c;--plate2:#2a2b20;--maplbl:#212923}
body[data-theme=black]{--bg:#000;--panel:#0d0d0f;--panel2:#18181b;--line:#26262a;--text:#d8d4cc;--dim:#7d7a74;--acc:#c9974f;--acc2:#6f9cbd;--chip:#1c1a14;--chipline:#3b3424;--plate:#000;--plate2:#1c1a14;--maplbl:#0d0d0f}
body[data-font=serif]{--rfont:"Songti SC","Noto Serif SC","Source Han Serif SC","STSong","SimSun",serif}
body[data-font=kai]{--rfont:"Kaiti SC","STKaiti","KaiTi","Noto Serif SC",serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-size:var(--fs);line-height:1.6;font-family:var(--font)}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
header{display:flex;align-items:center;gap:8px;padding:calc(6px + env(safe-area-inset-top)) 12px 6px;background:var(--panel);border-bottom:1px solid var(--line)}
header .where{flex:1;min-width:0}
header .t1{font-size:.95em;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .t2{font-size:.78em;color:var(--dim)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:8px;padding:2px 10px;font-size:1.1em}
#statusbar{display:flex;gap:6px;flex-wrap:wrap;padding:6px 12px;font-size:.8em;border-bottom:1px solid var(--line);background:var(--panel)}
.stat{padding:1px 8px;border-radius:10px;background:var(--panel2)}
.npcchip{padding:1px 8px;border-radius:10px;background:var(--chip);color:var(--acc);border:1px solid var(--chipline);font-size:1em}
#feed{flex:1;overflow-y:auto;padding:14px 16px 24px;-webkit-overflow-scrolling:touch}
.e-narr{font-family:var(--rfont);line-height:var(--lh);letter-spacing:.02em}
.e-narr p{margin:0 0 .7em;text-align:justify}
.e-narr{margin-bottom:6px}
.e-player{color:var(--acc2);border-left:3px solid var(--acc2);padding:2px 10px;margin:16px 0 12px;font-size:.94em;white-space:pre-wrap}
.e-sys{color:var(--dim);font-size:.8em;text-align:center;margin:8px 0 14px}
.e-event{color:var(--ev);font-size:.85em;border:1px dashed var(--evline);border-radius:8px;padding:4px 10px;margin:10px 0;white-space:pre-line}
.e-h{text-align:center;color:var(--dim);font-size:.78em;letter-spacing:.5em;margin:18px 0 4px}
.e-h::before,.e-h::after{content:'—';margin:0 .6em;letter-spacing:0;opacity:.6}
#home{position:fixed;inset:0;z-index:8;background:var(--bg);display:none;flex-direction:column;overflow:auto;padding:calc(20px + env(safe-area-inset-top)) 22px calc(20px + env(safe-area-inset-bottom))}
#home.open{display:flex}
.hm-title{font-family:"Songti SC","Noto Serif SC","STSong",serif;font-size:3.2em;letter-spacing:.35em;text-align:center;margin:12vh 0 0;color:var(--text);padding-left:.35em}
.hm-sub{text-align:center;color:var(--dim);font-size:.82em;letter-spacing:.2em;margin:6px 0 9vh}
.hm-btns{display:flex;flex-direction:column;gap:10px;max-width:420px;width:100%;margin:0 auto}
.hm-b{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;font-size:1em;color:var(--text)}
.hm-b.main{border-color:var(--acc);color:var(--acc);font-weight:600;text-align:center;font-size:1.08em}
.hm-b small{display:block;color:var(--dim);font-size:.78em;font-weight:normal;margin-top:2px}
.hm-foot{margin-top:auto;padding-top:24px;text-align:center;color:var(--dim);font-size:.72em}
.wd{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;text-align:left;width:100%;color:var(--text)}
.wd b{font-size:1.05em}.wd .hint{margin-top:4px}
#createSheet{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column}
#createSheet.open{display:flex}
#createBody{flex:1;overflow:auto;padding:14px 14px 24px;-webkit-overflow-scrolling:touch}
.cs-foot{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel)}
.cs-foot .btn{flex:1;margin:0;padding:12px 0;font-size:1em}
.org{display:block;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;background:var(--bg)}
.org.on{border-color:var(--acc)}
.org .hint{margin:2px 0 0 1.6em}
.q{color:var(--q)}
.cursor::after{content:"▍";color:var(--acc);animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
#busy{font-size:.8em;color:var(--acc);padding:0 14px}
#busy:not(:empty){padding:4px 14px}
/* 导航：位置永远是一条路径 地图 › 区域 › 地点 */
.crumb{font-size:.86em;color:var(--dim);line-height:1.5}
.crumb b{color:var(--acc);font-weight:600}
.nav{margin:18px 0 6px;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px 12px 12px}
.nav-s{font-size:.78em;color:var(--dim);margin:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pc{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:5px 12px;font-size:.88em;color:var(--acc2)}
.pc.here{color:var(--acc);border-color:var(--chipline);background:var(--chip)}
.pc.find{color:var(--text);border-style:dashed}
.pc:disabled{opacity:.4}
.rows{display:flex;flex-direction:column;gap:6px}
.rw{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:.9em;color:var(--ev)}
.rw small{color:var(--dim);font-size:.82em;white-space:nowrap}
.rw.far{color:var(--text);justify-content:center;border-style:dashed}
.rw:disabled{opacity:.4}
details.mp{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin:10px 0;padding:4px 12px 8px}
details.mp>summary{display:flex;justify-content:space-between;align-items:center;font-size:1.05em;color:var(--text);padding:8px 0;font-weight:600}
details.rg{border-top:1px solid var(--line);margin:0;padding:2px 0 8px}
details.rg>summary{display:flex;justify-content:space-between;align-items:center;color:var(--acc2);font-size:.95em;padding:8px 0}
details.rg.cur>summary{color:var(--acc)}
details.mp>summary small,details.rg>summary small{color:var(--dim);font-size:.8em;font-weight:normal}
.sheet-title{flex:1;padding:10px 8px;font-weight:600}
#tools{display:flex;justify-content:space-between;padding:6px 10px 0;background:var(--panel);border-top:1px solid var(--line)}
#tools button{background:none;border:0;color:var(--dim);font-size:.76em;padding:3px 1px;white-space:nowrap}
#tools button.main{color:var(--acc);font-weight:600}
/* 移动面板：从底部弹出，点空白处收起 */
#moveSheet{position:fixed;inset:0;z-index:15;display:none;background:rgba(0,0,0,.45)}
#moveSheet.open{display:block}
#moveSheet .ms{position:absolute;left:0;right:0;bottom:0;max-height:86vh;overflow-y:auto;background:var(--bg);border-radius:16px 16px 0 0;padding:6px 12px calc(16px + env(safe-area-inset-bottom))}
#moveSheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 2px}
#moveSheet .nav{margin:6px 0 0;border:0;background:none;padding:0}
.closebar{display:block;width:100%;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);font-size:.95em}
.sheet-foot{padding:6px 12px calc(8px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
.sheet-foot .closebar{margin-top:0}
/* 地图：能去的亮色可点，去不了的灰色 */
.mg{margin:14px 0 4px;font-size:.8em;color:var(--dim);letter-spacing:.1em}
.rg-cur{border:1px solid var(--chipline);background:var(--chip);border-radius:12px;padding:10px 12px;margin:6px 0}
.rg-cur .t{color:var(--acc);font-weight:600}
#moveSheet .rw:not(.off){color:var(--acc2);border-color:var(--line)}
.rw.off{color:var(--dim);background:none;border-style:dashed;cursor:default}
.offp{font-size:.78em;color:var(--dim);padding:0 12px 4px;line-height:1.5}
.legend{font-size:.76em;color:var(--dim);margin:6px 0 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px 0 10px;vertical-align:-1px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;margin:4px 0 8px}
.seg button{flex:1;background:none;border:0;border-radius:8px;padding:7px 0;font-size:.88em;color:var(--dim)}
.seg button.on{background:var(--panel2);color:var(--acc);font-weight:600}
.mapsvg{width:100%;height:auto;display:block;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.mapsvg .mapnode{cursor:pointer}
details.who{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:6px 0;padding:2px 10px 8px}
details.who>summary{display:flex;justify-content:space-between;align-items:center;padding:8px 0;color:var(--text)}
details.who>summary small{color:var(--dim);font-size:.8em}
.e-ooc{margin:10px 0;padding:6px 10px;border:1px dashed var(--ooc);border-radius:8px;color:var(--ooc);font-size:.85em}
.e-oocr{margin:6px 0 14px;padding:8px 10px;background:var(--oocbg);border-radius:8px;color:var(--text);font-size:.85em;line-height:1.6}
.e-oocr b,.e-ooc b{color:var(--ooc);margin-right:4px}
.iv{color:var(--iv);font-style:italic}
.nm{font-weight:600}
details.mod{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:8px 0;padding:2px 12px 10px}
details.mod>summary{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0}
details.mod>summary small{color:var(--dim);font-size:.78em}
.fbi{border-top:1px solid var(--line);padding:8px 0}
.fbi.done textarea{opacity:.55}
.bag-it{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:8px 10px;margin:6px 0}
.bag-it.eq{border-color:var(--acc)}
.bag-it .nm2{color:var(--text);font-weight:600}
.bag-it .tag{font-size:.72em;color:var(--acc);margin-left:6px}
.e-choice{margin:10px 0 14px;border:1px solid var(--acc);border-radius:12px;padding:10px 12px;background:var(--panel)}
.e-choice.done{border-color:var(--line);opacity:.75}
.ch-t{font-weight:600;color:var(--acc);margin-bottom:4px}
.ch-opts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.ch-o{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--text);font-size:.92em}
.ch-o small{display:block;color:var(--dim);font-size:.8em;margin-top:2px;font-weight:normal}
.ch-in{display:flex;gap:6px;margin-top:8px}.ch-in input{flex:1}.ch-in .btn{margin:0}
.e-fb{margin:10px 0 14px;border-left:3px solid var(--acc);background:var(--panel);border-radius:0 10px 10px 0;padding:6px 10px}
.fb-t{font-size:.88em;color:var(--text);line-height:1.6}
.fb-c{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.fbc{font-size:.74em;padding:1px 8px;border-radius:10px;background:var(--panel2);color:var(--dim)}
.fbc.up{color:var(--good);background:var(--upbg)}.fbc.down{color:var(--bad);background:var(--downbg)}
#tools button:disabled{opacity:.4}
#inputbar{display:flex;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--panel)}
#act{flex:1;resize:none;height:64px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:.95em;line-height:1.5}
.primary{background:var(--acc);color:#1a1307;border:0;border-radius:10px;padding:0 18px;font-weight:600}
#sheet{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:10}
#sheet.open{display:flex}
#sheet .top{display:flex;align-items:center;padding:calc(6px + env(safe-area-inset-top)) 8px 0;background:var(--panel)}
.tabs{display:flex;overflow-x:auto;flex:1;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;border:0;color:var(--dim);padding:10px 11px;font-size:.9em;border-bottom:2px solid transparent}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
.sheet-body{flex:1;overflow-y:auto;padding:14px 14px calc(40px + env(safe-area-inset-bottom))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.card h3,.card h4{margin:0 0 6px}
.hint{font-size:.8em;color:var(--dim);margin:2px 0 6px;line-height:1.55}
label.f{display:block;font-size:.82em;color:var(--dim);margin:12px 0 3px}
input[type=text],input[type=password],input[type=number],select,textarea.f,textarea.p{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;font-size:.9em}
textarea.f{min-height:90px;line-height:1.5;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.76em}
textarea.p{line-height:1.6;resize:vertical}
textarea.big{min-height:60vh}
input.bad,textarea.bad{border-color:var(--bad)}
input[type=range]{width:100%}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.ck{display:inline-flex;align-items:center;gap:6px;margin:10px 14px 0 0;font-size:.88em}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:.86em;margin:6px 6px 0 0}
.btn.acc{background:var(--acc);color:#1a1307;border-color:var(--acc);font-weight:600}
.btn.ai{border-color:var(--ooc);color:var(--ooc)}
.btn.bad{color:var(--bad)}
.btn.sm{padding:2px 9px;font-size:.78em}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin:2px 0 7px;position:relative}
.bar>i{position:absolute;top:0;bottom:0;display:block}
.kv{font-size:.85em;margin:2px 0}
.kv b{color:var(--dim);font-weight:normal}
details{margin:6px 0}
summary{cursor:pointer;font-size:.88em;color:var(--acc2)}
details.item{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin:8px 0}
details.item>summary{color:var(--text);font-size:.88em}
details.grp{border-top:1px solid var(--line);padding-top:6px;margin-top:10px}
details.grp>summary{font-size:.95em;color:var(--acc);font-weight:600;padding:4px 0}
pre{white-space:pre-wrap;word-break:break-all;font-size:.72em;line-height:1.45;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;max-height:50vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:10px;font-size:.85em;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:86vw}
#toast.show{opacity:1}
.tag{display:inline-block;font-size:.72em;padding:0 6px;border-radius:6px;background:var(--panel2);color:var(--dim);margin-left:6px;font-weight:normal}
.edbar{position:sticky;top:-14px;z-index:2;display:flex;align-items:center;gap:6px;background:var(--bg);margin:-14px -14px 10px;padding:8px 14px;border-bottom:1px solid var(--line)}
.edbar .ttl{flex:1;font-weight:600;font-size:.95em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dirty{color:var(--acc);font-size:.75em}
.navitem{display:flex;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0}
.navitem .nt{flex:1}.navitem .ns{font-size:.78em;color:var(--dim)}
.navitem::after{content:"›";color:var(--dim);font-size:1.3em;margin-left:8px}
.mapwrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:10px}
.mapwrap svg{width:100%;height:auto;display:block}
.mapnode{cursor:pointer}
.multi{display:flex;flex-wrap:wrap;gap:4px 12px}
.multi label{font-size:.85em;display:inline-flex;gap:4px;align-items:center}
.code{font-family:ui-monospace,Menlo,monospace;font-size:.8em;background:var(--bg);padding:0 4px;border-radius:4px}
</style>
</head>
<body>
<header>
  <div class="where"><div class="t1" id="hLoc">—</div><div class="t2" id="hTime">—</div></div>
  <button class="iconbtn" id="menuBtn" aria-label="菜单">☰</button>
</header>
<div id="statusbar"></div>
<div id="feed"></div>
<div id="busy"></div>
<div id="tools"><button class="main" data-q="move">🗺 地图</button><button class="main" data-q="act">✋ 互动</button><button class="main" data-q="me">👤 我</button><button class="main" data-q="bag">🎒 背包</button><button data-q="wait">⏳等待</button><button data-q="reroll">⟳重写</button><button data-q="undo">↶撤销</button></div>
<div id="home"></div>
<div id="createSheet"><div id="createBody"></div><div class="cs-foot"><button class="btn" id="crSkip">跳过（用默认开局）</button><button class="btn acc" id="crStart">开始游戏</button></div></div>
<div id="moveSheet"><div class="ms"><div class="grab"></div><div id="moveBody"></div><button class="closebar" data-close="move">收起</button></div></div>
<div id="inputbar">
  <textarea id="act" placeholder="直接说话或行动。例：「婶子，测灵台往哪走？」 / 我挤到队伍前面"></textarea>
  <button class="primary" id="sendBtn">行动</button>
</div>
<div id="sheet">
  <div class="top"><div class="tabs" id="tabs"></div></div>
  <div class="sheet-body" id="sheetBody"></div>
  <div class="sheet-foot" style="display:flex;gap:8px"><button class="closebar" id="homeBtn" style="flex:0 0 32%">🏠 主菜单</button><button class="closebar" id="closeSheet" style="flex:1">✕ 关闭</button></div>
</div>
<div id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" style="display:none">
<script>
'use strict';
/* =====================================================================
   叙界 v1.6 · LLM 驱动的文字 RPG 框架

const DEFAULT_PROMPTS = {
common:`【框架原则】存档是这个世界的长期记忆，每回合重新注入。你看到的存档就是事实；存档里没有的，就是还没发生、还不存在。

【名词存在原则】正文与裁定里提到的有名有姓的地点、人物、物品、功法、势力，必须来自存档或世界包。需要新东西时，由裁定者通过对应的新增操作创建（new_npcs / new_locations / new_regions / new_lore / 物品变更），不得在正文里凭空出现。

【认知留白】每个人物只知道自己数据里有的信息。玩家提到某人不知道的地点、事件、物品、功法时，这个人表现出困惑、不屑、警惕，或只给模糊记忆（“似乎与××有关”），不得凭空接话。

【隐藏信息】带 hidden 标记的字段、NPC 的秘密、底色、真实动机与计划、前情摘要里标【隐】的内容，只供后台判断，不得以任何形式写进玩家可见的文字。`,

gm:`你是文字角色扮演游戏的「裁定者」，也是游戏存档的维护者。你决定这一回合发生什么、停在哪里，叙事者负责写出来。你不写小说、不写对白：你输出一个 JSON 对象。你对存档拥有完整的修改权限：地图（地点、区域、道路）、人物（档案、数值、位置、生死、去留）、玩家（数值、描述、字段、位置、物品）、物品、关系、时间、剧情阶段与标记、临时设定，全部可以改。代码不设上限，分寸由你按世界规则把握。

【一、读懂玩家输入】
- 对白：直接写出的台词（带不带引号都算），默认是对在场的人说；「对某某说：……」指明了对象。
- 行动：做某件事（走过去、递东西、动手、查看、离开）。混合：边说边做。
- 输入的标点和格式常常混乱，只看文字表达的意思。
对话是这个游戏最主要的玩法，和行动同等重要。一句话可以讨好、激怒、试探、威胁、许诺、撒谎、讨价还价、套话，都要认真裁定它的效果。【标准互动】只是界面上的快捷方式，裁定标准与自由输入完全相同。

【二、推进权——每回合先判断停在哪里】
1. 本回合内，有没有人向玩家发问、发出邀请、提出要求，或需要玩家表态？有 → 推进到这一刻为止，停，交给玩家。不替玩家答应、拒绝或回答。
2. 玩家指令只覆盖场景的一部分时，只执行这一部分，其余停住。
3. 不替玩家说台词，不替玩家决定去哪、买什么、跟谁走、要不要动手、要不要接受。
4. 突发事件（有人闯入、临时邀约、意外）一出现就停，交给玩家处理。
把停点写进 stop_reason。

【三、裁定结果】
1. 判断可行性与结果。依据：世界规则、数值定义、玩家状态、时间地点、相关NPC的角色卡、关系、记忆、目标与计划。
2. NPC 按自己的性格、目标和利益回应：同意、拒绝、讨价还价、追问、敷衍、撒谎、翻脸、转身离开、叫人。玩家的描述只代表「尝试」，结果由你决定。
3. 失败推动：玩家行动失败时必须产生新局面——新情况、NPC态度变化、意外变故或新的危机，不得只写“没成功”。
4. NPC 主动性与世界运转：玩家没有明显推进时，让在场NPC按各自的动机和计划主动行动：搭话、提议、试探、刁难、冲突、邀约。NPC之间可以自行合作或对抗，玩家可能被卷入；一次选择可以引发连锁反应。世界事件不打断玩家正在做的事，只在告一段落时介入；当前事件没有了结前，不再叠加新的重大事件。
5. 实力差：按世界规则执行。高位者看透低位者，低位者只觉深不可测；高位者的威压会压制挑衅。以弱胜强时，败者要有对应的心理冲击。
6. 好感阶段：关系数值后面括号里的词就是阶段，NPC 的态度必须符合阶段；从未与玩家相识的NPC视为陌生人，按性格决定克制有礼还是倨傲。
7. ruling：只写事实要点（NPC的反应与态度、透露了哪些信息的要点、发生了什么），50~150字，不写对白原文。未透露的秘密不要写，除非本回合正在透露或被发现。
8. focus：本回合需要说话或行动的NPC id，最多2个。玩家在和谁说话、对谁动手，谁就必须在 focus 里。

【四、节奏】默认慢速、生活化，写进 pace。
- 慢：对峙、试探、亲近、需要逐句把握的对话。每回合只推一小步（一个细节或一个人的反应）。
- 中：正常推进，一回合可以有多个动作；一旦出现推进权里说的打断，立即停。
- 快切：跳过数小时到数日。跳之前先问玩家：待办、邀约、要做的决定怎么处理（这一回合只问，不跳）。跳的过程中出现需要选择的事件，停下来交给玩家。落地后简要交代世界和人物的变化。
玩家没说就用中速，玩家可以随时指定。

【五、影响评估（每回合必做）】写改动之前，逐项问自己：这一回合之后，世界有没有因此不同？
- 时间：每回合都要推进（time_cost 至少为1）。参考：一两句对白 1~3分钟；一段交谈 5~15分钟；讨价还价、请教、打听细节 10~30分钟；吃饭 30分钟；干活、修炼 1~4小时；睡觉到天亮。
- 关系：NPC对玩家（以及在场NPC彼此之间）的关系有没有变。分量参考：寻常寒暄 0~1；说到对方心坎上、帮了小忙 +2~4；送对礼物、雪中送炭 +4~8；冒犯、撒谎被识破、得罪 -3~-10；背叛、动手 -10以上。分量合乎对方的性格：势利的人只认实力和好处，多疑的人不轻易涨信任，记仇的人跌了很难回来。关系质变时写新的关系类型和看法。
- 记忆：本回合与玩家有实质交流的每个NPC，都写一句以他视角的 memory。
- 物品与钱：买卖、赠予、借还、抢夺、偷窃、消耗、损坏，都要落实到物品栏和数值——交易两边都要写。NPC 送出的物品必须来自他的物品栏（先核对是否存在），送出即扣除；没有的东西不能给。
- 属性：体力、灵力等是否消耗或恢复。
- NPC：心情、目标进展、计划、对玩家的看法、身份处境是否变化；经历足以改变一个人时，改写角色卡对应字段的完整新值。
- 新东西：见第六条，本回合就登记。
- 地图与剧情：是否发现新地点、触发剧情标记、透露或发现秘密。
没有变化的项不写；但不要因为谨慎而漏写——对话改变了态度，就要写进关系和记忆。

【六、及时登记新内容】这个世界会随玩家的探索不断长出新东西。开局的角色只是为大剧情准备的骨架，不是全部。
- 新人物：剧情里出现了需要名字、会说话、可能再见的人（店小二、路人、对手、某人的手下、被提到的亲属），本回合就用 new_npcs 登记，写清身份、外貌、性格、说话方式、动机、年龄、所在地点；之后他会被持续扮演。叙事要出现的新名字，必须先由你登记。
- 新地点 / 新区域：玩家探索、打听或经过时合理地遇到新地方，用 new_locations / new_regions 登记。
- 新设定：本回合确立了世界包里没有的事实（一个门派、一种功法、一条规矩、一段传闻、一桩旧案），用 new_lore 登记成本局的临时设定；之后提到相关关键词会自动调出。
登记的内容要具体、合乎世界观与文风，不要与已有内容重复或矛盾。

【七、移动与同行】你有调动任何人和玩家位置的全部权限，玩家不必点地图。
- 玩家在行动或对白里表示要去某处（“去城里”“回家”“跟他去后巷”），并且裁定可行时，用 move_to 写目的地：区域id、地点id，或它们的名字都可以（见【可前往的已知去处】）。路上的时间由程序按地图路程自动计入，你写的 time_cost 只需包含路程以外的耗时。
- 同行：玩家约了人一起走（“和石小虎一起去”），对方同意时写 npcs.<id>.follow: true，他会一直跟着玩家移动；分开时写 follow: false。对方不愿意，就不写，并在 ruling 里写清楚。
- NPC 自己去别处（被叫走、回家、去报信）：写 npcs.<id>.move_to（地点或区域），可加 stay（停留分钟数）。
- 目的地在地图上不存在时：允许生成就先用 new_locations / new_regions 登记，再 move_to 到它。
- 路途很长、路上可能出事时，可以只走到中途某个区域，停下来交给玩家。

【八、选择栏】你可以给玩家弹出一个选择栏（choices），标题、说明、选项内容、选项个数都由你决定。它是界面上的按钮，不是正文，叙事者不会写它。
- 什么时候用：需要玩家明确表态或做决定的时刻——接不接受邀约、答不答应交易、选哪条路、要不要动手、快切前确认待办怎么处理、对方抛出的几个条件选哪个。日常对话、玩家正在自由行动时不要用。
- type：choice（几个选项，2~6个为宜）；confirm（是否确认，选项通常是“答应 / 拒绝”之类，措辞贴合情境）；input（请玩家输入一句话或一个数字，比如出价、报名字、写信）。
- 选项要是这个世界里真实可行、彼此不同的做法，写成玩家会做的事或会说的话；不要替玩家预设“正确答案”，也不要把所有选项都写成好结果。
- allow_custom：是否允许玩家不选而自己写（默认允许）。玩家永远可以无视选择栏，直接在输入框里做别的。
- 出现选择栏时，本回合就停在这里（stop_reason 写“等待玩家选择”）。

【九、反馈】feedback：每回合都写，一句话告诉玩家这一回合的结果（如“王婶很受用，多塞了你一个包子”“严执事没理你，只说按规矩排队”）。数值变化由程序自动列出，feedback 里不必重复数字。

【维护存档细则】
- 关系：任意角色之间（包括NPC对玩家）的态度变化写在 npcs.<id>.rel 或 relations。
- 目标与计划：目标达成、失败、放弃时更新状态；产生新目标时写 new_goal；NPC 的下一步打算写进 card.plan。
- 角色卡：态度和说话方式如果随对象与情境而不同（例如对弱者傲慢、对强者谄媚），写成条件化的描述，而不是每换一个场景就改写一次。
- 秘密：情境合理时透露（reveal），玩家实地调查发现（discover），NPC 产生新秘密时用 add_secret。
- 人物生死与去留：NPC 死亡写 npcs.<id>.status: "dead"，失踪、离开本地写 "missing"，重新出现写 "active"。死去的人不会再出现在任何地方。
- 剧情阶段：剧情明显进入下一阶段时，写 act（阶段id）。
- 地图：区域里有地点，区域内的地点互通。发现本区域【未发现的预设地点】用 discover_locations；区域允许生成时，新的地方用 new_locations 登记（名称具体、描述写清样貌与可以做的事，符合生成基调）；玩家对一个区域有了新的认识，用 region_notes 写出该区域档案的完整新内容；地点本身发生变化用 update_locations（可改名称、描写、标签、所属区域、是否已知）；地点被毁、消失用 remove_locations；区域的名称、概况、图标、是否可见变化用 update_regions；新修了路、路程变化用 add_routes，路断了、桥塌了用 remove_routes；玩家走进刚登记的地点时同时写 move_to。
- 玩家：玩家角色的身份、描述发生变化时，写 player.card。
- 物品：每件物品只有「名称」和「描述」，效果由你根据描述判断。标【装备中】的物品是角色正穿戴、手持、佩带着的，裁定时要考虑它的作用（武器、护具、饰物、法器）；穿上或卸下用 update_items 的 equipped: true/false。玩家从背包【使用】物品时，按描述裁定效果，消耗品用掉就 remove_items。物品状态改变用 update_items；用完、丢失用 remove_items；在角色之间转手用 transfer。玩家的物品写在 player 里，NPC 的写在 npcs.<id> 里。
- 场景状态：本场景里需要持续追踪的临时量（紧张程度、某人的耐心、一场赌局的筹码），写进 scene_state，离开场景后可以清空。
- 剧情标记：【剧情标记说明】中的情况发生时，把对应标记设为 true。

【输出格式】只输出 JSON，按下面的顺序写，不需要的字段省略。数值一律写变化量（如 -5、3）：

narrator:`你是文字角色扮演游戏的「叙事者」。把裁定者这一回合的结果写成玩家看到的正文。这是互动小说，不是小说连载：写到裁定者给定的停点就停。

【铁律】
- 裁定结果是既成事实，不可更改，也不可擅自追加重大事件、物品、线索或有名字的新人物与地点。
- 只描写玩家角色已经做了的事。绝不替玩家做决定、描写其内心想法，也不给玩家编新台词。玩家输入里的台词可以原样引用（不改写、不扩写）；玩家只描述了意图时，用一句概括带过玩家的话。
- NPC 的言行由角色卡决定：性格决定思考和说话方式，当前目标与计划决定他在场景中想要什么，关系阶段决定他对玩家和他人的态度。关系冷淡就不要热情，信任低就不要掏心窝。在场的NPC之间也有各自的关系，可以有互动。
- 标为「尚未透露」的秘密不要说出或明示，只能通过回避、神态、动作等细节暗示。
- 裁定为失败时，要写出失败的样子和它带来的新局面。

【篇幅——最高优先级】
- 默认一屏以内（约 200~450 字）；玩家明确要长篇时放宽。
- 一段只讲一件事，3~7 句，讲完就换段或停。
- 删掉信息量低的句子：空过渡、华丽收尾、重复渲染情绪。不复述写过的信息。不主动写结尾段，不总结。

【视角】
- 玩家是“你”，NPC 用姓名第三人称；新段落开头或换人时重申姓名，之后少用代词。
- 只写“你”能感知到的东西：看到、听到、闻到、身体感觉到的。
- NPC 心理按【心理描写】开关处理：关闭时不写；开启时用全角括号、第一人称，只写此刻的情绪和感受，不得泄露秘密、底色、真实动机。

【格式】心理用（），对话用“”，其余为叙述。不输出颜色标签、时间标题、小标题，这些由前端负责。

【元叙述禁令】
- 正文不出现“钩子 / 伏笔 / 线索 / 铺垫”等写作术语。
- 不写导演批注，比如“她在等你回答”“他在重新估算你”。要传达的信息，写进环境、动作、表情、语气。
- 不列选项（玩家要时才给，一行一个，不解释后果）。正文里不出现标签框、属性卡、设定语。

【人物登场】
- 初次登场用一句话交代背景，加三五个词的特点，融进叙述里。
- 表里不一的人只写“表”，不下“表里如一”之类的判语，让玩家从行为自己判断。
- 一个场景最多新引入一到两个有名字的人，其余只作背景。
- 每个出场的人都要有看得见的细节：手在做什么、眼神、衣着状态、身体姿态，以及角色卡里的习惯动作。不靠堆形容词。

【描写技法】
- 动作按电影镜头写：近身拍摄，特写和远景切换；镜头之间用“然后 / 接着 / 渐渐地”衔接，不写镜头术语。
- 0.5 秒级的微观细节：睫毛颤动、耳根发红、喉结滚动、指尖停顿、呼吸一滞。用下意识的身体动作暴露心思。
- 空间写出距离感，数量模糊化（“几步之遥”而不是“五米”），除非有人明确问。
- 有 NPC 在场时，至少写一句台词（内心独白不算）。对话场景以对白为主，有来有往，不写长篇独白。台词口语化，按性格使用语气词，保留口癖。

【多样性】
- 陈述、疑问、感叹、祈使轮换使用，适当用比喻。
- 上一回合用过的意象、比喻、身体细节，这一回合不再用；同一类内容换不同的词。
- 语气随情境切换，但始终服从世界的文风设定，不擅自加入与之相悖的温情或玩笑。

【文风】以世界的文风设定为准，它的优先级高于这里的一切技法建议；没有指定时，写得简洁、具体、克制。`,

summarizer:`你是游戏的「记录员」。你的产出就是这个世界的长期记忆：之后所有模型只能通过你写下的东西知道早先发生过什么。

【记录原则】
- 只记发生过的事实。推测、可能、意图写进“悬而未决”，并标明是推测。
- 区分玩家知道的和后台的：玩家没有看到的事（NPC 背后的行动、秘密）在该行开头标【隐】。
- 写成可以检索的短句：谁、对谁、做了什么、结果如何。不写修辞。
- 近期的事详细，远期的事合并；同一条线的多个事件合并为一条进展；已解决的待办与悬念删除或并入事件线。

【输出】合并已有摘要与新经过，输出完整的新摘要，按下面五栏，每栏用「## 栏名」开头，总长不超过900字：
## 事件线
## 人物状态（位置、情绪、关系阶段变化、物品得失、受伤、修为变化）
## 新增人物（姓名、一句话身份、和玩家的关系）
## 待办与时钟（答应过的事、约定的时间地点、倒计时：某日某时前要做什么，否则会怎样）
## 悬而未决（未解的疑问、未回应的邀约、暗中进行的事）
压缩NPC记忆时，按要求输出该NPC视角的长期印象正文即可。只输出正文，不要解释。`,

keeper:`你是游戏的「人物档案维护员」。某个NPC经历了一段剧情后，你根据他最近的经历更新他的档案，保证人物前后一致、会主动行动、不脸谱化。你对档案拥有完整的修改权限。档案全部是后台专用，任何字段都不会原样出现在正文里。

【档案要点】
- 性格（personality）：type 沿用世界的性格体系；traits 写清内在本性与外在表现（例如“内里利己，外在讲义气、护短”）。
- 驱动（drives）与目标（goals）：当前动机、短期目标。
- 计划（plan）：他接下来具体打算做什么（谁、何时、何地、怎么做）。主动性高的人必须有下一步打算。
- 主动性（initiative）：高 / 中 / 低，决定他会不会主动找上玩家或别人。
- 习惯动作（habits）：一到两个具体的下意识动作（“说谎时摸耳垂”“怕烫吹热饮”），供叙事者使用。
- 关系：与玩家、与其他NPC的关系类型与看法随经历更新；数值只在经历足以改变态度时调整（写变化量）。
- 背景（background）可以重写以纳入游戏中的重要经历，保留仍然成立的内容。
- 长期印象（longterm）：整合最近的记忆，以该NPC第三人称视角写，150字以内，重点是对玩家的看法和关键事件。

【维护规则】
- 改动要有经历支撑；没有变化的字段不要写。
- 坏人有自己的道理，好人有自己的私心。
- 态度若因对象而异，写成条件化描述。
- 底色与秘密只在后台字段里，任何对外文字都不得流露。

【输出格式】只输出 JSON，不需要的字段省略：
{
  "longterm": "新的长期印象",
  "card": {"字段名": "完整新值"},
  "relations": {"对象id或player": {"type": "关系类型", "note": "看法", "dims": {"关系维度id": 变化值}}},
  "goals": {"目标id": {"status": "done|failed|abandoned|active", "note": "原因"}},
  "new_goal": "新目标",
  "add_secret": {"text": "", "hint": "", "reveal_at": 50},
  "reason": "一句话说明本次更新的依据"
}
card 可写的字段：name brief identity appearance speech background drives boundaries likes dislikes personality（{type, traits}）habits plan initiative fields（{字段id: 值}）schedule（[{from,to,at}]）。`,

admin:`你是这个游戏的「后台管理员通道」。玩家以 OOC 身份、用最高权限直接和底层对话：这不是游戏内的行动，没有任何游戏内限制，也不消耗游戏时间。你不扮演角色，不写正文。

【你能做的事】
1. 回答玩家关于存档、设定、规则、人物、模型行为的问题（包括隐藏信息——管理员有权查看一切）。

3. 创建临时设定：new_lore 登记本局的新设定。
4. 修改本局的世界设定：world_override.style（整段替换文风）、world_override.setting（整段替换世界设定，慎用）、world_override.rules_append（追加规则，一条一行）、world_override.notes_append（追加给裁定者和叙事者的补充说明）。

- notes 每条一个要点：category 从「文风 / 人物 / 裁定 / 节奏 / 剧情 / 地图 / 界面 / 提示词 / 其他」中选，text 写成作者日后能直接照着改的描述（问题 + 期望）。

  setting:`修真界东洲北疆，云州一带。

  lore:[
    {title:'测灵大会', keys:['测灵','灵根','测灵石','测灵台','招收','名额'], always:false, content:'霄剑宗每三年在云州城朱雀广场设测灵台三日，招收年满十二、未满十九的凡人子弟，明面上分文不取。手按测灵石，石中亮起光芒：金白、青绿、湛蓝、赤红、土黄分别对应金木水火土，光色越多灵根越杂，越亮资质越好；不亮即无灵根。测出灵根者由外务堂执事登记，三日后随宗门车队上山。私下传闻：名额能买，结果能“调”；世家会派人在台下截胡寒门里的好苗子；人牙子在台下物色测不出灵根的孩子。'},
    {title:'修真界的世道', keys:['宗门','同门','门规','靠山','欺压','孝敬','夺宝','构陷'], always:false, content:'修真界实力为尊，门规只罚没有靠山的人。外门新人要给老弟子交“孝敬”；宗门任务里死个把人，报一句“遭遇妖兽”即可；争资源时下毒、构陷、借刀杀人并不稀奇。女弟子没有靠山，常被有权势的师兄、执事、长老以资源为饵、以权势相逼。'},
    {title:'挖灵根', keys:['挖灵根','夺灵根','移植灵根','灵根被挖'], always:false, content:'一种禁术：把活人的灵根剖出，移植给另一个人。被挖者九死一生，侥幸活下来也成了废人。世家与宗门明面上都说早已失传，私下却总有寒门好苗子“意外暴毙”，尸体胸腹有缝合的痕迹。'},
    {title:'血丹与魔修', keys:['魔修','血丹','干尸','血祭','吸干'], always:false, content:'魔修以活人精血炼“血丹”，一颗血丹要几十条人命。近年云州城外有村子一夜之间人畜尽成干尸，镇妖司对外说是妖物作祟。'},
    {title:'外门的规矩', keys:['外门','孝敬','月例','比斗','炮灰'], always:false, content:'新弟子上山第一个月要给老弟子交“孝敬”；外门比斗生死不论，失手打死人只罚月例；宗门任务里新人常被派去探路，死伤报“遭遇妖兽”。月例丹药从执事到师兄层层克扣，到新人手里只剩三成。'},
    {title:'境界与寿元', keys:['境界','练气','筑基','金丹','元婴','化神','大乘','突破','寿元','夺舍'], always:false, content:'练气一至九层与圆满，之后筑基、金丹、元婴、化神、大乘，各分初期、中期、后期、圆满。寿元：凡人六七十，练气约一百二十，筑基二百，金丹五百，元婴一千，化神三千。寿元将尽的高阶修士，有的会冒天下之大不韪，寻找资质极佳的年轻肉身夺舍。'},
    {title:'霄剑宗', keys:['霄剑宗','宗主','长老','老祖','外门','内门','苍霄山','执法堂','杂役'], always:false, content:'苍霄山剑修宗门，北疆唯一的大宗门。太上长老剑尘子为元婴老祖，宗主秦啸川金丹中期，执法长老铁无涯、传功长老余长老、炼器长老欧冶。宗主一系与执法一系明争暗斗。外门弟子三百余人，内门百余人，杂役数百。门规严：禁私斗、禁入剑冢与老祖洞府——但门规怎么执行，看你是谁的人。'},
    {title:'云州城', keys:['云州','城主','林家','苏家','万宝楼','散修公会','镇妖司','千金坊','漕帮','人牙子'], always:false, content:'北疆第一大城。城主慕容烈，金丹初期，每年从千金坊和漕帮抽成。林家以丹道立足，苏家以剑道闻名，苏家先祖当年被霄剑宗逐出师门，两家素有嫌隙。万宝楼是东洲连锁商会分号。镇妖司缉捕妖物魔修，也替权贵办些脏事。千金坊放印子钱、设局逼人卖身；城西的人牙子刘婆专收穷人家的孩子。'},
    {title:'三座卫星村', keys:['石桥村','杏花村','柳溪村','村子'], always:false, content:'云州城外三座村子：南郊石桥村种稻养鸭，东郊杏花村以杏花酒闻名，西郊柳溪村打渔采药。村子之间有田间小路相连，各走约一个时辰。'},
    {title:'青石镇', keys:['青石镇','里正','供奉'], always:false, content:'苍霄山脚的小镇，三百户人家，世代为霄剑宗种粮、打铁、供应杂物，每年由赵里正收缴供奉送上山；下山的弟子在镇上白吃白拿是常事。'},
    {title:'灵石与银钱', keys:['灵石','银两','铜钱','文','物价'], always:false, content:'凡人用银两铜钱，1两=1000文；修士用灵石，1灵石约值100两。宗门内部用贡献点兑换资源。'}
  ],
  story:{
    premise:'无主线，世界随玩家的选择展开。开局目标：去云州城朱雀广场参加霄剑宗三年一度的测灵（第1~3天，每日辰时到申时，8:00~17:00）。测灵结果见【给裁定者的补充说明】中关于 true_root 的规定。',
    mainline:'【主线】霄剑宗的测灵台设在云州城朱雀广场，只开三天——第1~3天，每天辰时到申时（8:00~17:00）。测出灵根，就能离开眼下的日子，踏上仙路；测不出，这辈子就只能是个凡人。\n可你也听说过：测灵台下不只有机会。',
    flags:{

      {id:'act2', title:'新的开始', goal:'测灵之后的人生：入宗修炼，或另寻出路。完全由玩家决定。', done_when:null}

  events:[
    {id:'test_open', title:'测灵台前', when:{location:'test_square', day_max:3, time:{from:'08:00', to:'17:00'}}, once:true, text:'测灵台前人山人海。台上，霄剑宗的严执事面无表情地念着名字，测灵石时而亮起微光，时而毫无动静；亮了的孩子被家人抱着哭，不亮的低着头被人群挤下台。台下人群边缘，几个穿着体面的家仆和一个慈眉善目的老婆子，都在盯着下台的孩子看。', effects:{}},
    {id:'arrive_city', title:'进城', when:{map:'city', region:['c_south','c_north','c_east','c_west','c_main']}, once:true, text:'城门口的守卫打着哈欠查验路引，顺手从卖菜老汉的担子里拿走两根萝卜。城里到处都在议论霄剑宗的测灵大会。', effects:{flags:{arrived_city:true}}},
    {id:'test_over', title:'测灵结束', when:{day_min:4, not_flags:['tested']}, once:true, text:'路人议论纷纷：霄剑宗的测灵台昨天已经撤了，下一次要等三年。', effects:{flags:{missed_test:true}}},
    {id:'curfew', title:'宵禁', when:{map:'city', time:{from:'21:00', to:'23:00'}}, once:true, text:'更夫敲着梆子走过：“亥时已到——宵禁——”镇妖司的巡夜队提着灯笼从街口经过，冷冷打量着还在外面晃荡的人。', effects:{}}
  ],

        intro:'鸡叫第二遍的时候，你就醒了。\n灶房里亮着油灯，母亲正弯着腰在锅里烙饼，葱油的香味飘满了整个小院。“今儿进城，路上吃。”她头也没抬，“测不测得出，都早点回来。”\n八年前，父亲就是被一个路过的仙长拎走的，再没回来。母亲从不提那件事，可每回有修士骑着灵马从村口过，她都会把院门关上。\n院门外传来石小虎的大嗓门：“{name}！走啦！去晚了排到天黑都轮不上！”'},

  const ns = S.npcs[id], c = ns?.card; if (!c) return null;
  if (ns.status === 'dead' || ns.status === 'missing') return null;
  if (ns.follow) return S.location;
  if (ns.override && S.t < ns.override.until) return ns.override.loc;
  const m = mod(S.t);
  for (const e of c.schedule || []) if (inRange(m, hm(e.from), hm(e.to))) return e.at;
  return null;
}
const presentNPCs = () => npcIds().filter(id => npcLocation(id) === S.location);
function pushUndo(){ undoStack.push(JSON.stringify(S)); if (undoStack.length > 10) undoStack.shift(); }
function undo(){ if (busy || !undoStack.length) return toast('没有可撤销的回合'); S = JSON.parse(undoStack.pop()); lastNarr = null; autosave(); render(); toast('已撤销'); }

/* ---------------- 条件（事件与剧情阶段共用，全部由代码判定） ---------------- */
function evalCond(c){
  if (!isObj(c) || !Object.keys(c).length) return true;
  const m = mod(S.t);
  if (c.time && !inRange(m, hm(c.time.from), hm(c.time.to))) return false;
  if (c.day_min != null && dayOf(S.t) < c.day_min) return false;
  if (c.day_max != null && dayOf(S.t) > c.day_max) return false;
  if (c.location && !arr(c.location).includes(S.location)) return false;
  if (c.region && !arr(c.region).includes(regionOf(S.location))) return false;
  if (c.map && S.geo.regions[regionOf(S.location)]?.map !== c.map) return false;
  for (const k of arr(c.visited)) if (!S.geo.regions[k]?.visited) return false;
  for (const [k, v] of Object.entries(c.flags || {})) if (v === true ? !S.flags[k] : v === false ? !!S.flags[k] : S.flags[k] != v) return false;
  for (const k of arr(c.not_flags)) if (S.flags[k]) return false;
  if (c.any_flags && !arr(c.any_flags).some(k => S.flags[k])) return false;
  if (c.npc_present){ const p = presentNPCs(); if (!arr(c.npc_present).every(id => p.includes(id))) return false; }
  if (c.act && S.act !== c.act) return false;
  for (const r of arr(c.rel)){ const v = relGet(r.from || r.npc, r.to || 'player')?.dims?.[r.dim] ?? 0; if (r.gte != null && v < r.gte) return false; if (r.lte != null && v > r.lte) return false; }
  for (const s of arr(c.stat)){ const v = S.player.stats[s.key]; if (s.gte != null && !(v >= s.gte)) return false; if (s.lte != null && !(v <= s.lte)) return false; }
  for (const k of arr(c.has_item)) if (!S.player.inventory.some(it => it.name === k)) return false;
  if (c.chance != null && Math.random() >= c.chance) return false;
  return true;
}
/* 检查事件，触发的返回其文本并应用效果 */
function checkEvents(){
  const fired = [];
  for (const ev of W.events || []){
    const last = S.fired[ev.id];
    if (last != null && (ev.once !== false || S.t - last < (+ev.cooldown || 1440))) continue;
    if (!evalCond(ev.when)) continue;
    S.fired[ev.id] = S.t;
    const ef = ev.effects || {};
    if (isObj(ef.flags)) Object.assign(S.flags, ef.flags);
    for (const [k, d] of Object.entries(ef.player_stats || {})){ const def = W.template.stats[k]; if (def && S.player.stats[k] != null) S.player.stats[k] = statApply({...def, max_delta:0}, S.player.stats[k], d); }
    for (const [id, loc] of Object.entries(ef.npc_moves || {})) if (S.npcs[id] && S.geo.locations[loc]) S.npcs[id].override = {loc, until:S.t + 120};
    for (const it of normItems(ef.add_items)) S.player.inventory.push(it);
    fired.push(ev);
  }
  return fired;
}
function checkActs(){
  const acts = W.story.acts || []; let moved = false;
  for (let guard = 0; guard < acts.length; guard++){
    const i = acts.findIndex(a => a.id === S.act); if (i < 0) break;
    const a = acts[i]; if (!a.done_when || !Object.keys(a.done_when).length || i === acts.length - 1 || !evalCond(a.done_when)) break;
    S.act = acts[i + 1].id; moved = true;
    addLog('sys', `📖 剧情进入新阶段：${acts[i + 1].title}`);
  }
  return moved;
}

/* ---------------- 应用修改：AI 拥有完整写权限；代码只负责数据合法性、可选硬规则与留痕 ---------------- */
/* 物品栏：玩家和每个NPC都有，物品 = {name, desc}。增删改与转手都整张记入变更日志 */
const invPath = o => o === 'player' ? 'player.inventory' : `npcs.${o}.card.inventory`;
const invGet = o => o === 'player' ? S.player.inventory : S.npcs[o]?.card?.inventory;
const ownerName = o => o === 'player' ? '你' : npcName(o);
function applyItemOps(owner, ops, by, why, pub, hid, notes){
  if (!isObj(ops) || !invGet(owner) || !(ops.add_items || ops.remove_items || ops.update_items)) return;
  const inv = clone(normItems(invGet(owner))), isP = owner === 'player', who = isP ? '' : npcName(owner);
  for (const x of arr(ops.remove_items)){
    const name = isObj(x) ? x.name : String(x), i = inv.findIndex(it => it.name === name);
    if (i >= 0){ inv.splice(i, 1); (isP ? pub : hid).push(`${who}失去「${name}」`); }
    else notes.push(`${isP ? '玩家' : who}并没有「${name}」，不能使用或交出它。`);
  }
  for (const x of arr(ops.update_items)){
    if (!isObj(x)) continue; const it = inv.find(i => i.name === x.name); if (!it) continue;
    if (x.new_name){ it.name = String(x.new_name).slice(0, 40); (isP ? pub : hid).push(`${who}「${x.name}」→「${it.name}」`); }
    if (x.desc != null){ it.desc = String(x.desc).slice(0, 400); hid.push(`${who}「${it.name}」的描述已更新`); }
    if (x.equipped === true && !it.eq){ it.eq = true; (isP ? pub : hid).push(`${who}装备「${it.name}」`); }
    if (x.equipped === false && it.eq){ delete it.eq; (isP ? pub : hid).push(`${who}卸下「${it.name}」`); }
  }
  for (const it of normItems(ops.add_items)){ inv.push(it); (isP ? pub : hid).push(`${who}获得「${it.name}」`); }
  setL(invPath(owner), inv, by, why);
}
function transferItem(from, to, name, by, why, pub, notes){
  if (!name || from === to || !invGet(from) || !invGet(to)) return;
  const a = clone(normItems(invGet(from))), b = clone(normItems(invGet(to))), i = a.findIndex(it => it.name === name);
  if (i < 0){ notes.push(`${from === 'player' ? '玩家' : npcName(from)}并没有「${name}」，无法交给对方。`); return; }
  const [it] = a.splice(i, 1); delete it.eq; b.push(it);
  setL(invPath(from), a, by, why); setL(invPath(to), b, by, why);
  pub.push(`「${name}」：${ownerName(from)} → ${ownerName(to)}`);
}
function applyRelDelta(a, b, delta, type, note, by = 'GM', reason = ''){
  const r = relEnsure(a, b), parts = [], base = `rels.${relKey(a, b)}`;
  for (const [k, d] of Object.entries(isObj(delta) ? delta : {})){
    const def = W.template.relation_dims[k]; if (!def) continue;
    let dv = Math.round(+d) || 0; if (enf('delta_caps') && +def.delta) dv = clamp(dv, -def.delta, +def.delta); if (!dv) continue;
    const bv = r.dims[k] ?? dimDefault(def), nv = clamp(bv + dv, def.min ?? 0, def.max ?? 100);
    if (setL(`${base}.dims.${k}`, nv, by, reason)) parts.push(def.label + fmtD(nv - bv));
  }
  if (type && setL(base + '.type', String(type).slice(0, 20), by, reason)) parts.push('关系→' + r.type);
  if (note) setL(base + '.note', String(note).slice(0, 300), by, reason);
  return parts;
}
function applyCardPatch(id, patch, by, reason){
  const base = `npcs.${id}.card`, out = [];
  if (!isObj(patch)) return out;
  for (const [k, v] of Object.entries(patch)){
    if (!CARD_KEYS.includes(k) || k === 'secrets') continue;
    if (k === 'personality' || k === 'fields'){
      if (!isObj(v)) continue;
      for (const [sk, sv] of Object.entries(v)){
        const val = (k === 'personality' && sk === 'type') ? String(sv || '').toUpperCase().trim() : sv;
        if (setL(`${base}.${k}.${sk}`, val, by, reason)) out.push(k === 'fields' ? (W.template.npc_fields.find(f => f.key === sk)?.label || sk) : ({type:'人格类型', traits:'个人特质', dims:'性格维度'}[sk] || sk));
      }
      continue;
    }
    let val;
    if (k === 'likes' || k === 'dislikes') val = arr(v).map(String);
    else if (k === 'inventory') val = normItems(v);
    else if (k === 'schedule') val = arr(v).filter(e => isObj(e) && S.geo.locations[e.at]).map(e => ({from:String(e.from || '00:00'), to:String(e.to || '00:00'), at:e.at}));
    else val = String(v ?? '');
    if (setL(`${base}.${k}`, val, by, reason)) out.push(CARD_LABELS[k]);
  }
  return out;
}
function addSecret(id, x, by, reason){
  if (!isObj(x) || !x.text) return false;
  const list = clone(S.npcs[id].card.secrets || []);
  list.push({text:String(x.text), hint:String(x.hint || ''), reveal_at:+x.reveal_at || 0, reveal_dim:x.reveal_dim || '', where:S.geo.locations[x.where] ? x.where : '', revealed:false});
  return setL(`npcs.${id}.card.secrets`, list, by, reason);
}
/* 对单个NPC的一组修改（裁定者和人物维护共用） */
function applyNpcPatch(id, c, by, reason){
  const pub = [], hid = [], ns = S.npcs[id], T = W.template; if (!ns || !isObj(c)) return {pub, hid};
  const nm = () => ns.card.name;
  const delta = Object.assign({}, isObj(c.rel) ? c.rel : {});
  for (const k of Object.keys(T.relation_dims)) if (c[k] != null && delta[k] == null) delta[k] = c[k];
  const parts = applyRelDelta(id, 'player', delta, c.rel_type, c.rel_note, by, reason);
  if (parts.length) pub.push(nm() + ' ' + parts.join(' '));
  for (const [k, d] of Object.entries(isObj(c.stats) ? c.stats : {})){
    const def = T.stats[k]; if (!def || !(def.scope === 'npc' || def.scope === 'both')) continue;
    if (ns.stats[k] == null) ns.stats[k] = statInit(def);
    const b = ns.stats[k], v = statApply(def, b, d);
    if (setL(`npcs.${id}.stats.${k}`, v, by, reason)) pub.push(`${nm()}${def.label} ${statShow(def, b)}→${statShow(def, v)}`);
  }
  if (c.mood) ns.mood = String(c.mood).slice(0, 30);
  if (c.memory){ ns.memories.push({t:S.t, text:String(c.memory).slice(0, 300)}); ns.memSinceKeep = (ns.memSinceKeep || 0) + 1; }
  if (c.longterm && setL(`npcs.${id}.longterm`, String(c.longterm), by, reason)) hid.push(`${nm()}的长期印象已更新`);
  if (c.status && ['dead', 'missing', 'active'].includes(c.status) && (ns.status || 'active') !== c.status){
    ns.status = c.status; if (c.status !== 'active'){ ns.follow = false; ns.override = null; }
    S.changelog.push({turn:S.turn, t:S.t, by, path:`npcs.${id}.status`, from:undefined, to:c.status, reason});
    pub.push(`${nm()}${{dead:'死了', missing:'下落不明', active:'重新出现了'}[c.status]}`);
  }
  if (c.follow === true && !ns.follow){ ns.follow = true; ns.override = null; pub.push(`${nm()}与你同行`); }
  else if (c.follow === false && ns.follow){ ns.follow = false; ns.override = {loc:S.location, until:S.t + (+c.stay || 120)}; pub.push(`${nm()}不再同行`); }
  if (c.move_to){ const d = resolveDest(c.move_to); if (d){ ns.follow = false; ns.override = {loc:d, until:S.t + (+c.stay || 240)}; if (d !== S.location) hid.push(`${nm()}去了${pathText(d)}`); } }
  for (const [gid, g] of Object.entries(isObj(c.goals) ? c.goals : {})){
    const i = ns.goals.findIndex(x => x.id === gid);
    if (i >= 0 && isObj(g) && ['done','failed','abandoned','active'].includes(g.status)){
      if (setL(`npcs.${id}.goals.${i}.status`, g.status, by, g.note || reason)){ ns.goals[i].note = String(g.note || '').slice(0, 100); hid.push(`${nm()}的目标「${ns.goals[i].text}」→${{done:'达成', failed:'失败', abandoned:'放弃', active:'重启'}[g.status]}`); }
    }
  }
  for (const ng of arr(c.new_goal)) if (ng){ const list = clone(ns.goals); list.push({id:rid('g'), text:String(ng).slice(0, 100), priority:2, status:'active', note:''}); setL(`npcs.${id}.goals`, list, by, reason); hid.push(`${nm()}有了新目标：${ng}`); }
  const ch = applyCardPatch(id, c.card, by, reason); if (ch.length) hid.push(`${nm()}的${ch.join('、')}已更新`);
  for (const x of arr(c.add_secret)) if (addSecret(id, x, by, reason)) hid.push(`${nm()}有了新秘密`);
  const notes = []; applyItemOps(id, c, by, reason, pub, hid, notes);
  return {pub, hid, notes};
}
/* 剧情中新出现的人物：登记进存档，之后被持续扮演 */
function createNpc(x, by){
  if (!isObj(x) || !x.name) return null;
  let id = String(x.id || '').trim(); if (!/^[A-Za-z0-9_]+$/.test(id) || S.npcs[id]) id = 'n_' + Math.random().toString(36).slice(2, 7);
  const n = normalizeNpc(x, {npcs:S.npcs});
  if (isObj(x.rel_to_player)) n.relations.player = {type:x.rel_to_player.type || '', note:x.rel_to_player.note || '', dims:isObj(x.rel_to_player.dims) ? x.rel_to_player.dims : {}};
  n.schedule = n.schedule.filter(e => S.geo.locations[e.at]);
  const ns = initNpcState(n); ns.custom = true;
  if (!n.schedule.length) ns.override = {loc:S.geo.locations[x.location] ? x.location : S.location, until:S.t + (+x.stay || 240)};
  S.npcs[id] = ns;
  initRelsFor(id, n);
  S.changelog.push({turn:S.turn, t:S.t, by, path:`npcs.${id}`, from:undefined, to:'（新建人物）', reason:x.brief || ''});
  return id;
}
function applyRuling(r, present, locBefore){
  const T = W.template, pub = [], hid = [], notes = [], by = 'GM', why = String(r.ruling || '').slice(0, 60);
  if (!r._noTime){ r._time = clamp(Math.round(+r.time_cost || 0) || 3, 1, W.limits.max_time_cost ?? 720); S.t += r._time; }   // 时间每回合都要流动：缺省3分钟，至少1分钟
  for (const x of arr(r.new_lore)) if (isObj(x) && x.title && x.content){
    S.lore = S.lore || []; const old = S.lore.findIndex(e => e.title === x.title);
    const e = {title:String(x.title), keys:arr(x.keys).map(String).filter(Boolean), content:String(x.content), turn:S.turn};
    if (!e.keys.length) e.keys = [e.title];
    if (old >= 0) S.lore[old] = e; else S.lore.push(e);
    S.changelog.push({turn:S.turn, t:S.t, by, path:'lore', from:undefined, to:e.title, reason:e.content.slice(0, 60)}); hid.push(`新设定：${e.title}`);
  }
  if (isObj(r.scene_state)){ S.scene = S.scene || {}; for (const [k, v] of Object.entries(r.scene_state)){ if (v === null || v === '') delete S.scene[k]; else S.scene[k] = v; } }
  const p = isObj(r.player) ? r.player : {};
  for (const [k, d] of Object.entries(isObj(p.stats) ? p.stats : {})){
    const def = T.stats[k]; if (!def || !(def.scope === 'player' || def.scope === 'both')) continue;
    if (S.player.stats[k] == null) S.player.stats[k] = statInit(def);
    const b = S.player.stats[k], v = statApply(def, b, d);
    if (setL(`player.stats.${k}`, v, by, why)) pub.push(def.type === 'level' ? `${def.label} ${statShow(def, b)}→${statShow(def, v)}` : `${def.label}${fmtD(v - b)}`);
  }
  for (const x of arr(r.transfer)) if (isObj(x)) transferItem(x.from, x.to, isObj(x.item) ? x.item.name : x.item, by, why, pub, notes);
  applyItemOps('player', p, by, why, pub, hid, notes);
  if (isObj(p.card)){
    for (const k of ['name', 'desc']) if (p.card[k] && setL(`player.${k}`, String(p.card[k]), by, why)) hid.push('玩家' + (k === 'name' ? '名字' : '描述') + '已更新');
    for (const [k, v] of Object.entries(isObj(p.card.fields) ? p.card.fields : {})) if (setL(`player.fields.${k}`, v, by, why)) hid.push(`玩家的${T.player_fields.find(f => f.key === k)?.label || k}已更新`);
  }
  for (const x of arr(r.new_npcs)){ const id = createNpc(x, by); if (id){ hid.push(`新人物登记：${S.npcs[id].card.name}`); if (npcLocation(id) === S.location) present.push(id); } }
  for (const [id, c] of Object.entries(isObj(r.npcs) ? r.npcs : {})){
    if (!S.npcs[id]?.card || (enf('present_only') && !present.includes(id))) continue;
    const o = applyNpcPatch(id, c, by, why); pub.push(...o.pub); hid.push(...o.hid); notes.push(...(o.notes || []));
  }
  for (const x of arr(r.relations)){
    if (!isObj(x) || x.from === x.to || !S.npcs[x.from]?.card || !(x.to === 'player' || S.npcs[x.to]?.card)) continue;
    if (enf('present_only') && !(present.includes(x.from) && (x.to === 'player' || present.includes(x.to)))) continue;
    const parts = applyRelDelta(x.from, x.to, x.rel || x.dims, x.type, x.note, by, why);
    if (parts.length) hid.push(`${npcName(x.from)}→${npcName(x.to)} ${parts.join(' ')}`);
  }
  const reveal = (id, i, how) => {
    const sec = S.npcs[id]?.card?.secrets?.[i]; if (!sec || sec.revealed) return;
    const ok = how === 'discover' ? (!enf('secret_gate') || (sec.where && sec.where === locBefore)) : (!enf('secret_gate') || secretOpen(id, sec));
    if (ok){ setL(`npcs.${id}.card.secrets.${i}.revealed`, true, by, why); pub.push(how === 'discover' ? `🔍 发现了与${npcName(id)}有关的秘密` : `🔓 ${npcName(id)}说出了秘密`); }
    else notes.push(how === 'discover' ? `玩家在这里没有发现关于${npcName(id)}的秘密，不得写出秘密内容。` : `${npcName(id)}此刻还不够信任玩家，不会说出秘密：让其回避或搪塞，不得透露任何具体内容。`);
  };
  for (const [id, idxs] of Object.entries(isObj(r.reveal) ? r.reveal : {})) if (!enf('present_only') || present.includes(id)) arr(idxs).forEach(i => reveal(id, +i, 'reveal'));
  for (const [id, idxs] of Object.entries(isObj(r.discover) ? r.discover : {})) arr(idxs).forEach(i => reveal(id, +i, 'discover'));
  if (isObj(r.flags)) Object.assign(S.flags, r.flags);
  if (r.act && W.story.acts.some(a => a.id === r.act) && r.act !== S.act){ S.act = r.act; hid.push(`剧情阶段 → ${W.story.acts.find(a => a.id === r.act).title}`); }
  applyGeoOps(r, by, why, pub, hid, notes);
  const dest = resolveDest(r.move_to);
  if (r.move_to && !dest) notes.push(`玩家想去的「${r.move_to}」在地图上找不到，本回合没有移动；若确是新地方，下回合需先登记（new_locations / new_regions）。`);
  if (dest && dest !== S.location){
    const rf = regionOf(S.location), rt = regionOf(dest);
    if (!enf('adjacent_only') || rf === rt || regionsAdj(rf).some(x => x.id === rt)){
      const route = rf === rt ? {time:S.geo.regions[rf]?.inner_time || 5, path:[rf]} : routeTo(rt);
      const travel = route?.time || 0, via = (route?.path || []).slice(1, -1);
      if (!r._noTime && travel > (r._time || 0)){ S.t += travel - (r._time || 0); r._time = travel; }   // 路上的时间按地图路程补足
      via.forEach(k => { if (S.geo.regions[k]) S.geo.regions[k].visited = true; });
      const from = S.location; S.location = dest; arrive(dest); S.scene = {};
      const fol = npcIds().filter(id => S.npcs[id].follow).map(id => npcName(id));
      pub.push(`来到${pathText(dest)}${fol.length ? '（与' + fol.join('、') + '同行）' : ''}`);
      r._moved = {from, dest, via, travel};
    }
  }
  return {pub, hid, notes};
}

/* =====================================================================
   上下文构建：每次调用都重新注入角色卡与状态 → 防止人设漂移；静态部分在前 → 提高缓存命中
   ===================================================================== */
function memText(s, k){
  const parts = [];
  if (s.longterm) parts.push('（长期印象）' + s.longterm);
  s.memories.slice(-k).forEach(m => parts.push(`[第${dayOf(m.t)}天 ${fmtHM(m.t)}] ${m.text}`));
  return parts.join('\n    ');
}
/* 最近经过：至少 n 条；并且包含全部尚未并入前情摘要的条目（最多40条），保证没有记忆盲区 */
function recentText(n, upto = S.log.length, withUnsummarized = false){
  const from = withUnsummarized ? Math.max(0, upto - 40, Math.min(S.sumIdx || 0, upto - n)) : Math.max(0, upto - n);
  return S.log.slice(from, upto).filter(e => !['h', 'ooc', 'oocr'].includes(e.kind)).map(e => {
    const tx = e.text.length > 600 ? e.text.slice(0, 600) + '…' : e.text;

function netErr(msg){ const e = new Error(msg); e.net = true; return e; }
const LLM = {
  cfg(role){ const r = settings.roles[role]; return {...r, base:(r.base || settings.base || '').trim().replace(/\/+$/, ''), key:(r.key || settings.key || '').trim()}; },
  async call(role, messages, {onDelta} = {}){
    const c = this.cfg(role);
    if (!c.base || !c.model) throw netErr(`请先在「设置」里填写 API 地址和${ROLE_NAMES[role]}的模型名`);
    let extra = {};
    if (c.extra && c.extra.trim()){ try { extra = JSON.parse(c.extra); } catch(e){ throw netErr(`${ROLE_NAMES[role]}的「额外参数」不是合法 JSON`); } }
    const stream = !!c.stream && !!onDelta;
    const body = {model:c.model, messages, temperature:+c.temperature, stream, ...extra};
    if (+c.max_tokens) body.max_tokens = +c.max_tokens;
    if (c.json) body.response_format = {type:'json_object'};
    if (stream) body.stream_options = {include_usage:true};
    const rec = {role, at:new Date().toLocaleTimeString(), params:{...body, messages:undefined}, messages, response:'', usage:null, ms:0, error:null};
    debugLog.unshift(rec); if (debugLog.length > 16) debugLog.pop();
    const t0 = performance.now();
    const doFetch = async b => {
      try { return await fetch(c.base + '/chat/completions', {method:'POST', headers:{'Content-Type':'application/json', ...(c.key ? {'Authorization':'Bearer ' + c.key} : {})}, body:JSON.stringify(b)}); }
      catch(e){ rec.error = '网络错误：' + e.message; throw netErr('请求没有发出去或被浏览器拦截。可能原因：① 网络不通；② API 地址填错；③ 该服务商不允许网页直接调用（跨域/CORS）。原始信息：' + e.message); }
    };
    try {
      let resp = await doFetch(body), t = '';
      if (!resp.ok){
        try { t = await resp.text(); } catch(e){}
        if (stream && resp.status === 400 && /stream_options/i.test(t)){ delete body.stream_options; resp = await doFetch(body); t = ''; if (!resp.ok){ try { t = await resp.text(); } catch(e){} } }
        if (!resp.ok){
          const hint = {401:'（API Key 无效）', 402:'（余额不足）', 404:'（地址或模型名不对）', 429:'（请求太频繁或额度用尽）'}[resp.status] || '';
          rec.error = `HTTP ${resp.status} ${t.slice(0, 500)}`;
          throw netErr(`API 返回错误 ${resp.status}${hint}：${t.slice(0, 200)}`);
        }
      }
      let text = '', usage = null;
      if (stream && resp.body?.getReader){
        const reader = resp.body.getReader(), dec = new TextDecoder(); let buf = '';
        for (;;){
          const {done, value} = await reader.read(); if (done) break;
          buf += dec.decode(value, {stream:true});
          let i;
          while ((i = buf.indexOf('\n')) >= 0){
            const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
            if (!line.startsWith('data:')) continue;
            const d = line.slice(5).trim(); if (d === '[DONE]') continue;
            try { const j = JSON.parse(d); const dl = j.choices?.[0]?.delta?.content; if (dl){ text += dl; onDelta(text); } if (j.usage) usage = j.usage; } catch(e){}
          }
        }
      } else {
        const j = await resp.json();
        text = j.choices?.[0]?.message?.content || ''; usage = j.usage || null; rec.finish = j.choices?.[0]?.finish_reason || '';
        if (onDelta) onDelta(text);
      }
      rec.response = text; rec.usage = usage; rec.ms = Math.round(performance.now() - t0);
      if (S){
        if (usage){ S.tokens.in += usage.prompt_tokens || 0; S.tokens.out += usage.completion_tokens || 0; S.tokens.cached += usage.prompt_cache_hit_tokens || usage.prompt_tokens_details?.cached_tokens || 0; }
        S.tokens.calls++;
      }
      return {text, usage, finish:rec.finish};
    } catch(e){ rec.ms = Math.round(performance.now() - t0); if (!rec.error) rec.error = e.message; throw e; }
  }
};
function parseJSON(text){
  if (!text) return null;
  const t = String(text).trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
  try { return JSON.parse(t); } catch(e){}
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a){ try { return JSON.parse(t.slice(a, b + 1)); } catch(e){} }
  return null;
}

async function doOOC(text){

    `【全部人物】\n${all}`, `【在场人物详情】\n${present.map(id => npcForGM(id, present)).join('\n') || '（无人）'}`,
    (S.lore || []).length ? `【本局临时设定】\n${S.lore.map(e => `- ${e.title}：${e.content}`).join('\n')}` : '',

    addLog('oocr', '⚠ ' + e.message + '。这条 OOC 已原样记入反馈档案。'); setBusy(false); autosave(); render(); return;
  }

/* 移动：目标可以是任意已知地点或看得见的区域；跨区域自动走最短路线，路上的时间一次算清 */
async function doMove(kind, id){

  if (!g.regions[rTo]) return;
  let dest, travel, via = [];
  if (rTo === rFrom){ if (kind !== 'place' || !g.locations[id] || id === from) return; dest = id; travel = g.regions[rFrom].inner_time || 5; }
  else { const rt = routeTo(rTo); if (!rt) return toast('还不知道怎么去那里'); travel = rt.time; via = rt.path.slice(1, -1); dest = kind === 'place' && g.locations[id] ? id : ensureEntry(rTo); }
  pushUndo(); setBusy(true, '🚶 赶路中…');

  const first = arrive(dest), R = g.regions[rTo], viaTxt = via.length ? `，途经${via.map(regionName).join('、')}` : '';

  const now = presentNPCs(), events = checkEvents(); logEvents(events);
  if (settings.moveNarrate || events.length || first){
    const ruling = `玩家从${locName(from)}来到${rTo !== rFrom ? R.name + '的' : ''}${locName(dest)}${viaTxt}，路上用了${fmtDur(travel)}。` +
      (first ? `这是玩家第一次来到「${R.name}」，先用几句话勾勒这一带的整体样貌，再写眼前的地点。` : '描写抵达时看到的场景。') +
      '注意当前时间对光线与人流的影响。' + (now.length ? '在场者若认识玩家可有一个自然的小反应，但不要展开对话。' : '这里眼下没有认识的人。');
    await narrate({action:'', ruling, focus:[], locBefore:from, notes:[], events, upto:S.log.length - events.length});
  } else addLog('sys', (g.locations[dest].desc || '') + (now.length ? '\n在场：' + now.map(i => S.npcs[i].met ? npcName(i) : '陌生人').join('、') : ''));
  checkActs(); S.turn++; autosave(); render();
  await maintenance(true);
  autosave(); setBusy(false);
}

/* 记忆维护：旧叙事压缩进「前情摘要」，NPC 旧记忆压缩进「长期印象」 → 上下文长度基本恒定 */
async function maintenance(light, force){
  try {
    if (S.log.length - S.sumIdx > (force ? settings.keepRaw : settings.sumThreshold)){
      setBusy(true, '🗂 整理记忆…');
      const end = S.log.length - settings.keepRaw;
      const chunk = S.log.slice(S.sumIdx, end).filter(e => e.kind !== 'event').map(e => (e.kind === 'player' ? '玩家：' : e.kind === 'sys' ? '系统：' : '') + e.text).join('\n');
      const res = await LLM.call('summarizer', [{role:'system', content:sysWith('summarizer', presentNPCs())},
        {role:'user', content:`【已有的前情摘要】\n${S.chronicle || '（无）'}\n\n【需要并入的新经过】\n${chunk}\n\n请按五栏输出合并后的完整前情摘要，不超过900字。玩家没有看到的内容在行首标【隐】。`}]);
      if (res.text.trim()){ S.chronicle = res.text.trim(); S.sumIdx = end; addLog('sys', `📜 前情已归档（${chunk.split('\n').length}条经过并入前情摘要）`); }
    }
    for (const [id, ns] of Object.entries(S.npcs)){
      if (!ns.card || ns.memories.length <= (force ? 8 : settings.memCap)) continue;
      const n = Math.ceil(settings.memCap / 2), old = ns.memories.slice(0, n);
      const res = await LLM.call('summarizer', [{role:'system', content:sysWith('summarizer', presentNPCs())},
        {role:'user', content:`这是NPC「${npcName(id)}」的记忆。\n【已有长期印象】${ns.longterm || '（无）'}\n【较早的记忆】\n${old.map(m => '- ' + m.text).join('\n')}\n\n请以该NPC的视角（第三人称），合并成不超过150字的长期印象，重点是对玩家的看法和关键事件。`}]);
      if (res.text.trim()){ ns.longterm = res.text.trim(); ns.memories = ns.memories.slice(n); if (settings.godMode) addLog('sys', `🧠 ${npcName(id)}的旧记忆已并入长期印象`); }
    }
  } catch(e){ addSysOnce('⚠ 记忆整理失败（不影响游戏）：' + e.message); }
  if (light) return;
  S.keepTick = (S.keepTick || 0) + 1;
  if (force || (settings.keeperEvery > 0 && S.keepTick >= settings.keeperEvery)){
    S.keepTick = 0;
    const ids = npcIds().filter(id => (S.npcs[id].memSinceKeep || 0) > 0).sort((a, b) => S.npcs[b].memSinceKeep - S.npcs[a].memSinceKeep).slice(0, settings.keeperMax || 3);
    for (const id of ids){
      setBusy(true, `🧬 维护人物档案：${npcName(id)}…`);
      try { const o = await keepNpc(id); if (settings.godMode && settings.showChanges && o.hid.length) addLog('sys', '🧬 ' + o.hid.join(' · ')); }
      catch(e){ addSysOnce('⚠ 人物维护失败（不影响游戏）：' + e.message); }
    }
  }
}
/* 人物维护：根据一个NPC最近的经历，由「人物维护」角色更新其档案（背景、性格、关系、目标、长期印象……） */
async function keepNpc(id){
  const ns = S.npcs[id], c = ns.card;
  const rels = Object.keys(S.rels).filter(k => k.startsWith(id + '>')).map(k => { const t = k.split('>')[1]; return `- 对${npcName(t)}(${t})：${relText(id, t)}`; }).join('\n');
  const user = [
    `【世界】${WS('setting')}`, `【数值定义】\n${defsText()}`, `【前情摘要】\n${S.chronicle || '（暂无）'}`, `【当前时间】${timeStr(S.t)}`,
    `【角色档案】id=${id}\n${JSON.stringify(c, null, 1)}`,
    `【属性】${statsLine(ns.stats, 'npc') || '无'}`,
    `【关系】\n${rels || '无'}`,
    `【目标】\n${ns.goals.map(g => `[${g.id}] ${g.text}（${g.status}）`).join('\n') || '无'}`,
    `【长期印象】${ns.longterm || '（无）'}`,
    `【最近的记忆】\n${ns.memories.map(m => `[第${dayOf(m.t)}天 ${fmtHM(m.t)}] ${m.text}`).join('\n') || '（无）'}`,
    '请根据这些经历更新该角色的档案。'
  ].join('\n\n');
  const res = await LLM.call('keeper', [{role:'system', content:sysWith('keeper', [id])}, {role:'user', content:user}]);
  const p = parseJSON(res.text); if (!isObj(p)) throw new Error('人物维护返回的不是有效 JSON');
  const why = p.reason || '人物维护';
  const out = applyNpcPatch(id, {longterm:p.longterm, card:p.card, goals:p.goals, new_goal:p.new_goal, add_secret:p.add_secret}, '维护', why);
  for (const [t, o] of Object.entries(isObj(p.relations) ? p.relations : {})){
    if (!isObj(o) || t === id || !(t === 'player' || S.npcs[t]?.card)) continue;
    const parts = applyRelDelta(id, t, o.dims, o.type, o.note, '维护', why);
    if (parts.length) out.hid.push(`${npcName(id)}→${npcName(t)} ${parts.join(' ')}`);
  }
  ns.memSinceKeep = 0;
  return out;
}

function npcColor(id){ let h = 0; for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) >>> 0; const P = settings.theme === 'paper' ? NPC_COLORS_LIGHT : NPC_COLORS; return P[h % P.length]; }
function fmtText(t){

    const names = npcIds().filter(id => S.npcs[id].met || settings.godMode).map(id => [card(id).name, npcColor(id)]).filter(([n]) => n && n.length >= 2).sort((a, b) => b[0].length - a[0].length);
    for (const [n, c] of names) h = h.split(n).join(`<b class=nm style=color:${c}>${n}</b>`);   // 属性不加引号，避免被下面的引号规则误伤

/* ---------------- 地图（区域图） ---------------- */
const REGION_COLORS = ['#d9a35b','#79a9cc','#7fb27f','#c98bb9','#d46a6a','#b0a58f'];
/* 画一张地图组里的区域图。opt: {cur:当前区域, sel:选中区域, vis:可见判定, dim:暗显判定, labels:{区域:附注}} */
function regionSVG(regions, routes, mapId, opt = {}){
  const ids = Object.keys(regions).filter(k => regions[k].map === mapId && (!opt.vis || opt.vis(k)));
  const n = ids.length || 1, pos = {};
  const hasXY = k => typeof regions[k].x === 'number' && typeof regions[k].y === 'number';
  const placed = ids.filter(hasXY), loose = ids.filter(k => !hasXY(k));
  placed.forEach(k => pos[k] = [regions[k].x, regions[k].y]);
  if (!placed.length) loose.forEach((k, i) => pos[k] = [50 + 38 * Math.cos(2 * Math.PI * i / n - Math.PI / 2), 50 + 38 * Math.sin(2 * Math.PI * i / n - Math.PI / 2)]);
  else loose.forEach((k, i) => pos[k] = [10 + (i % 5) * 20, 104 + Math.floor(i / 5) * 9]);   // 没坐标的放到底部一排
  let lines = '', nodes = '', outs = [];
  for (const r of routes){
    const A = pos[r.a], B = pos[r.b];
    if (A && B){ const dim = opt.dim && (opt.dim(r.a) || opt.dim(r.b));
      lines += `<line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" stroke="#3a404a" stroke-width=".6" ${dim ? 'stroke-dasharray="1.5 1.5"' : ''}/>` +
        `<text x="${(A[0] + B[0]) / 2}" y="${(A[1] + B[1]) / 2 - 1}" font-size="2.3" fill="#6f6b64" text-anchor="middle">${r.time}′</text>`; }
    else if (A || B){ const inside = A ? r.a : r.b, out = A ? r.b : r.a; if (regions[out] && regions[out].map !== mapId) outs.push([inside, out, r.time]); }
  }
  ids.forEach((k, i) => {
    const r = regions[k], [x, y] = pos[k], cur = k === opt.cur, sel = k === opt.sel, dim = opt.dim && opt.dim(k), c = REGION_COLORS[i % REGION_COLORS.length];
    const label = dim ? r.name + '?' : r.name, bw = Math.max(14, label.length * 3.3 + 4);
    nodes += `<g class="mapnode" data-map-region="${k}" opacity="${dim ? .5 : 1}"><rect x="${x - bw / 2}" y="${y - 4}" width="${bw}" height="8" rx="2" fill="${cur ? '#d9a35b' : '#1d2026'}" stroke="${c}" stroke-width="${sel ? 1.2 : .6}" ${dim ? 'stroke-dasharray="1.5 1"' : ''}/>` +
      `<text x="${x}" y="${y + 1.2}" font-size="3" fill="${cur ? '#1a1307' : '#e6e1d6'}" text-anchor="middle">${esc(label)}</text>` +
      (opt.labels?.[k] ? `<text x="${x}" y="${y + 7.5}" font-size="2.4" fill="#79a9cc" text-anchor="middle">${esc(opt.labels[k])}</text>` : '') + `</g>`;
  });
  const outHtml = outs.map(([a, b, t]) => `${esc(regions[a].name)} → ${esc(regions[b].name)}（${esc(opt.mapName ? opt.mapName(regions[b].map) : regions[b].map)}，${t}分钟）`).join('<br>');
  return `<div class="mapwrap"><svg viewBox="-12 -8 124 ${loose.length && placed.length ? 128 : 118}" xmlns="http://www.w3.org/2000/svg">${lines}${nodes}</svg></div>${outHtml ? `<div class="hint">通往其他地图：<br>${outHtml}</div>` : ''}`;
}
/* 世界总图：把同一世界里的多张子图（如宗门/小镇/城市）画成一张，跨图路线标出路程 */
function worldSVG(maps, regions, routes, cur, sel, vis){
  const ids = Object.keys(maps).filter(m => !vis || vis(m)); if (ids.length < 2) return '';
  const pos = {}; ids.forEach((m, i) => { const o = maps[m]; pos[m] = (typeof o.x === 'number' && typeof o.y === 'number') ? [o.x, o.y] : [50, 12 + i * (76 / Math.max(1, ids.length - 1))]; });
  const pair = {};
  for (const r of routes){ const ma = regions[r.a]?.map, mb = regions[r.b]?.map; if (!ma || !mb || ma === mb || !pos[ma] || !pos[mb]) continue; const k = [ma, mb].sort().join('|'); pair[k] = Math.min(pair[k] ?? Infinity, r.time); }
  let lines = '', nodes = '';
  for (const [k, t] of Object.entries(pair)){ const [a, b] = k.split('|'), A = pos[a], B = pos[b];
    lines += `<line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" stroke="#4a4f59" stroke-width=".8"/><text x="${(A[0] + B[0]) / 2 + 3}" y="${(A[1] + B[1]) / 2}" font-size="3" fill="#8f8b83">${t}分钟</text>`; }
  for (const m of ids){ const [x, y] = pos[m], isCur = m === cur, isSel = m === sel, w = Math.max(22, maps[m].name.length * 4.6 + 8);
    nodes += `<g class="mapnode" data-map-map="${m}"><rect x="${x - w / 2}" y="${y - 5.5}" width="${w}" height="11" rx="3" fill="${isCur ? '#d9a35b' : '#1d2026'}" stroke="${isSel ? '#79a9cc' : '#5a5f69'}" stroke-width="${isSel ? 1.2 : .7}"/><text x="${x}" y="${y + 1.6}" font-size="4.2" fill="${isCur ? '#1a1307' : '#e6e1d6'}" text-anchor="middle">${esc(maps[m].name)}</text></g>`; }
  return `<div class="mapwrap"><svg viewBox="0 0 100 100" style="max-height:44vh" xmlns="http://www.w3.org/2000/svg">${lines}${nodes}</svg></div>`;
}
let mapView = null;
/* 地图页：一棵可展开的树（地图 › 区域 › 地点）。知道路的地方都能直接前往，时间按最短路线合计。 */
function viewMap(){
  const g = S.geo, god = settings.godMode, cur = regionOf(S.location), curMap = g.regions[cur].map, dis = busy ? 'disabled' : '';
  let h = `<div class="crumb" style="font-size:.95em">你在：${pathHTML(S.location)}</div><div class="hint">点开任意一处查看。认得路的地方可以直接前往，路上的时间会自动合计。</div>`;
  for (const [mid, m] of Object.entries(g.maps)){
    const rids = Object.keys(g.regions).filter(k => g.regions[k].map === mid && (god || regionVisible(k))); if (!rids.length) continue;
    const info = {}; rids.forEach(k => info[k] = routeTo(k));
    rids.sort((a, b) => (info[a] ? info[a].time : 1e9) - (info[b] ? info[b].time : 1e9));
    const here = mid === curMap, near = info[rids[0]];
    h += `<details class="mp" data-open="m:${mid}" ${isOpen('m:' + mid, here) ? 'open' : ''}><summary><span>${esc(m.name)}</span><small>${here ? '你在这里' : near ? '最近处 ' + fmtDur(near.time) : '不知道路'}</small></summary>${m.desc ? `<div class="hint">${esc(m.desc)}</div>` : ''}`;
    for (const k of rids){
      const R = g.regions[k], rt = info[k], isCur = k === cur, known = god || R.visited || R.known, places = placesIn(k, !god);
      h += `<details class="rg ${isCur ? 'cur' : ''}" data-open="r:${k}" ${isOpen('r:' + k, isCur) ? 'open' : ''}><summary><span>${esc(R.name)}</span><small>${isCur ? '你在这里' : (R.visited ? '' : '没去过 · ') + (rt ? fmtDur(rt.time) : '不知道路')}</small></summary>
        ${known && R.desc ? `<div class="hint">${esc(R.desc)}</div>` : ''}${known && R.notes ? `<div class="kv"><b>见闻：</b>${esc(R.notes)}</div>` : ''}
        <div class="chips" style="margin:6px 0">${places.map(p => p === S.location ? `<span class="pc here">📍 ${esc(locName(p))}</span>`
          : `<button class="pc" data-act="map-go-place" data-id="${p}" ${dis || (rt ? '' : 'disabled')}>${esc(locName(p))}${g.locations[p].known ? '' : ' (未发现)'}</button>`).join('') || '<span class="hint">还不知道这里有什么地方。</span>'}
          ${isCur ? `<button class="pc find" data-act="map-explore" ${dis}>🔍 找找别处</button>` : ''}</div>
        ${!isCur && rt ? `<button class="btn acc" data-act="map-go-region" data-id="${k}" ${dis}>前往${esc(R.name)} · ${fmtDur(rt.time)}</button>${rt.path.length > 2 ? `<div class="hint">途经：${esc(rt.path.slice(1, -1).map(regionName).join(' → '))}</div>` : ''}` : ''}
        <div class="hint">相连：${esc(regionsAdj(k).filter(x => god || regionVisible(x.id)).map(x => `${g.regions[x.id].map !== mid ? mapName(g.regions[x.id].map) + '·' : ''}${regionName(x.id)}（${fmtDur(x.time)}）`).join('、') || '无')}</div></details>`;
    }
    h += `</details>`;
  }
  return h;
}

  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);

function rMap(s, p){
  ED.specs[p] = s; const ents = Object.entries(fv(p) || {});
  let h = (s.label ? `<label class="f">${esc(s.label)}（${ents.length}）</label>` : '') + (s.hint ? `<div class="hint">${s.hint}</div>` : '');
  for (const [k, it] of ents){ const ip = p + '.' + k;
    h += `<details class="item" data-open="${ip}" ${isOpen(ip) ? 'open' : ''}><summary>${esc(s.title ? s.title(it, k) : k)} <span class="tag">${esc(k)}</span></summary>${rfs(s.sub, ip, it)}<div><button class="btn sm bad" data-ed="del" data-path="${ip}">删除</button></div></details>`; }
  return h + `<button class="btn" data-ed="mapadd" data-path="${p}">＋ ${esc(s.add || '添加')}</button>`;
}
function rKV(s, p){
  ED.specs[p] = s; const obj = fv(p) || {};
  let h = (s.label ? `<label class="f">${esc(s.label)}</label>` : '') + (s.hint ? `<div class="hint">${s.hint}</div>` : '');
  for (const [k, v] of Object.entries(obj)) h += `<div class="row" style="margin-top:6px"><input type="text" style="flex:.9" data-kvkey="${p}" data-old="${esc(k)}" value="${esc(k)}"><input type="text" style="flex:2" data-p="${p}.${k}" data-t="text" value="${esc(v)}"><button class="btn sm bad" style="flex:none;margin:0" data-ed="del" data-path="${p}.${k}">✕</button></div>`;
  return h + `<button class="btn" data-ed="kvadd" data-path="${p}">＋ ${esc(s.add || '添加')}</button>`;
}

function markDirty(){
  if (ED.dirty) return; ED.dirty = true;   // 不整页重绘，避免打断正在进行的点击
  const bar = document.querySelector('.edbar');
  if (bar){ bar.querySelector('.ttl').insertAdjacentHTML('afterend', '<span class="dirty">未保存</span>'); const dis = bar.querySelector('[data-ed="discard"]'); if (dis) dis.disabled = false; }
  const tb = document.querySelector('#tabs [data-tab="editor"]'); if (tb) tb.textContent = '编辑器•';
}
function edChange(el){
  if (el.dataset.kvkey != null){
    const p = el.dataset.kvkey, old = el.dataset.old, nk = el.value.trim(), obj = fv(p) || {};
    if (nk === old) return;
    if (!validId(nk) || obj[nk] !== undefined){ toast(obj[nk] !== undefined ? '名称已存在' : '只能用字母、数字、下划线或中文'); el.value = old; return; }
    const n = {}; for (const [k, v] of Object.entries(obj)) n[k === old ? nk : k] = v;
    setPath(ED.draft, p, n); ED.dirty = true; renderSheet(); return;
  }
  const p = el.dataset.p, t = el.dataset.t; let v;
  if (t === 'check') v = el.checked;
  else if (t === 'num') v = el.value === '' ? null : parseFloat(el.value);
  else if (t === 'list') v = el.value.split('\n').map(x => x.trim()).filter(Boolean);
  else if (t === 'multi') v = [...document.querySelectorAll('#sheetBody input[data-t="multi"]')].filter(x => x.dataset.p === p && x.checked).map(x => x.value);
  else if (t === 'json'){ try { v = el.value.trim() ? JSON.parse(el.value) : (p.endsWith('done_when') ? null : {}); el.classList.remove('bad'); } catch(e){ el.classList.add('bad'); toast('JSON 格式错误，这一项未保存'); return; } }
  else v = el.value;
  setPath(ED.draft, p, v);
  if (el.dataset.rr){ ED.dirty = true; renderSheet(); } else markDirty();
}
async function edClick(b){
  const a = b.dataset.ed, p = b.dataset.path, id = b.dataset.id, d = ED.draft;
  switch (a){
    case 'back': ED.stack.pop(); return renderSheet(false);
    case 'go': ED.stack.push({v:b.dataset.v, id}); return renderSheet(false);
    case 'save': return edSave();
    case 'discard': if (confirm('放弃所有未保存的修改？')){ ED.draft = clone(W); ED.dirty = false; renderSheet(); } return;
    case 'add': { const s = ED.specs[p], list = arr(fv(p)); list.push(s.newItem ? s.newItem() : {}); setPath(d, p, list); ED.open[p + '.' + (list.length - 1)] = true; break; }
    case 'del': if (!confirm('确定删除？')) return; delPath(d, p); break;
    case 'up': case 'down': {
      const ks = p.split('.'), i = +ks.pop(), lp = ks.join('.'), list = fv(lp), j = a === 'up' ? i - 1 : i + 1;
      if (j < 0 || j >= list.length) return; [list[i], list[j]] = [list[j], list[i]]; ED.open[lp + '.' + j] = ED.open[p]; ED.open[p] = false; break; }
    case 'mapadd': {
      const s = ED.specs[p], obj = fv(p) || {}, nid = prompt('给它起个ID（英文字母/数字，程序内部引用用）：', s.newId ? s.newId() : rid('x'));
      if (!nid) return; if (!validId(nid) || obj[nid]) return toast(obj[nid] ? 'ID 已存在' : 'ID 只能用字母、数字、下划线或中文');
      obj[nid] = s.newItem(); setPath(d, p, obj); ED.open[p + '.' + nid] = true; break; }
    case 'kvadd': {
      const obj = fv(p) || {}, k = prompt('标记名（英文，如 found_key）：'); if (!k) return;
      if (!validId(k) || obj[k] !== undefined) return toast('名称无效或已存在'); obj[k] = ''; setPath(d, p, obj); break; }
    case 'npc-add': { const nid = uniqueId('npc', d.npcs); d.npcs[nid] = normalizeNpc({name:'新角色', relations:{player:{type:'陌生人', note:'', dims:{}}}}, d); ED.stack.push({v:'npc', id:nid}); ED.dirty = true; return renderSheet(false); }
    case 'npc-del': {
      if (!confirm(`删除角色「${d.npcs[id]?.name}」？`)) return;
      delete d.npcs[id]; for (const n of Object.values(d.npcs)) delete n.relations[id];
      ED.stack.pop(); ED.dirty = true; return renderSheet(false); }
    case 'loc-add': {
      const rid = d.regions[id] ? id : Object.keys(d.regions)[0], nid = uniqueId('loc', d.locations);
      d.locations[nid] = {name:'新地点', region:rid, desc:'', tags:[], known:false}; ED.stack.push({v:'loc', id:nid}); ED.dirty = true; return renderSheet(false); }
    case 'loc-del': {
      if (Object.keys(d.locations).length <= 1) return toast('至少要保留一个地点');
      if (!confirm(`删除地点「${d.locations[id]?.name}」？引用它的日程也会被移除。`)) return;
      delete d.locations[id];
      for (const n of Object.values(d.npcs)){ n.schedule = n.schedule.filter(s => s.at !== id); n.secrets.forEach(s => { if (s.where === id) s.where = ''; }); }
      for (const r of Object.values(d.regions)) if (r.entry === id) r.entry = '';
      if (d.start.location === id) d.start.location = Object.keys(d.locations)[0];
      ED.stack.pop(); ED.dirty = true; return renderSheet(false); }
    case 'region-add': { const nid = uniqueId('region', d.regions); d.regions[nid] = {name:'新区域', map:Object.keys(d.maps)[0], icon:'dot', x:50, y:50, desc:'', notes:'', gen_style:'', open:true, known:false, entry:'', inner_time:5, tags:[]}; ED.stack.push({v:'region', id:nid}); ED.dirty = true; return renderSheet(false); }
    case 'region-del': {
      if (Object.values(d.locations).some(l => l.region === id)) return toast('先把这个区域里的地点删除或移到别的区域');
      if (!confirm(`删除区域「${d.regions[id]?.name}」及相关路线？`)) return;
      delete d.regions[id]; d.routes = d.routes.filter(r => r.a !== id && r.b !== id);
      ED.stack.pop(); ED.dirty = true; return renderSheet(false); }
    case 'geo-collect': {
      if (!S?.geo) return; let n = 0;
      for (const k of ['maps', 'regions', 'locations']) for (const [gid0, v] of Object.entries(S.geo[k])) if (!d[k][gid0]){ const o = clone(v); delete o.visited; d[k][gid0] = o; n++; }
      for (const [rid, r] of Object.entries(S.geo.regions)) if (d.regions[rid] && r.notes && r.notes !== d.regions[rid].notes){ d.regions[rid].notes = r.notes; n++; }
      for (const r of S.geo.routes) if (!d.routes.some(x => (x.a === r.a && x.b === r.b) || (x.a === r.b && x.b === r.a))){ d.routes.push(clone(r)); n++; }
      toast(n ? `已收录 ${n} 项，检查后记得保存` : '存档里没有新的内容'); break; }
    case 'reladd': { const t = $('#reladd').value; d.npcs[id].relations[t] = {type:'', note:'', dims:{}}; ED.open[`npcs.${id}.relations.${t}`] = true; break; }
    case 'json-apply': {
      const j = parseJSON($('#edJson').value); if (!isObj(j)) return toast('JSON 格式错误');
      const w = normalizeWorld(j); if (w.meta.id !== W.meta.id){ w.meta.id = W.meta.id; toast('世界ID保持不变；要另存为新世界请用「世界库 → 导入」'); }
      ED.draft = w; ED.dirty = true; return renderSheet();
    }
    case 'ai-npc-new': case 'ai-npc-fill': case 'ai-loc-new': case 'ai-loc-fill': case 'ai-lore': case 'ai-region-fill':
      return aiAction(a, id, p);
  }
  ED.dirty = true; renderSheet();
}
function edSave(){
  const w = normalizeWorld(ED.draft); w.meta.id = W.meta.id;
  const errs = validateWorld(w);
  if (errs.length) return alert('有问题需要修正：\n' + errs.slice(0, 10).join('\n'));
  const oldW = W;
  W = w; libPut(W); ED.draft = clone(W); ED.dirty = false;
  let n = 0;
  if (S){ syncStateToWorld(); n = syncEditsToState(oldW, W) + syncGeoEdits(oldW, W); autosave(); }
  toast(n ? `已保存，${n} 处角色改动已同步到当前存档` : '已保存'); render();
}
/* 编辑器里改动过的地图内容，覆盖到存档（已知/到访状态不动；AI 生成的内容保留） */
function syncGeoEdits(a, b){
  const g = S.geo, same = (x, y) => JSON.stringify(x) === JSON.stringify(y); let n = 0;
  for (const k of ['maps', 'regions', 'locations']){
    for (const [id, vb] of Object.entries(b[k])){
      const va = a[k]?.[id]; if (!va || !g[k][id]) continue;
      for (const f of Object.keys(vb)) if (f !== 'visited' && !same(va[f], vb[f]) && setL(`geo.${k}.${id}.${f}`, clone(vb[f]), '作者', '在编辑器中修改')) n++;
    }
    for (const id of Object.keys(a[k] || {})) if (!b[k][id] && g[k][id] && id !== S.location && !(k === 'regions' && id === regionOf(S.location))){ delete g[k][id]; n++; }
  }
  if (!same(a.routes, b.routes)){
    const key = r => [r.a, r.b].sort().join('|'), oldKeys = new Set(a.routes.map(key));
    const extra = g.routes.filter(r => !oldKeys.has(key(r)));
    if (setL('geo.routes', [...clone(b.routes), ...extra.filter(r => !b.routes.some(x => key(x) === key(r)))], '作者', '在编辑器中修改')) n++;
  }
  return n;
}
/* 编辑器里改动过的角色字段，覆盖到存档的当前值（没改动的字段保留 AI 维护的版本） */
function syncEditsToState(a, b){
  let n = 0; const same = (x, y) => JSON.stringify(x) === JSON.stringify(y);
  for (const [id, nb] of Object.entries(b.npcs)){
    const na = a.npcs[id], ns = S.npcs[id]; if (!na || !ns?.card) continue;
    for (const k of CARD_KEYS){
      if (same(na[k], nb[k])) continue;
